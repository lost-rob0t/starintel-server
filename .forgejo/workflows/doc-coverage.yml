name: Docstring coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  doc-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        run: |
          sh <(curl -L https://nixos.org/nix/install) --daemon
          echo "experimental-features = nix-command flakes" | tee -a /etc/nix/nix.conf

      - name: Verify every exported symbol has a docstring
        run: nix run .#doc-coverage-test

      - name: Regenerate API reference (org)
        run: nix run .#gen-api-docs

      - name: Fail if generated docs drifted from source
        run: |
          if ! git diff --exit-code -- doc/api/; then
            echo "doc/api/ is stale; run 'make docs-api' and commit."
            exit 1
          fi
