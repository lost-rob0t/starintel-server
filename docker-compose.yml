name: starintel

services:
  clouseau:
    image: starintel/clouseau:3.3.0
    hostname: clouseau
    domainname: starintel.internal
    restart: unless-stopped
    environment:
      CLOUSEAU_COOKIE_FILE: /run/secrets/erlang_cookie
      JAVA_TOOL_OPTIONS: ${CLOUSEAU_JAVA_OPTS:--Xms256m -Xmx1g}
    secrets:
      - erlang_cookie
    volumes:
      - clouseau_index:/var/lib/clouseau
    networks:
      backend:
        aliases:
          - clouseau.starintel.internal
    healthcheck:
      test:
        - CMD-SHELL
        - epmd -names | grep -q 'name clouseau at port'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  couchdb:
    image: starintel/couchdb:3.5.2
    hostname: couchdb
    domainname: starintel.internal
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD_FILE: /run/secrets/couchdb_password
      COUCHDB_SECRET_FILE: /run/secrets/couchdb_secret
      COUCHDB_ERLANG_COOKIE_FILE: /run/secrets/erlang_cookie
      NODENAME: couchdb.starintel.internal
    secrets:
      - couchdb_password
      - couchdb_secret
      - erlang_cookie
    volumes:
      - couchdb_data:/opt/couchdb/data
    ports:
      - "${COUCHDB_BIND_ADDRESS:-127.0.0.1}:${COUCHDB_PORT:-5984}:5984"
    networks:
      backend:
        aliases:
          - couchdb.starintel.internal
    depends_on:
      clouseau:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:5984/_up]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4.3.4-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-starintel}
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        export RABBITMQ_DEFAULT_PASS="$$(< /run/secrets/rabbitmq_password)"
        exec /usr/local/bin/docker-entrypoint.sh rabbitmq-server
    secrets:
      - rabbitmq_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - backend
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  star-server:
    image: starintel/server:0.1.0
    hostname: star-server
    restart: unless-stopped
    environment:
      COUCHDB_HOST: couchdb
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-starintel}
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD_FILE: /run/secrets/couchdb_password
      RABBITMQ_ADDRESS: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-starintel}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      HTTP_API_LISTEN_ADDRESS: 0.0.0.0
      STAR_AUTH_MODE: api-key
      STAR_AUTH_DATABASE: ${STAR_AUTH_DATABASE:-starintel-gserver-auth}
      STAR_AUTH_PEPPER_FILE: /run/secrets/auth_pepper
      STAR_AUTH_BOOTSTRAP_SECRET_FILE: /run/secrets/auth_bootstrap_secret
      STAR_AUTH_ALLOWED_ORIGINS: ${STAR_AUTH_ALLOWED_ORIGINS:-}
      STAR_SERVER_INIT_FILE: ${STAR_SERVER_INIT_FILE:-/etc/starintel/init.lisp}
    secrets:
      - couchdb_password
      - rabbitmq_password
      - auth_pepper
      - auth_bootstrap_secret
    volumes:
      - type: bind
        source: ${STAR_SERVER_INIT_HOST_FILE:-./docker/star-server-init.lisp}
        target: /etc/starintel/init.lisp
        read_only: true
    ports:
      - "${STAR_SERVER_BIND_ADDRESS:-127.0.0.1}:${STAR_SERVER_PORT:-5000}:5000"
    networks:
      - backend
    depends_on:
      couchdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:5000/health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

secrets:
  couchdb_password:
    file: ${CREDENTIALS_DIR:-./secrets}/couchdb_password
  couchdb_secret:
    file: ${CREDENTIALS_DIR:-./secrets}/couchdb_secret
  erlang_cookie:
    file: ${CREDENTIALS_DIR:-./secrets}/erlang_cookie
  rabbitmq_password:
    file: ${CREDENTIALS_DIR:-./secrets}/rabbitmq_password
  auth_pepper:
    file: ${CREDENTIALS_DIR:-./secrets}/auth_pepper
  auth_bootstrap_secret:
    file: ${CREDENTIALS_DIR:-./secrets}/auth_bootstrap_secret

volumes:
  clouseau_index:
  couchdb_data:
  rabbitmq_data:

networks:
  backend:
