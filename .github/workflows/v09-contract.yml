name: v0.9 contract

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master
      - dev
      - "agent/schema-org-v0.9"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: python -m unittest discover -s tests -p 'test_*contract.py' -v
      - run: node tests/check-view-js.mjs
      - run: git diff --check

  clos-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run CLOS/MOP document conformance
        id: conformance
        shell: bash
        run: |
          set +e
          docker build --target conformance --progress=plain \
            -t starintel-conformance . > /tmp/conformance.log 2>&1
          status=$?
          tail -n 180 /tmp/conformance.log > /tmp/conformance-tail.log
          cat /tmp/conformance-tail.log
          exit "$status"
      - name: Upload CLOS conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clos-conformance-tail
          path: /tmp/conformance-tail.log
