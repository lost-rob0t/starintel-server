name: v0.9 contract

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master
      - dev
      - "agent/schema-org-v0.9"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: python -m unittest discover -s tests -p 'test_*contract.py' -v
      - run: node tests/check-view-js.mjs
      - run: git diff --check

  clos-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run CLOS/MOP document conformance
        run: docker build --target conformance --progress=plain -t starintel-conformance .
