name: Reconcile v0.9 with dev

on:
  push:
    branches:
      - agent/reconcile-v09-dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'agent/reconcile-v09-dev' || github.ref_name == 'agent/reconcile-v09-dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/reconcile-v09-dev

      - name: Merge v0.9 history
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/schema-org-v0.9

          if git merge-base --is-ancestor origin/agent/schema-org-v0.9 HEAD; then
            echo "v0.9 branch is already integrated"
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit -X ours origin/agent/schema-org-v0.9
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              if git cat-file -e "HEAD:$path" 2>/dev/null; then
                git checkout --ours -- "$path"
                git add -- "$path"
              else
                git rm -f --ignore-unmatch -- "$path"
              fi
            done < <(git diff --name-only --diff-filter=U)
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge paths remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git commit -m "Reconcile v0.9 work with dev"
          git push origin HEAD:agent/reconcile-v09-dev
