name: Expert Shell

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: expert-shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lisa-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LISP: sbcl-bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libssl-dev \
            libffi-dev \
            librabbitmq-dev \
            pkg-config

      - name: Set up Common Lisp and locked dependencies
        uses: 40ants/setup-lisp@v4

      - name: Run expert-shell tests
        shell: lispsh -eo pipefail {0}
        run: |
          qlot exec sbcl --non-interactive --no-userinit --no-sysinit \
            --eval '(require :asdf)' \
            --eval '(asdf:test-system :starintel-expert-shell-tests)'

      - name: Build star-expert executable
        shell: lispsh -eo pipefail {0}
        run: |
          qlot exec sbcl --non-interactive --no-userinit --no-sysinit \
            --eval '(require :asdf)' \
            --eval '(asdf:make :starintel-expert-shell)'
          test -x star-expert
