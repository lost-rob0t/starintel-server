name: Operation 0.9.1 star-cl lock sync

on:
  push:
    branches: [feat/operation-object-151]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[star-cl-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/operation-object-151
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Pin merged star-cl runtime
        run: |
          nix flake lock --update-input star-cl \
            --override-input star-cl github:lost-rob0t/star-cl/138e3ff3334954491db862ab583058058e35e64d
          test "$(jq -r '.nodes["star-cl"].locked.rev' flake.lock)" = "138e3ff3334954491db862ab583058058e35e64d"
      - name: Commit lock update
        run: |
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(nix): pin merged star-cl operation runtime [star-cl-sync]"
          git push origin HEAD:feat/operation-object-151
