                        (dtype \\\"actorevent\\\")\\n                              (actor-name \\\"crawler\\\")\\n                              (component \\\"url-fetcher\\\")\\n                              (event-type \\\"document.fetched\\\")\\n                              (details \\\"ok\\\")\\n                              (source-id \\\"source-1\\\")\\n                              (trace-id \\\"trace-1\\\")\\n                              (generation 2))\\n  (jsown:to-json\\n   (jsown:new-js\\n     (\\\"_id\\\" id)\\n     (\\\"timestamp\\\" timestamp)\\n     (\\\"dtype\\\" dtype)\\n     (\\\"actorName\\\" actor-name)\\n     (\\\"component\\\" component)\\n     (\\\"eventType\\\" event-type)\\n     (\\\"details\\\" details)\\n     (\\\"sourceId\\\" source-id)\\n     (\\\"traceId\\\" trace-id)\\n     (\\\"generation\\\" generation))))\\n\\n(test actor-event-timestamp-and-dtype-initialize-independently\\n  (let ((event\\n          (star.actors:make-actor-event\\n           :id \\\"event-independent\\\"\\n           :timestamp 123456789\\n           :dtype \\\"actorevent\\\"\\n           :actor-name \\\"scheduler\\\"\\n           :event-type \\\"target.started\\\")))\\n    (is (= 123456789 (star.actors::event-timestamp event)))\\n    (is (string= \\\"actorevent\\\" (star.actors::doc-type event)))\\n    (is (string= \\\"scheduler\\\" (star.actors:event-component event)))))\\n\\n(test legacy-event-fixture-migrates-through-one-codec\\n  (let* ((payload\\n           \\\"{\\\\\\\"_id\\\\\\\":\\\\\\\"legacy-1\\\\\\\",\\\\\\\"timestamp\\\\\\\":1770000001,\\\\\\\"actorName\\\\\\\":\\\\\\\"legacy-actor\\\\\\\",\\\\\\\"eventType\\\\\\\":\\\\\\\"legacy.event\\\\\\\",\\\\\\\"details\\\\\\\":\\\\\\\"migrated\\\\\\\",\\\\\\\"sourceId\\\\\\\":\\\\\\\"source-old\\\\\\\"}\\\")\\n         (event (star.actors:decode-actor-event payload)))\\n    (is (string= \\\"legacy-1\\\" (star.actors::event-id event)))\\n    (is (string= \\\"actorevent\\\" (star.actors::doc-type event)))\\n    (is (string= \\\"legacy-actor\\\" (star.actors:event-component event)))\\n    (is (= 0 (star.actors:event-generation event)))\\n    (is (string= \\\"source-old\\\"\\n                 (star.actors::event-source-document event)))))\\n\\n(test valid-event-is-persisted-once-and-acked\\n  (let ((persist-count 0)\\n        (persisted-id nil))\\n    (let ((settlement\\n            (star.actors:process-event-delivery\\n             (valid-event-payload)\\n             :persist-fn\\n             (lambda (event)\\n               (incf persist-count)\\n               (setf persisted-id (star.actors::event-id event))\\n               (star.actors::make-couchdb-result\\n                :status :success\\n                :operation :insert\\n                :document-id persisted-id)))))\\n      (is (= 1 persist-count))\\n      (is (string= \\\"event-1\\\" persisted-id))\\n      (is (eq :ack\\n              (star.consumers:consumer-settlement-action settlement)))\\n      (is (eq :persisted\\n              (star.consumers:consumer-settlement-reason settlement))))))\\n\\n(test duplicate-event-delivery-is-idempotently-acked\\n  (let ((persist-count 0))\\n    (let ((settlement\\n            (star.actors:process-event-delivery\\n             (valid-event-payload :id \\\"duplicate-1\\\")\\n             :persist-fn\\n             (lambda (event)\\n               (declare (ignore event))\\n               (incf persist-count)\\n               (star.actors::make-couchdb-result\\n                :status :exists\\n                :operation :insert\\n                :document-id \\\"duplicate-1\\\")))))\\n      (is (= 1 persist-count))\\n      (is (eq :ack\\n              (star.consumers:consumer-settlement-action settlement)))\\n      (is (eq :duplicate\\n              (star.consumers:consumer-settlement-reason settlement))))))\\n\\n(test invalid-event-is-dead-lettered-without-persistence\\n  (let ((persist-called-p nil))\\n    (let ((settlement\\n            (star.actors:process-event-delivery\\n             \\\"{\\\\\\\"_id\\\\\\\":\\\\\\\"invalid-1\\\\\\\",\\\\\\\"timestamp\\\\\\\":1770000002,\\\\\\\"actorName\\\\\\\":\\\\\\\"crawler\\\\\\\"}\\\"\\n             :persist-fn\\n             (lambda (event)\\n               (declare (ignore event))\\n               (setf persist-called-p t)\\n               (error \\\"Invalid events must not persist.\\\")))))\\n      (is-false persist-called-p)\\n      (is (eq :dead-letter\\n              (star.consumers:consumer-settlement-action settlement)))\\n      (is (eq :invalid-event\\n              (star.consumers:consumer-settlement-reason settlement)))\\n      (is (typep (star.consumers:consumer-settlement-condition settlement)\\n                 'star.actors:invalid-actor-event)))))\\n\\n(test persistence-failure-is-retried\\n  (let ((settlement\\n          (star.actors:process-event-delivery\\n           (valid-event-payload :id \\\"retry-1\\\")\\n           :persist-fn\\n           (lambda (event)\\n             (declare (ignore event))\\n             (star.actors::make-couchdb-result\\n              :status :error\\n              :operation :insert\\n              :document-id \\\"retry-1\\\"\\n              :error-message \\\"CouchDB unavailable\\\")))))\\n    (is (eq :retry\\n            (star.consumers:consumer-settlement-action settlement)))\\n    (is (eq :persistence-failed\\n            (star.consumers:consumer-settlement-reason settlement)))))\\n\\n(test event-consumer-builds-bounded-retry-runtime\\n  (let* ((consumer\\n           (star.consumers:create-rabbit-consumer\\n            :name \\\"events-test\\\"\\n            :queue-name \\\"events\\\"\\n            :exchange-name \\\"events\\\"\\n            :routing-key \\\"event.#\\\"\\n            :queue-durable t\\n            :exchange-durable t\\n            :max-retries 4\\n            :quarantine-exchange \\\"events.quarantine\\\"\\n            :quarantine-queue \\\"events.quarantine.queue\\\"\\n            :handler-fn #'identity))\\n         (stream (star.consumers:consumer-stream consumer)))\\n    (is (typep consumer 'star.consumers:retrying-rabbit-consumer))\\n    (is (typep stream 'star.consumers:retrying-rabbit-queue-stream))\\n    (is-true (star.consumers:rabbit-stream-queue-durable-p stream))\\n    (is-true (star.consumers:rabbit-exchange-durable-p stream))\\n    (is (= 4\\n           (star.consumers:retry-policy-max-retries\\n            (star.consumers:retry-stream-policy stream))))))\\n\\n(test actor-event-default-clock-does-not-require-historical-spec-package\\n  (let* ((before (- (get-universal-time) 2208988800))\\n         (event (star.actors:make-actor-event :actor-name \\\"clock\\\" :event-type \\\"clock.test\\\"))\\n         (direct (make-instance 'star.actors:actor-event))\\n         (after (- (get-universal-time) 2208988800)))\\n    (dolist (value (list (star.actors:event-timestamp event)\\n                        (star.actors:event-timestamp direct)))\\n      (is (integerp value))\\n      (is (<= before value after)))))\\n\"},{\"path\":\"t/system-load-test.lisp\",\"expected\":\"47d7c612c223ae24c06f773546f72314833bdef2\",\"content\":\"(in-package :star-server-tests)\\n\\n(defparameter *project-asdf-systems*\\n  '(:starintel-gserver\\n    :starintel-gserver-client\\n    :star-cli\\n    :star-ui\\n    :star-migrations\\n    :starintel-gserver-tests))\\n\\n(defparameter *project-packages*\\n  '(:starintel-gserver\\n    :star.consumers\\n    :star.producers\\n    :star.databases.couchdb\\n    :star.rabbit\\n    :star.actors\\n    :star.actors.matcher\\n    :starintel-gserver-http-api\\n    :starintel-gserver-client\\n    :star-cli\\n    :star-ui\\n    :star.migrations\\n    :star-server-tests))\\n\\n(def-suite system-load-tests\\n  :description \\\"Compile/load coverage for every project system and package\\\")\\n\\n(in-suite system-load-tests)\\n\\n(test every-unit-asdf-system-is-loaded\\n  (dolist (system *project-asdf-systems*)\\n    (let ((component (asdf:find-system system nil)))\\n      (is (not (null component))\\n          \\\"ASDF system ~s is discoverable\\\" system)\\n      (is (and component\\n               (asdf:component-loaded-p component))\\n          \\\"ASDF system ~s was loaded through declared dependencies\\\" system))))\\n\\n(test every-package-exists\\n  (dolist (package *project-packages*)\\n    (is (find-package package)\\n        \\\"Package ~s exists after loading its ASDF system\\\" package)))\\n\\n(test canonical-root-and-explicit-legacy-packages-stay-distinct\\n  (is-false (find-package :spec))\\n  (is (find-package :starintel.legacy))\\n  (is (string= \\\"0.10.1\\\" (starintel:schema-version)))\\n  (is (string= \\\"0.9.0\\\" starintel.legacy:+starintel-doc-version+))\\n  (is-false (find-class 'starintel:host nil))\\n  (is (find-class 'starintel.legacy:host nil)))\\n\"},{\"path\":\"t/v0101-runtime-test.lisp\",\"expected\":\"9fe81c7b265f5a9eb83fd58ab484663681508165\",\"content\":\"(in-package :star-server-tests)\\n\\n(def-suite v0101-runtime-tests :description \\\"StarLang-generated 0.10.1 ingress and storage boundary\\\")\\n(in-suite v0101-runtime-tests)\\n\\n(defun v0101-person (&optional (id \\\"canonical:person\\\"))\\n  (jsown:new-js (\\\"id\\\" id) (\\\"dataset\\\" \\\"canonical-tests\\\") (\\\"dtype\\\" \\\"person\\\")\\n                (\\\"schemaVersion\\\" \\\"0.10.1\\\") (\\\"fname\\\" \\\"Ada\\\")))\\n\\n(test canonical-flat-document-passes-http-ingress\\n  (let ((document (v0101-person)))\\n    (is (eq document (star.frontends.http-api:validate-document-input document :path-dtype \\\"person\\\")))\\n    (is-false (jsown:keyp document \\\"_id\\\"))\\n    (is (string= \\\"canonical:person\\\" (star.documents:document-id document)))))\\n\\n(test canonical-http-rejects-unknown-fields-and-referenced-enums\\n  (let ((document (v0101-person)))\\n    (setf (jsown:val document \\\"_id\\\") \\\"canonical:person\\\")\\n    (let ((condition (capture-http-input-error\\n                      (lambda () (star.frontends.http-api:validate-document-input document)))))\\n      (is (= 422 (star.frontends.http-api:http-input-error-status condition)))))\\n  (let ((document (jsown:new-js (\\\"id\\\" \\\"wireless:test\\\") (\\\"dataset\\\" \\\"canonical-tests\\\")\\n                               (\\\"dtype\\\" \\\"wireless-network\\\") (\\\"schemaVersion\\\" \\\"0.10.1\\\")\\n                               (\\\"bssid\\\" \\\"aa:bb:cc:dd:ee:ff\\\") (\\\"security\\\" \\\"wpa4\\\"))))\\n    (let ((condition (capture-http-input-error\\n                      (lambda () (star.frontends.http-api:validate-document-input document)))))\\n      (is (= 422 (star.frontends.http-api:http-input-error-status condition))))))\\n\\n(test canonical-rabbit-ingress-validates-before-storage-identity\\n  (let* ((wire (v0101-person))\\n         (stored (star.rabbit:decode-rabbit-document (cons (jsown:to-json wire) 1))))\\n    (is (string= \\\"canonical:person\\\" (jsown:val stored \\\"_id\\\")))\\n    (is (string= \\\"canonical:person\\\" (jsown:val stored \\\"id\\\")))\\n    (is (string= \\\"0.10.1\\\" (jsown:val stored \\\"schemaVersion\\\")))\\n    (is-false (jsown:keyp stored \\\"schema_version\\\"))))\\n\\n(test canonical-invalid-rabbit-document-cannot-reach-persistence\\n  (let ((persisted nil) (document (v0101-person)))\\n    (setf (jsown:val document \\\"createdAt\\\") -1)\\n    (signals star.consumers:schema-invalid-delivery-error\\n      (star.rabbit::process-rabbit-document-mutation\\n       (cons (jsown:to-json document) 1) :new\\n       :persist-fn (lambda (&rest args) (declare (ignore args)) (setf persisted t))))\\n    (is-false persisted)))\\n\\n(test canonical-internal-transport-roundtrip-preserves-server-tenancy\\n  (let ((document (star.documents:ensure-document (v0101-person))))\\n    (setf (jsown:val document \\\"tenant_id\\\") \\\"canonical-tenant\\\")\\n    (let* ((body (star.documents:document-json document))\\n           (wire (jsown:parse body))\\n           (decoded (star.rabbit:decode-rabbit-document (cons body 1))))\\n      (is-false (jsown:keyp wire \\\"_id\\\"))\\n      (is (string= \\\"canonical:person\\\" (jsown:val decoded \\\"_id\\\")))\\n      (is (string= \\\"canonical-tenant\\\" (jsown:val decoded \\\"tenant_id\\\"))))))\\n\\n(test canonical-storage-egress-keeps-only-canonical-envelope\\n  (let ((stored (star.documents:ensure-document (v0101-person))))\\n    (setf (jsown:val stored \\\"_rev\\\") \\\"2-server\\\"\\n          (jsown:val stored \\\"tenant_id\\\") \\\"private-tenant\\\")\\n    (let ((wire (star.frontends.http-api::strip-server-tenant-fields stored)))\\n      (is (string= \\\"2-server\\\" (jsown:val wire \\\"rev\\\")))\\n      (is-false (jsown:keyp wire \\\"_id\\\"))\\n      (is-false (jsown:keyp wire \\\"_rev\\\"))\\n      (is-false (jsown:keyp wire \\\"tenant_id\\\"))\\n      (is (eq wire (star.documents:validate-document wire))))))\\n\\n(test canonical-update-preserves-identity-and-validates-merged-state\\n  (let* ((existing (star.documents:ensure-document (v0101-person)))\\n         (saved nil)\\n         (outcome (star.databases.couchdb::upsert-document-update\\n                   (lambda (id) (declare (ignore id)) existing)\\n                   (lambda (document) (setf saved document))\\n                   \\\"canonical:person\\\" (jsown:new-js (\\\"lname\\\" \\\"Lovelace\\\")))))\\n    (is (eq :updated (star.databases.couchdb:document-update-outcome-status outcome)))\\n    (is (string= \\\"Lovelace\\\" (jsown:val saved \\\"lname\\\")))\\n    (is (string= \\\"canonical:person\\\" (jsown:val saved \\\"id\\\")))\\n    (is (eq saved (star.documents:validate-stored-document saved)))\\n    (let ((wire (jsown:val (star.databases.couchdb:document-update-outcome-json outcome) \\\"document\\\")))\\n      (is-false (jsown:keyp wire \\\"_id\\\"))\\n      (is (eq wire (star.documents:validate-document wire))))))\\n\\n(test canonical-update-cannot-change-version-or-id\\n  (dolist (patch (list (jsown:new-js (\\\"schemaVersion\\\" \\\"0.10.2\\\"))\\n                      (jsown:new-js (\\\"id\\\" \\\"different:person\\\"))))\\n    (let ((outcome (star.databases.couchdb::upsert-document-update\\n                    (lambda (id) (declare (ignore id))\\n                      (star.documents:ensure-document (v0101-person)))\\n                    (lambda (document) (declare (ignore document)) (error \\\"must not persist\\\"))\\n                    \\\"canonical:person\\\" patch)))\\n      (is (eq :validation-failed (star.databases.couchdb:document-update-outcome-status outcome))))))\\n\\n(test canonical-search-rows-project-storage-fields-and-outbox-payloads\\n  (dolist (vector-p '(nil t))\\n    (let* ((stored (star.documents:ensure-document (v0101-person)))\\n           (payload (star.documents:clone-document-object stored)))\\n      (setf (jsown:val stored \\\"_rev\\\") \\\"2-search\\\"\\n            (jsown:val stored \\\"tenant_id\\\") \\\"private-tenant\\\"\\n            (jsown:val payload \\\"tenant_id\\\") \\\"private-tenant\\\"\\n            (jsown:val stored \\\"extensions\\\")\\n            (jsown:new-js (\\\"_server_outbox\\\"\\n                           (vector (jsown:new-js (\\\"payload\\\" payload))))))\\n      (let* ((row (jsown:new-js (\\\"doc\\\" stored)\\n                               (\\\"fields\\\" (star.documents:clone-document-object stored))))\\n             (response (jsown:new-js (\\\"rows\\\" (if vector-p (vector row) (list row))))))\\n        (star.frontends.http-api:strip-server-tenant-from-rows response)\\n        (let ((result (elt (jsown:val response \\\"rows\\\") 0)))\\n          (dolist (key '(\\\"doc\\\" \\\"fields\\\"))\\n            (let ((wire (jsown:val result key)))\\n              (is-false (jsown:keyp wire \\\"_id\\\"))\\n              (is-false (jsown:keyp wire \\\"_rev\\\"))\\n              (is-false (jsown:keyp wire \\\"tenant_id\\\"))\\n              (is (string= \\\"2-search\\\" (jsown:val wire \\\"rev\\\")))\\n              (is (eq wire (star.documents:validate-document wire)))))\\n          (let* ((extensions (jsown:val (jsown:val result \\\"doc\\\") \\\"extensions\\\"))\\n                 (outbox (elt (jsown:val extensions \\\"_server_outbox\\\") 0))\\n                 (wire (jsown:val outbox \\\"payload\\\")))\\n            (is-false (jsown:keyp wire \\\"tenant_id\\\"))\\n            (is-false (jsown:keyp wire \\\"_id\\\"))\\n            (is (eq wire (star.documents:validate-document wire)))))))))\\n\\n(test canonical-message-cannot-enter-historical-url-extractor\\n  (let* ((calls 0)\\n         (symbols '(starintel.legacy:new-url starintel.legacy:new-relation\\n                    star.databases.couchdb:as-json star.actors:publish))\\n         (originals (mapcar #'symbol-function symbols)))\\n    (unwind-protect\\n         (progn\\n           (dolist (symbol symbols)\\n             (setf (symbol-function symbol)\\n                   (lambda (&rest args)\\n                     (declare (ignore args))\\n                     (incf calls)\\n                     (error \\\"Historical side effect must not run.\\\"))))\\n           (dolist (document\\n                    (list\\n                     (jsown:new-js (\\\"id\\\" \\\"canonical:message\\\") (\\\"dataset\\\" \\\"canonical-tests\\\")\\n                                   (\\\"dtype\\\" \\\"message\\\") (\\\"schemaVersion\\\" \\\"0.10.1\\\")\\n                                   (\\\"message\\\" \\\"https://example.org/\\\") (\\\"platform\\\" \\\"test\\\"))\\n                     (jsown:new-js (\\\"id\\\" \\\"canonical:message\\\") (\\\"_id\\\" \\\"canonical:message\\\")\\n                                   (\\\"schemaVersion\\\" \\\"0.10.1\\\") (\\\"content\\\" \\\"https://example.org/\\\"))\\n                     (jsown:new-js (\\\"schemaVersion\\\" nil) (\\\"content\\\" \\\"https://example.org/\\\"))\\n                     (jsown:new-js (\\\"id\\\" nil) (\\\"content\\\" \\\"https://example.org/\\\"))\\n                     (jsown:new-js (\\\"id\\\" \\\"\\\") (\\\"content\\\" \\\"https://example.org/\\\"))))\\n             (let ((condition\\n                     (handler-case\\n                         (progn (star.actors.matcher::process-legacy-url-extractor-message document) nil)\\n                       (error (value) value))))\\n               (is (typep condition 'simple-error))\\n               (is (search \\\"Canonical URL extraction is unsupported\\\" (princ-to-string condition)))\\n               (is (= 0 calls))\\n               (is-false (jsown:keyp document \\\"schema_version\\\")))))\\n      (loop for symbol in symbols for original in originals\\n            do (setf (symbol-function symbol) original)))))\\n\"},{\"path\":\"docs/canonical-compatibility.md\",\"expected\":null,\"content\":\"# Canonical and retained legacy boundaries\\n\\nThe default star-cl API is generated StarIntel 0.10.1. Canonical ingress,\\nvalidation, persistence and readback use that authority. Historical CLOS\\nconstructors and fixtures explicitly load `starintel-legacy` and name\\n`STARINTEL.LEGACY`; the retired `SPEC` alias is not restored.\\n\\nLegacy HTTP envelope normalization and the existing Target constructor retain\\ntheir historical schema version. Canonical Target options and persisted actor\\noutput proof remain tracked by issue #319.\\n\\nThe historical URL extractor retains its old URL/relation output and routing.\\nIt explicitly logs and rejects canonical input before construction/publication.\\nCanonical matcher support is unsupported and remains issue #44, which requires\\nits own implementation approval. This dependency adoption does not claim that\\nall active producers are canonical. The CLI MOP generator also remains an\\nexplicitly legacy document generator.\\n\\nQlot 1.6 natively normalizes the cl+ssl lock label from ql-2024-10-12 to\\nql-2023-10-21. Both dated distributions have identical cl+ssl release and\\nsystem/dependency metadata and the same 92,364-byte archive, SHA256\\n`554e8cf79771221cf3991085da9b7cb659a78fd7ff71c81ae56d524f2d1eec46`.\\nThis exact label normalization is checked separately from the maintained\\nstar-cl update; other dependency entries remain unchanged.\\n\"}]")
          for item in changes:
              p=root/item["path"]
              if item["expected"] is None:
                  assert not p.exists(),str(p)
              else:
                  assert subprocess.check_output(["git","hash-object",str(p)],text=True).strip()==item["expected"],str(p)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(item["content"])
          print("Applied reviewed authored compatibility files:",",".join(item["path"] for item in changes))
          PY
      - name: Verify generated candidate and unrelated-input invariants
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync-starintel-schema.py
          python3 scripts/check-starintel-schema-lock.py
          python3 scripts/check-starintel-dependency-lock.py
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-closure-evidence"
          library="33935f1e6739b0015926a2a163ba55cf203fbc9d"
          authority="96d26c338078676ec1dc6928755901636c9f7ef0"
          def git(*args,env=None): return subprocess.check_output(["git",*args],env=env)
          before=json.loads((out/"baseline-flake.lock").read_text())
          after=json.loads((root/"flake.lock").read_text())
          assert set(before)==set(after)
          assert set(before["nodes"])==set(after["nodes"])
          for k,v in before.items():
              if k!="nodes": assert after[k]==v,k
          for k,v in before["nodes"].items():
              if k!="star-cl": assert after["nodes"][k]==v,"unrelated Nix input drift:"+k
          assert after["nodes"]["star-cl"]["locked"]["rev"]==library
          assert after["nodes"]["star-cl"]["original"]["rev"]==library
          assert after["nodes"]["star-cl"]["inputs"]==before["nodes"]["star-cl"]["inputs"]
          def qlot_entries(s):
              matches=list(re.finditer(r'^\("([^"]+)"\s*\.',s,re.M))
              assert matches and not s[:matches[0].start()].strip()
              return {m.group(1):s[m.start():(matches[i+1].start() if i+1<len(matches) else len(s))] for i,m in enumerate(matches)}
          old=qlot_entries((out/"baseline-qlfile.lock").read_text())
          new=qlot_entries((root/"qlfile.lock").read_text())
          assert set(old)==set(new),"Qlot entry set drift"
          for k,v in old.items():
              if k=="cl+ssl":
                  assert v.count('ql-2024-10-12')==1
                  assert new[k]==v.replace('ql-2024-10-12','ql-2023-10-21'),"unexpected cl+ssl entry drift"
              elif k!="star-cl": assert new[k]==v,"unrelated Qlot entry drift:"+k
          assert list(old)==list(new),"Qlot entry order drift"
          original=(out/"baseline-qlfile.lock").read_text()
          old_clssl="(\"cl+ssl\" .\n (:class qlot/source/ql:source-ql\n  :initargs (:%version :latest)\n  :version \"ql-2024-10-12\"))"
          assert original.count(old_clssl)==1
          expected=original.replace(old_clssl,old_clssl.replace("ql-2024-10-12","ql-2023-10-21"))
          assert new["star-cl"]==old["star-cl"].replace("a18a6cddcbcf4d989495a5de8abcedc4d0294d1c",library),"unexpected star-cl entry changes"
          assert (root/"qlfile.lock").read_text()==expected.replace(old["star-cl"],new["star-cl"]),"unplanned Qlot byte drift"
          assert re.search(r':ref\s+"'+library+r'"',new["star-cl"])
          assert re.search(r':version\s+"github-'+library+r'"',new["star-cl"])
          assert ('github lost-rob0t/star-cl :ref '+library) in (root/"qlfile").read_text().splitlines()
          assert 'url = "github:lost-rob0t/star-cl/'+library+'";' in (root/"flake.nix").read_text()
          maintained=json.loads((out/"maintained-lock.json").read_text())
          consumer=json.loads((root/"schema/starintel-schema.lock.json").read_text())
          assert consumer==maintained,"maintained closure equality GREEN failed"
          assert len(consumer["vendored_files"])==18
          actual={str(p.relative_to(root)) for p in (root/"schemas/starintel-0.10.1").rglob("*") if p.is_file()}
          assert actual==set(consumer["vendored_files"]),"stale/extra/missing vendor files"
          for path,entry in consumer["vendored_files"].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==entry["sha256"],path
          print("MAINTAINED_CLOSURE_GREEN 18 files; unrelated Nix/Qlot inputs preserved; exact byte-equivalent cl+ssl metadata normalization")
          allow={"flake.nix","qlfile","flake.lock","qlfile.lock","schema/starintel-schema.lock.json","source/starintel-gserver.asd","cli/star-cli.asd","cli/star-cli.lisp","source/actor-systems/event-actor.lisp","source/actor-systems/matcher-actor.lisp","t/http-api-test.lisp","t/http-boundary-test.lisp","t/http-target-v1-test.lisp","t/http-target-tenant-test.lisp","t/authorization-policy-test.lisp","t/http-tenant-injection-test.lisp","t/v09-runtime-test.lisp","source/frontends/http-boundary-core.lisp","source/frontends/http-target-v1.lisp","t/event-actor-test.lisp","t/system-load-test.lisp","t/v0101-runtime-test.lisp","docs/canonical-compatibility.md"}
          tracked=git("diff","--name-only","HEAD").decode().splitlines()
          assert all(p in allow or p.startswith("schemas/starintel-0.10.1/") for p in tracked),tracked
          env=os.environ.copy();env["GIT_INDEX_FILE"]=str(pathlib.Path(os.environ["RUNNER_TEMP"])/"closure.index")
          git("read-tree","HEAD",env=env)
          git("add","--",*sorted(allow),"schemas/starintel-0.10.1",env=env)
          git("update-index","--force-remove",".github/workflows/canonical-closure.yml",env=env)
          tree=git("write-tree",env=env).decode().strip()
          head=git("rev-parse","HEAD").decode().strip()
          git("diff","--check",head,tree)
          diff=git("--no-pager","diff","--no-ext-diff","--no-textconv",head,tree)
          assert len(diff)<10000000,"diff too large, refusing truncation"
          (out/"candidate.diff").write_bytes(diff)
          items={}
          for line in git("ls-tree","-rz",tree).split(b"\0"):
              if line:
                  meta,path=line.split(b"\t",1);mode,kind,sha=meta.decode().split()
                  items[path.decode()]=dict(mode=mode,type=kind,sha=sha)
          changes=[]
          for path in git("diff","--name-only",head,tree).decode().splitlines():
              if path not in items:
                  changes.append(dict(path=path,sha=None));continue
              x=items[path]
              assert x["type"]=="blob" and x["mode"] in ("100644","100755"),path
              b=git("cat-file","blob",x["sha"])
              assert b"\0" not in b and len(b)<2000000,path
              changes.append(dict(path=path,**x,content=b.decode()))
          payload=dict(head=head,candidate_tree=tree,library=library,authority=authority,changes=changes)
          encoded=json.dumps(payload)
          assert len(encoded)<10000000
          (out/"publication.json").write_text(encoded+"\n")
          (out/"inventory.json").write_text(json.dumps(items,sort_keys=True,indent=2)+"\n")
          print("CLOSURE_MANIFEST "+encoded)
          candidate=pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-closure-candidate";candidate.mkdir()
          git("checkout-index","--all","--prefix="+str(candidate)+"/",env=env)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("candidate="+str(candidate)+"\n")
          print("Candidate tree",tree)
          
          PY
      - name: Run candidate Python contract tests
        working-directory: ${{ steps.candidate.outputs.candidate }}
        run: python3 -m unittest discover -s tests -v
      - name: Run full candidate Nix checks
        working-directory: ${{ steps.candidate.outputs.candidate }}
        run: nix flake check --show-trace -L
      - name: Run normal candidate unit suite
        working-directory: ${{ steps.candidate.outputs.candidate }}
        run: nix run .#star-unit-tests
      - name: Hash only generated review evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-closure-evidence"
          test -d "$evidence"
          sha256sum "$evidence"/* > "$RUNNER_TEMP/closure-files.sha256"
          mv "$RUNNER_TEMP/closure-files.sha256" "$evidence/"
      - name: Retain exact generated candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-closure-${{ github.sha }}
          path: ${{ runner.temp }}/canonical-closure-evidence/
          if-no-files-found: error
          retention-days: 7
