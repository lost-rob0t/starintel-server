name: Maintained canonical closure candidate

on:
  push:
    branches: ["codex/starintel-0101-ingest"]
    paths: [".github/workflows/canonical-closure.yml"]

permissions:
  contents: read

concurrency:
  group: canonical-closure-candidate
  cancel-in-progress: false

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify untouched historical baseline
        run: |
          python3 scripts/check-starintel-schema-lock.py
          python3 scripts/check-starintel-dependency-lock.py
      - name: Build repository-pinned native Qlot
        id: qlot
        shell: bash
        run: |
          set -euo pipefail
          qlot="$(nix build --impure --no-link --print-out-paths --expr 'let f = builtins.getFlake (toString ./.); p = import f.inputs.nixpkgs { system = "x86_64-linux"; overlays = [ (import ./nix/qlot-cli.nix) ]; }; in p.sbclPackages.qlot-cli')"
          test -x "$qlot/bin/qlot"
          echo "path=$qlot" >> "$GITHUB_OUTPUT"
          echo "Native Qlot derivation: $qlot"
          evidence="$RUNNER_TEMP/canonical-closure-evidence"
          mkdir -p "$evidence"
          python3 - <<'PY'
          from pathlib import Path
          import os
          (Path(os.environ["RUNNER_TEMP"])/"canonical-closure-evidence"/"baseline-qlfile.lock").write_bytes(Path("qlfile.lock").read_bytes())
          p=Path("qlfile"); s=p.read_text()
          old='github lost-rob0t/star-cl :ref "a18a6cddcbcf4d989495a5de8abcedc4d0294d1c"'
          new='github lost-rob0t/star-cl :ref a18a6cddcbcf4d989495a5de8abcedc4d0294d1c'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          set +e
          timeout 600 "$qlot/bin/qlot" install --no-deps > "$evidence/qlot-bootstrap.log" 2>&1
          status=$?
          set -e
          tail -n 100 "$evidence/qlot-bootstrap.log"
          test "$status" = 0
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request,urllib.parse
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-closure-evidence"
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  safe(newurl)
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          def safe(url):
              u=urllib.parse.urlsplit(url)
              assert u.scheme=="https" and u.hostname=="beta.quicklisp.org" and not u.username and not u.password,url
              return url
          opener=urllib.request.build_opener(SafeRedirect)
          def get(url,limit):
              safe(url)
              with opener.open(url,timeout=60) as r:
                  safe(r.url);data=r.read(limit+1)
                  assert len(data)<=limit,"response too large"
                  return data
          def rows(data):
              lines=data.decode().splitlines()
              return [line.split() for line in lines if line and not line.startswith("#")]
          records=[]
          for version in ("2024-10-12","2023-10-21"):
              url="https://beta.quicklisp.org/dist/quicklisp/"+version+"/distinfo.txt"
              raw=get(url,100000)
              (out/("clssl-"+version+"-distinfo.txt")).write_bytes(raw)
              info=dict(line.split(": ",1) for line in raw.decode().splitlines() if ": " in line)
              assert info["name"]=="quicklisp" and info["version"]==version
              def https(url):
                  u=urllib.parse.urlsplit(url)
                  assert u.scheme in ("http","https") and u.hostname=="beta.quicklisp.org"
                  return safe(urllib.parse.urlunsplit(u._replace(scheme="https")))
              release_url=https(info["release-index-url"]);system_url=https(info["system-index-url"])
              release_raw=get(release_url,10000000);system_raw=get(system_url,20000000)
              release_header=release_raw.decode().splitlines()[0]
              system_header=system_raw.decode().splitlines()[0]
              assert release_header.startswith("# project url size file-md5 content-sha1 prefix"),release_header
              assert system_header.startswith("# project system-file system-name"),system_header
              release=[r for r in rows(release_raw) if r[0]=="cl+ssl"]
              systems=[r for r in rows(system_raw) if r[0]=="cl+ssl"]
              assert len(release)==1 and systems,(len(release),len(systems))
              row=release[0];assert len(row)>=7
              archive_url=https(row[1]);data=get(archive_url,20000000)
              assert len(data)==int(row[2]) and hashlib.md5(data).hexdigest()==row[3]
              record=dict(version=version,distinfo_url=url,release_index_url=release_url,system_index_url=system_url,release_header=release_header,system_header=system_header,release=row,systems=systems,archive_url=archive_url,archive_size=len(data),archive_sha256=hashlib.sha256(data).hexdigest())
              records.append(record)
              (out/("clssl-"+version+"-metadata.json")).write_text(json.dumps(record,indent=2)+"\n")
          assert records[0]["release"]==records[1]["release"],"release metadata differs"
          assert records[0]["systems"]==records[1]["systems"],"systems/dependencies differ"
          assert records[0]["archive_sha256"]==records[1]["archive_sha256"]=="554e8cf79771221cf3991085da9b7cb659a78fd7ff71c81ae56d524f2d1eec46","archive bytes differ"
          assert records[0]["archive_size"]==records[1]["archive_size"]==92364
          print("CLSSL_NATIVE_NORMALIZATION_EQUIVALENCE "+json.dumps(records))
          PY
          python3 - <<'PY'
          import os,pathlib
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-closure-evidence"
          original=(out/"baseline-qlfile.lock").read_text()
          old="(\"cl+ssl\" .\n (:class qlot/source/ql:source-ql\n  :initargs (:%version :latest)\n  :version \"ql-2024-10-12\"))"
          new=old.replace("ql-2024-10-12","ql-2023-10-21")
          assert original.count(old)==1
          assert pathlib.Path("qlfile.lock").read_text()==original.replace(old,new),"unexpected bootstrap lock drift"
          print("Native bootstrap changes only proven byte-equivalent cl+ssl version metadata")
          PY
      - name: Establish maintained mismatch RED and author only declarations
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, subprocess, urllib.request
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-closure-evidence"
          out.mkdir(exist_ok=True)
          baseline="08241fb9b28c615c5e84ec54540b96097dc6c645"
          library="33935f1e6739b0015926a2a163ba55cf203fbc9d"
          authority="96d26c338078676ec1dc6928755901636c9f7ef0"
          def git(*args): return subprocess.check_output(["git",*args],text=True).strip()
          assert git("rev-parse","HEAD^")=="3cd2c785d62e612ded0bea38b51f60586d6f9152"
          assert git("diff","--name-only",baseline,"HEAD")==".github/workflows/canonical-closure.yml"
          with urllib.request.urlopen("https://raw.githubusercontent.com/lost-rob0t/star-cl/"+library+"/schema/starintel-schema.lock.json") as r:
              maintained=json.load(r)
          assert maintained["canonical_commit"]==authority
          assert maintained["release_version"]==maintained["schema_version"]=="0.10.1"
          assert len(maintained["vendored_files"])==18
          spec=importlib.util.spec_from_file_location("sync_starintel","scripts/sync-starintel-schema.py")
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          module.verify_release(authority,None)
          before=json.loads((root/"schema/starintel-schema.lock.json").read_text())
          assert before["canonical_commit"]=="765f1673851192bcaf1cdd2f35c47608f979b079"
          assert len(before["vendored_files"])==11
          try:
              assert before==maintained, "baseline differs from maintained generated closure"
          except AssertionError as e:
              print("EXPECTED_MAINTAINED_CLOSURE_RED",str(e))
          else:
              raise AssertionError("baseline RED not established")
          (out/"maintained-lock.json").write_text(json.dumps(maintained,indent=2)+"\n")
          for name in ("flake.lock",):
              (out/("baseline-"+name)).write_bytes((root/name).read_bytes())
          old="a18a6cddcbcf4d989495a5de8abcedc4d0294d1c"
          for name in ("flake.nix","qlfile"):
              p=root/name;s=p.read_text()
              assert s.count(old)==1,name
              p.write_text(s.replace(old,library))
          (out/"provenance.json").write_text(json.dumps(dict(baseline=baseline,workflow_head=git("rev-parse","HEAD"),library=library,authority=authority),indent=2)+"\n")
          
          PY
      - name: Generate complete maintained closure and native locks
        shell: bash
        env:
          QLOT_PATH: ${{ steps.qlot.outputs.path }}
        run: |
          set -euo pipefail
          python3 scripts/sync-starintel-schema.py --commit 96d26c338078676ec1dc6928755901636c9f7ef0
          nix flake update star-cl
          timeout 600 "$QLOT_PATH/bin/qlot" update star-cl --no-deps
      - name: Verify generated candidate and unrelated-input invariants
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync-starintel-schema.py
          python3 scripts/check-starintel-schema-lock.py
          python3 scripts/check-starintel-dependency-lock.py
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-closure-evidence"
          library="33935f1e6739b0015926a2a163ba55cf203fbc9d"
          authority="96d26c338078676ec1dc6928755901636c9f7ef0"
          def git(*args,env=None): return subprocess.check_output(["git",*args],env=env)
          before=json.loads((out/"baseline-flake.lock").read_text())
          after=json.loads((root/"flake.lock").read_text())
          assert set(before)==set(after)
          assert set(before["nodes"])==set(after["nodes"])
          for k,v in before.items():
              if k!="nodes": assert after[k]==v,k
          for k,v in before["nodes"].items():
              if k!="star-cl": assert after["nodes"][k]==v,"unrelated Nix input drift:"+k
          assert after["nodes"]["star-cl"]["locked"]["rev"]==library
          assert after["nodes"]["star-cl"]["original"]["rev"]==library
          assert after["nodes"]["star-cl"]["inputs"]==before["nodes"]["star-cl"]["inputs"]
          def qlot_entries(s):
              matches=list(re.finditer(r'^\("([^"]+)"\s*\.',s,re.M))
              assert matches and not s[:matches[0].start()].strip()
              return {m.group(1):s[m.start():(matches[i+1].start() if i+1<len(matches) else len(s))] for i,m in enumerate(matches)}
          old=qlot_entries((out/"baseline-qlfile.lock").read_text())
          new=qlot_entries((root/"qlfile.lock").read_text())
          assert set(old)==set(new),"Qlot entry set drift"
          for k,v in old.items():
              if k=="cl+ssl":
                  assert v.count('ql-2024-10-12')==1
                  assert new[k]==v.replace('ql-2024-10-12','ql-2023-10-21'),"unexpected cl+ssl entry drift"
              elif k!="star-cl": assert new[k]==v,"unrelated Qlot entry drift:"+k
          assert list(old)==list(new),"Qlot entry order drift"
          original=(out/"baseline-qlfile.lock").read_text()
          old_clssl="(\"cl+ssl\" .\n (:class qlot/source/ql:source-ql\n  :initargs (:%version :latest)\n  :version \"ql-2024-10-12\"))"
          assert original.count(old_clssl)==1
          expected=original.replace(old_clssl,old_clssl.replace("ql-2024-10-12","ql-2023-10-21"))
          assert new["star-cl"]==old["star-cl"].replace("a18a6cddcbcf4d989495a5de8abcedc4d0294d1c",library),"unexpected star-cl entry changes"
          assert (root/"qlfile.lock").read_text()==expected.replace(old["star-cl"],new["star-cl"]),"unplanned Qlot byte drift"
          assert re.search(r':ref\s+"'+library+r'"',new["star-cl"])
          assert re.search(r':version\s+"github-'+library+r'"',new["star-cl"])
          assert ('github lost-rob0t/star-cl :ref '+library) in (root/"qlfile").read_text().splitlines()
          assert 'url = "github:lost-rob0t/star-cl/'+library+'";' in (root/"flake.nix").read_text()
          maintained=json.loads((out/"maintained-lock.json").read_text())
          consumer=json.loads((root/"schema/starintel-schema.lock.json").read_text())
          assert consumer==maintained,"maintained closure equality GREEN failed"
          assert len(consumer["vendored_files"])==18
          actual={str(p.relative_to(root)) for p in (root/"schemas/starintel-0.10.1").rglob("*") if p.is_file()}
          assert actual==set(consumer["vendored_files"]),"stale/extra/missing vendor files"
          for path,entry in consumer["vendored_files"].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==entry["sha256"],path
          print("MAINTAINED_CLOSURE_GREEN 18 files; unrelated Nix/Qlot inputs preserved; exact byte-equivalent cl+ssl metadata normalization")
          allow={"flake.nix","qlfile","flake.lock","qlfile.lock","schema/starintel-schema.lock.json"}
          tracked=git("diff","--name-only","HEAD").decode().splitlines()
          assert all(p in allow or p.startswith("schemas/starintel-0.10.1/") for p in tracked),tracked
          env=os.environ.copy();env["GIT_INDEX_FILE"]=str(pathlib.Path(os.environ["RUNNER_TEMP"])/"closure.index")
          git("read-tree","HEAD",env=env)
          git("add","--",*sorted(allow),"schemas/starintel-0.10.1",env=env)
          git("update-index","--force-remove",".github/workflows/canonical-closure.yml",env=env)
          tree=git("write-tree",env=env).decode().strip()
          head=git("rev-parse","HEAD").decode().strip()
          git("diff","--check",head,tree)
          diff=git("--no-pager","diff","--no-ext-diff","--no-textconv",head,tree)
          assert len(diff)<10000000,"diff too large, refusing truncation"
          (out/"candidate.diff").write_bytes(diff)
          items={}
          for line in git("ls-tree","-rz",tree).split(b"\0"):
              if line:
                  meta,path=line.split(b"\t",1);mode,kind,sha=meta.decode().split()
                  items[path.decode()]=dict(mode=mode,type=kind,sha=sha)
          changes=[]
          for path in git("diff","--name-only",head,tree).decode().splitlines():
              if path not in items:
                  changes.append(dict(path=path,sha=None));continue
              x=items[path]
              assert x["type"]=="blob" and x["mode"] in ("100644","100755"),path
              b=git("cat-file","blob",x["sha"])
              assert b"\0" not in b and len(b)<2000000,path
              changes.append(dict(path=path,**x,content=b.decode()))
          payload=dict(head=head,candidate_tree=tree,library=library,authority=authority,changes=changes)
          encoded=json.dumps(payload)
          assert len(encoded)<10000000
          (out/"publication.json").write_text(encoded+"\n")
          (out/"inventory.json").write_text(json.dumps(items,sort_keys=True,indent=2)+"\n")
          print("CLOSURE_MANIFEST "+encoded)
          candidate=pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-closure-candidate";candidate.mkdir()
          git("checkout-index","--all","--prefix="+str(candidate)+"/",env=env)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("candidate="+str(candidate)+"\n")
          print("Candidate tree",tree)
          
          PY
      - name: Run candidate Python contract tests
        working-directory: ${{ steps.candidate.outputs.candidate }}
        run: python3 -m unittest discover -s tests -v
      - name: Run full candidate Nix checks
        working-directory: ${{ steps.candidate.outputs.candidate }}
        run: nix flake check --show-trace -L
      - name: Run normal candidate unit suite
        working-directory: ${{ steps.candidate.outputs.candidate }}
        run: nix run .#star-unit-tests
      - name: Hash only generated review evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-closure-evidence"
          test -d "$evidence"
          sha256sum "$evidence"/* > "$RUNNER_TEMP/closure-files.sha256"
          mv "$RUNNER_TEMP/closure-files.sha256" "$evidence/"
      - name: Retain exact generated candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-closure-${{ github.sha }}
          path: ${{ runner.temp }}/canonical-closure-evidence/
          if-no-files-found: error
          retention-days: 7
