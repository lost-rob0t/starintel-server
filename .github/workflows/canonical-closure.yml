\\n          (is (= 200 status) \\\"Bulk endpoint should accept a valid document array\\\")\\n          (when (= 200 status)\\n            (let ((data (jsown:parse body)))\\n              (is (jsown:keyp data \\\"total\\\"))\\n              (is (jsown:keyp data \\\"succeeded\\\"))\\n              (is (jsown:keyp data \\\"failed\\\"))\\n              (is (= 3 (jsown:val data \\\"total\\\")))\\n              (is (= 3 (jsown:val data \\\"succeeded\\\")))\\n              (is (= 0 (jsown:val data \\\"failed\\\"))))))))\\n\\n(test test-bulk-endpoint-invalid-body\\n      \\\"Test POST /documents/bulk endpoint with non-array body.\\\"\\n      (dbg \\\"TEST: test-bulk-endpoint-invalid-body\\\")\\n      (let* ((url (make-test-url \\\"/documents/bulk\\\"))\\n             (invalid-json (jsown:to-json (jsown:new-js (\\\"type\\\" \\\"host\\\")))))\\n        (multiple-value-bind (status)\\n            (perform-request\\n             (lambda ()\\n               (dex:post url\\n                         :content invalid-json\\n                         :headers '((\\\"Content-Type\\\" . \\\"application/json\\\")))))\\n          (is (= 400 status) \\\"Non-array bulk body must be rejected with 400\\\"))))\\n\\n(test test-bulk-endpoint-exceeds-max\\n      \\\"Test POST /documents/bulk endpoint with too many documents.\\\"\\n      (dbg \\\"TEST: test-bulk-endpoint-exceeds-max\\\")\\n      (let* ((url (make-test-url \\\"/documents/bulk\\\"))\\n             (max-docs star:*bulk-max-documents*)\\n             (docs (loop for i from 1 to (+ max-docs 1)\\n                         collect (make-test-host :id (format nil \\\"bulk-exceed-~a\\\" i) :ip \\\"10.2.2.2\\\")))\\n             (json-array (jsown:to-json docs)))\\n        (multiple-value-bind (status)\\n            (perform-request\\n             (lambda ()\\n               (dex:post url\\n                         :content json-array\\n                         :headers '((\\\"Content-Type\\\" . \\\"application/json\\\")))))\\n          (is (= 413 status) \\\"Bulk requests exceeding the limit must be rejected with 413\\\"))))\\n\\n(test test-bulk-endpoint-missing-type\\n      \\\"Test POST /documents/bulk endpoint with documents missing required fields.\\\"\\n      (dbg \\\"TEST: test-bulk-endpoint-missing-type\\\")\\n      (let* ((url (make-test-url \\\"/documents/bulk\\\"))\\n             (docs (list (jsown:new-js (\\\"_id\\\" \\\"no-type-1\\\") (\\\"data\\\" \\\"test\\\"))))\\n             (json-array (jsown:to-json docs)))\\n        (multiple-value-bind (status)\\n            (perform-request\\n             (lambda ()\\n               (dex:post url\\n                         :content json-array\\n                         :headers '((\\\"Content-Type\\\" . \\\"application/json\\\")))))\\n          (is (= 422 status)\\n              \\\"Bulk documents missing required fields must be rejected with 422\\\"))))\\n\\n(test test-bulk-endpoint-empty-array\\n      \\\"Test POST /documents/bulk endpoint with empty array.\\\"\\n      (dbg \\\"TEST: test-bulk-endpoint-empty-array\\\")\\n      (let* ((url (make-test-url \\\"/documents/bulk\\\"))\\n             (json-array (jsown:to-json (list))))\\n        (multiple-value-bind (status body)\\n            (perform-request\\n             (lambda ()\\n               (dex:post url\\n                         :content json-array\\n                         :headers '((\\\"Content-Type\\\" . \\\"application/json\\\")))))\\n          (is (= 200 status) \\\"An empty bulk array should be accepted\\\")\\n          (when (= 200 status)\\n            (let ((data (jsown:parse body)))\\n              (is (= 0 (jsown:val data \\\"total\\\")))\\n              (is (= 0 (jsown:val data \\\"succeeded\\\")))\\n              (is (= 0 (jsown:val data \\\"failed\\\"))))))))\\n\\n;;; Document creation via POST tests\\n\\n(test test-post-new-host-document\\n      \\\"Test POST /new/document/host endpoint.\\\"\\n      (dbg \\\"TEST: test-post-new-host-document\\\")\\n      (let* ((url (make-test-url \\\"/new/document/host\\\"))\\n             (doc (make-test-host :id \\\"host-post-test\\\" :ip \\\"10.0.0.1\\\")))\\n        (multiple-value-bind (status body)\\n            (perform-request\\n             (lambda ()\\n               (dex:post url\\n                         :content (jsown:to-json doc)\\n                         :headers '((\\\"Content-Type\\\" . \\\"application/json\\\")))))\\n          (is (= 200 status) \\\"Posting a valid host document should succeed\\\")\\n          (when (= 200 status)\\n            (let ((data (jsown:parse body)))\\n              (is (jsown:keyp data \\\"_id\\\"))\\n              (is (string= \\\"host-post-test\\\" (jsown:val data \\\"_id\\\"))))))))\\n\\n(test test-post-new-email-document\\n      \\\"Test POST /new/document/email endpoint.\\\"\\n      (dbg \\\"TEST: test-post-new-email-document\\\")\\n      (let* ((url (make-test-url \\\"/new/document/email\\\"))\\n             (doc (make-test-email :id \\\"email-post-test\\\" :user \\\"posttest\\\" :domain \\\"example.com\\\")))\\n        (multiple-value-bind (status body)\\n            (perform-request\\n             (lambda ()\\n               (dex:post url\\n                         :content (jsown:to-json doc)\\n                         :headers '((\\\"Content-Type\\\" . \\\"application/json\\\")))))\\n          (is (= 200 status) \\\"Posting a valid email document should succeed\\\")\\n          (when (= 200 status)\\n            (let ((data (jsown:parse body)))\\n              (is (jsown:keyp data \\\"_id\\\"))\\n              (is (string= \\\"email-post-test\\\" (jsown:val data \\\"_id\\\"))))))))\\n\\n;;; ----------------------------------------------------------------------\\n;;; Authorization enforcement via the real middleware stack\\n;;; ----------------------------------------------------------------------\\n\\n(test test-unauthenticated-protected-request-rejected\\n      \\\"An unauthenticated request to a protected route is rejected with 401.\\\"\\n      (dbg \\\"TEST: test-unauthenticated-protected-request-rejected\\\")\\n      (let ((url (make-test-url \\\"/document/unauthenticated-401-test\\\")))\\n        (multiple-value-bind (status)\\n            (perform-request\\n             (lambda ()\\n               (dex:get url\\n                        :headers '((\\\"X-Test-Auth-Mode\\\" . \\\"unauthenticated\\\")))))\\n          (dbg \\\"unauthenticated protected request status=~a\\\" status)\\n          (is (= 401 status)\\n              \\\"Unauthenticated protected requests must be rejected with 401\\\"))))\\n\\n(test test-authorized-principal-lacking-resource-scope-rejected\\n      \\\"An authenticated principal lacking the required resource scope is\\nrejected with 403 by route-level resource authorization.\\\"\\n      (dbg \\\"TEST: test-authorized-principal-lacking-resource-scope-rejected\\\")\\n      (let* ((test-id \\\"restricted-403-test-1\\\")\\n             (doc (make-test-host :id test-id :ip \\\"192.168.40.40\\\")))\\n        ;; Insert a document in the testing dataset directly into CouchDB.\\n        (insert-test-document doc)\\n        (sleep 1)\\n        (let ((url (make-test-url (format nil \\\"/document/~a\\\" test-id))))\\n          (multiple-value-bind (status)\\n              (perform-request\\n               (lambda ()\\n                 (dex:get url\\n                          :headers `((\\\"X-Test-Auth-Mode\\\" . \\\"restricted\\\")\\n                                     (\\\"Authorization\\\" .\\n                                      ,(format nil \\\"Bearer ~a\\\"\\n                                               *restricted-credential-key*))))))\\n            (dbg \\\"restricted principal GET status=~a\\\" status)\\n            (is (= 403 status)\\n                \\\"An authenticated principal lacking the dataset resource scope \\\"\\n                \\\"must be rejected with 403 by route-level authorization\\\")))))\\n\\n;;; ----------------------------------------------------------------------\\n;;; Document Deletion via HTTP API Tests\\n;;; ----------------------------------------------------------------------\\n\\n(test test-delete-document-endpoint\\n      \\\"Test DELETE /document/:id endpoint.\\\"\\n      (dbg \\\"TEST: test-delete-document-endpoint\\\")\\n      (let* ((test-id \\\"delete-http-test-1\\\")\\n             (doc (make-test-host :id test-id :ip \\\"192.168.50.50\\\")))\\n        ;; Insert test document\\n        (insert-test-document doc)\\n        (sleep 1)\\n\\n        ;; Verify document exists via GET\\n        (let* ((get-url (make-test-url (format nil \\\"/document/~a\\\" test-id)))\\n               (get-response (dex:get get-url)))\\n          (dbg \\\"GET response len=~d\\\" (length get-response))\\n          (let ((data (jsown:parse get-response)))\\n            (is (string= test-id (jsown:val data \\\"_id\\\")))))\\n\\n        ;; Delete via HTTP API\\n        (let* ((delete-url (make-test-url (format nil \\\"/document/~a\\\" test-id)))\\n               (delete-response (dex:delete delete-url)))\\n          (dbg \\\"DELETE response: ~s\\\" delete-response)\\n          (let ((data (jsown:parse delete-response)))\\n            (is (string= \\\"success\\\" (jsown:val data \\\"status\\\")))))\\n\\n        ;; Verify document is deleted - GET should return 404\\n        (let ((get-url (make-test-url (format nil \\\"/document/~a\\\" test-id))))\\n          (handler-case\\n              (progn\\n                (dex:get get-url)\\n                (fail \\\"Expected 404 but document still exists\\\"))\\n            (dexador:http-request-not-found ()\\n              (dbg \\\"Document successfully deleted via HTTP API\\\")\\n              (pass))))))\\n\\n;; TODO\\n;; (test test-delete-nonexistent-document\\n;;       \\\"Test DELETE /document/:id with nonexistent document returns 404.\\\"\\n;;       (dbg \\\"TEST: test-delete-nonexistent-document\\\")\\n;;       (let* ((nonexistent-id \\\"nonexistent-doc-12345\\\")\\n;;              (delete-url (make-test-url (format nil \\\"/document/~a\\\" nonexistent-id))))\\n;;         (handler-case\\n;;             (progn\\n;;               (dex:delete delete-url)\\n;;               (fail \\\"Expected 404 for nonexistent document\\\"))\\n;;           (dexador:http-request-not-found ()\\n;;             (dbg \\\"Correctly returned 404 for nonexistent document\\\")\\n;;             (pass)))))\\n\\n;;; ----------------------------------------------------------------------\\n;;; Utility Functions\\n;;; ----------------------------------------------------------------------\\n\\n(defclass stub-producer ()\\n  ()\\n  (:documentation \\\"Stub producer for tests that doesn't connect to RabbitMQ\\\"))\\n\\n(defmethod star.producers:publish ((producer stub-producer) &key body routing-key properties)\\n  \\\"Stub publish method that does nothing\\\"\\n  (declare (ignore body routing-key properties))\\n  (dbg \\\"Stub publish called (no-op)\\\"))\\n\\n(defun start-test-actor-system ()\\n  \\\"Create stub actors for tests (without actually starting the actor system).\\\"\\n  (dbg \\\"Creating stub actors for tests\\\")\\n\\n  ;; Create a minimal actor system just for agent creation\\n  (setf star.actors:*sys* (sento.actor-system:make-actor-system))\\n\\n  ;; Create a stub producer agent that returns a stub producer with publish method\\n  (setf star.actors:*producer-agent*\\n        (sento.agent:make-agent (lambda ()\\n                                  (make-instance 'stub-producer))\\n                                star.actors:*sys*))\\n\\n  (dbg \\\"Stub actors created\\\"))\\n\\n(defun stop-test-actor-system ()\\n  \\\"Stop the test actor system.\\\"\\n  (dbg \\\"Stopping actor system\\\")\\n  (when star.actors:*sys*\\n    (handler-case\\n        (sento.actor-context:shutdown star.actors:*sys*)\\n      (error (e)\\n        (dbg \\\"Error shutting down actor system: ~a\\\" e)))\\n    (setf star.actors:*sys* nil)\\n    (setf star.actors:*producer-agent* nil))\\n  ;; Kill any remaining threads\\n  (loop for thread in (bt:all-threads)\\n        when (and (not (eq thread (bt:current-thread)))\\n                  (search \\\"hunchentoot\\\" (bt:thread-name thread) :test #'char-equal))\\n          do (progn\\n               (dbg \\\"Killing thread: ~a\\\" (bt:thread-name thread))\\n               (ignore-errors (bt:destroy-thread thread))))\\n  (dbg \\\"Actor system stopped\\\"))\\n\\n(defun run-http-api-tests ()\\n  \\\"Run all HTTP API tests.\\\"\\n  (format t \\\"~%Starting HTTP API tests...~%\\\")\\n  (run-required-suite\\n   'http-api-tests\\n   :setup (lambda ()\\n            (start-test-actor-system)\\n            (ensure-test-database)\\n            (start-test-server)\\n            (sleep 1))\\n   :teardown (lambda ()\\n               (stop-test-server)\\n               (stop-test-actor-system)\\n               (destroy-test-database)\\n               (format t \\\"~%HTTP API tests completed~%\\\"))))\\n\"},{\"path\":\"t/http-boundary-test.lisp\",\"expected\":\"ba79af04d81880b0855d99afc884c661e74171d3\",\"content\":\"(in-package :star-server-tests)\\n\\n(def-suite http-boundary-tests\\n  :description \\\"HTTP boundary validation, safe errors, and bulk backpressure tests\\\")\\n\\n(in-suite http-boundary-tests)\\n\\n(defun make-boundary-document (&key (dtype \\\"host\\\")\\n                                    (schema-version starintel.legacy:+starintel-doc-version+)\\n                                    (version 1)\\n                                    (id \\\"boundary-doc-1\\\"))\\n  (let ((document\\n          (starintel.legacy:encode\\n           (starintel.legacy:new-host\\n            \\\"boundary-tests\\\"\\n            :ip \\\"192.0.2.10\\\"\\n            :os \\\"linux\\\"))))\\n    (setf (jsown:val document \\\"_id\\\") id\\n          (jsown:val document \\\"dtype\\\") dtype\\n          (jsown:val document \\\"schema_version\\\") schema-version\\n          (jsown:val document \\\"version\\\") version)\\n    document))\\n\\n(defun capture-http-input-error (thunk)\\n  (handler-case\\n      (progn\\n        (funcall thunk)\\n        nil)\\n    (star.frontends.http-api:http-input-error (condition)\\n      condition)))\\n\\n(test jsown-object-is-not-a-bulk-array\\n  (let ((object (jsown:new-js (\\\"dtype\\\" \\\"host\\\")))\\n        (array (list (jsown:new-js (\\\"dtype\\\" \\\"host\\\")))))\\n    (is-true (star.frontends.http-api:json-object-p object))\\n    (is-false (star.frontends.http-api:json-array-p object))\\n    (is-true (star.frontends.http-api:json-array-p array))))\\n\\n(test malformed-json-is-a-400-client-error\\n  (let ((condition\\n          (capture-http-input-error\\n           (lambda ()\\n             (star.frontends.http-api:parse-json-octets\\n              (babel:string-to-octets \\\"{\\\" :encoding :utf-8)\\n              \\\"application/json\\\")))))\\n    (is-true condition)\\n    (is (= 400\\n           (star.frontends.http-api:http-input-error-status condition)))\\n    (is (string= \\\"malformed_json\\\"\\n                 (star.frontends.http-api:http-input-error-code condition)))))\\n\\n(test non-json-content-type-is-rejected\\n  (let ((condition\\n          (capture-http-input-error\\n           (lambda ()\\n             (star.frontends.http-api:parse-json-octets\\n              (babel:string-to-octets \\\"{}\\\" :encoding :utf-8)\\n              \\\"text/plain\\\")))))\\n    (is (= 415\\n           (star.frontends.http-api:http-input-error-status condition)))\\n    (is (string= \\\"unsupported_media_type\\\"\\n                 (star.frontends.http-api:http-input-error-code condition)))))\\n\\n(test oversized-request-body-is-rejected-before-parsing\\n  (let ((condition\\n          (capture-http-input-error\\n           (lambda ()\\n             (star.frontends.http-api:parse-json-octets\\n              (make-array 17\\n                          :element-type '(unsigned-byte 8)\\n                          :initial-element 32)\\n              \\\"application/json\\\"\\n              :max-bytes 16)))))\\n    (is (= 413\\n           (star.frontends.http-api:http-input-error-status condition)))\\n    (is (string= \\\"request_body_too_large\\\"\\n                 (star.frontends.http-api:http-input-error-code condition)))))\\n\\n(test missing-and-mismatched-dtype-return-422\\n  (let* ((missing (make-boundary-document))\\n         (mismatch (make-boundary-document :dtype \\\"email\\\")))\\n    (jsown:remkey missing \\\"dtype\\\")\\n    (let ((missing-condition\\n            (capture-http-input-error\\n             (lambda ()\\n               (star.frontends.http-api:validate-document-input\\n                missing\\n                :path-dtype \\\"host\\\"))))\\n          (mismatch-condition\\n            (capture-http-input-error\\n             (lambda ()\\n               (star.frontends.http-api:validate-document-input\\n                mismatch\\n                :path-dtype \\\"host\\\")))))\\n      (is (= 422\\n             (star.frontends.http-api:http-input-error-status\\n              missing-condition)))\\n      (is (= 422\\n             (star.frontends.http-api:http-input-error-status\\n              mismatch-condition)))\\n      (is (string= \\\"dtype_mismatch\\\"\\n                    (star.frontends.http-api:http-input-error-code\\n                     mismatch-condition))))))\\n\\n(test canonical-v09-document-passes-strict-validation\\n  (let ((document (make-boundary-document)))\\n    (is (eq document\\n            (star.frontends.http-api:validate-document-input\\n             document\\n             :path-dtype \\\"host\\\")))))\\n\\n(test document-revision-is-independent-from-schema-revision\\n  (let ((document (make-boundary-document :version 7)))\\n    (is (eq document\\n            (star.frontends.http-api:validate-document-input\\n             document\\n             :path-dtype \\\"host\\\")))\\n    (is (= 7 (jsown:val document \\\"version\\\")))\\n    (is (string= \\\"0.9.0\\\" (jsown:val document \\\"schema_version\\\")))))\\n\\n(test version-string-does-not-substitute-for-schema-version\\n  (let ((document (make-boundary-document)))\\n    (jsown:remkey document \\\"schema_version\\\")\\n    (setf (jsown:val document \\\"version\\\") \\\"0.9.0\\\")\\n    (let ((condition\\n            (capture-http-input-error\\n             (lambda ()\\n               (star.frontends.http-api:validate-document-input\\n                document\\n                :path-dtype \\\"host\\\")))))\\n      (is (= 422\\n             (star.frontends.http-api:http-input-error-status condition)))\\n      (is (string= \\\"schema_version_required\\\"\\n                   (star.frontends.http-api:http-input-error-code condition))))))\\n\\n(test unsupported-schema-version-is-rejected\\n  (let ((condition\\n          (capture-http-input-error\\n           (lambda ()\\n             (star.frontends.http-api:validate-document-input\\n              (make-boundary-document :schema-version \\\"999.0\\\")\\n              :path-dtype \\\"host\\\")))))\\n    (is (= 422\\n           (star.frontends.http-api:http-input-error-status condition)))\\n    (is (string= \\\"unsupported_schema_version\\\"\\n                 (star.frontends.http-api:http-input-error-code condition)))))\\n\\n(test undeclared-top-level-field-is-rejected\\n  (let ((document (make-boundary-document)))\\n    (setf (jsown:val document \\\"legacy_flat_field\\\") \\\"not-v09\\\")\\n    (let ((condition\\n            (capture-http-input-error\\n             (lambda ()\\n               (star.frontends.http-api:validate-document-input\\n                document\\n                :path-dtype \\\"host\\\")))))\\n      (is (= 422\\n             (star.frontends.http-api:http-input-error-status condition)))\\n      (is (string= \\\"invalid_document_schema\\\"\\n                   (star.frontends.http-api:http-input-error-code condition))))))\\n\\n(test dtype-data-schema-mismatch-is-rejected\\n  (let ((document (make-boundary-document :dtype \\\"email\\\")))\\n    (let ((condition\\n            (capture-http-input-error\\n             (lambda ()\\n               (star.frontends.http-api:validate-document-input document)))))\\n      (is (= 422\\n             (star.frontends.http-api:http-input-error-status condition)))\\n      (is (string= \\\"invalid_document_schema\\\"\\n                   (star.frontends.http-api:http-input-error-code condition))))))\\n\\n(test target-boundary-folds-legacy-envelope-and-validates-strictly\\n  (let* ((document\\n           (jsown:new-js\\n             (\\\"_id\\\" \\\"legacy-target-1\\\")\\n             (\\\"dataset\\\" \\\"star-intel\\\")\\n             (\\\"target\\\" \\\"example.invalid\\\")\\n             (\\\"delay\\\" 30)\\n             (\\\"recurring\\\" :false)))\\n         (normalized\\n           (star.frontends.http-api::normalize-legacy-target-document\\n            document \\\"nmap\\\")))\\n    (is (eq document normalized))\\n    (is (eq document\\n            (star.frontends.http-api:validate-document-input\\n             document :path-dtype \\\"target\\\")))\\n    (let ((data (jsown:val document \\\"data\\\")))\\n      (is (string= \\\"nmap\\\" (jsown:val data \\\"actor\\\")))\\n      (is (string= \\\"example.invalid\\\" (jsown:val data \\\"target\\\")))\\n      (is (= 30 (jsown:val data \\\"delay\\\")))\\n      (is (eq :false (jsown:val data \\\"recurring\\\"))))\\n    ;; The historical top-level fields are gone from the closed envelope.\\n    (dolist (key '(\\\"actor\\\" \\\"target\\\" \\\"delay\\\" \\\"recurring\\\" \\\"options\\\"))\\n      (is-false (jsown:keyp document key)))\\n    ;; Missing envelope fields were defaulted to schema-valid values.\\n    (is (string= \\\"0.9.0\\\" (jsown:val document \\\"schema_version\\\")))\\n    (is (= 1 (jsown:val document \\\"version\\\")))\\n    (is (stringp (jsown:val document \\\"date_added\\\")))\\n    (is (stringp (jsown:val document \\\"date_updated\\\")))\\n    (is (vectorp (jsown:val document \\\"sources\\\")))\\n    (is (vectorp (jsown:val document \\\"evidence\\\")))\\n    (is (string= \\\"target\\\" (jsown:val document \\\"dtype\\\")))))\\n\\n(test target-boundary-preserves-caller-provided-data\\n  (let* ((document\\n           (jsown:new-js\\n             (\\\"_id\\\" \\\"legacy-target-2\\\")\\n             (\\\"dataset\\\" \\\"star-intel\\\")\\n             (\\\"target\\\" \\\"caller-top-level.invalid\\\")\\n             (\\\"data\\\" (jsown:new-js (\\\"target\\\" \\\"caller-data.invalid\\\")\\n                                   (\\\"options\\\" #(\\\"opt-a\\\")))))))\\n    (star.frontends.http-api::normalize-legacy-target-document\\n     document \\\"subfinder\\\")\\n    ;; Explicit data wins over the historical top-level field; the URL\\n    ;; actor remains authoritative.\\n    (let ((data (jsown:val document \\\"data\\\")))\\n      (is (string= \\\"caller-data.invalid\\\" (jsown:val data \\\"target\\\")))\\n      (is (string= \\\"subfinder\\\" (jsown:val data \\\"actor\\\")))\\n      (is (= 1 (length (jsown:val data \\\"options\\\")))))\\n    (is-false (jsown:keyp document \\\"target\\\"))))\\n\\n(test target-boundary-rejects-undeclared-legacy-fields\\n  (let ((document\\n          (jsown:new-js\\n            (\\\"_id\\\" \\\"legacy-target-3\\\")\\n            (\\\"dataset\\\" \\\"star-intel\\\")\\n            (\\\"target\\\" \\\"example.invalid\\\")\\n            (\\\"legacy_flat_field\\\" \\\"not-v09\\\"))))\\n    (star.frontends.http-api::normalize-legacy-target-document\\n     document \\\"nmap\\\")\\n    (let ((condition\\n            (capture-http-input-error\\n             (lambda ()\\n               (star.frontends.http-api:validate-document-input\\n                document :path-dtype \\\"target\\\")))))\\n      (is (= 422\\n             (star.frontends.http-api:http-input-error-status condition)))\\n      (is (string= \\\"invalid_document_schema\\\"\\n                   (star.frontends.http-api:http-input-error-code condition))))))\\n\\n(test put-document-route-requires-write-capability\\n  (is (string= \\\"documents:write\\\"\\n               (star.frontends.http-api::route-action\\n                :put \\\"/document/example\\\"))))\\n\\n(test client-status-envelopes-never-expose-tracebacks\\n  (let* ((star.frontends.http-api::*http-correlation-id* \\\"corr-test\\\")\\n         (body\\n           (star.frontends.http-api::status-msg\\n            \\\"Bad Request\\\"\\n            'error\\n            :code \\\"invalid_request\\\"\\n            :traceback \\\"password=super-secret internal stack\\\"))\\n         (parsed (jsown:parse body)))\\n    (is-false (jsown:keyp parsed \\\"trace\\\"))\\n    (is (null (search \\\"super-secret\\\" body :test #'char-equal)))\\n    (is (string= \\\"corr-test\\\" (jsown:val parsed \\\"correlation_id\\\")))))\\n\\n(test numeric-query-validation-is-bounded\\n  (dolist (raw '(\\\"not-a-number\\\" \\\"0\\\" \\\"101\\\"))\\n    (let ((condition\\n            (capture-http-input-error\\n             (lambda ()\\n               (star.frontends.http-api:bounded-query-integer\\n                (list (cons \\\"limit\\\" raw))\\n                \\\"limit\\\"\\n                :minimum 1\\n                :maximum 100)))))\\n      (is (= 400\\n             (star.frontends.http-api:http-input-error-status condition)))))\\n  (is (= 25\\n         (star.frontends.http-api:bounded-query-integer\\n          nil\\n          \\\"limit\\\"\\n          :default 25\\n          :minimum 1\\n          :maximum 100))))\\n\\n(test oversized-bulk-selects-asynchronous-dispatch\\n  (is (eq :inline\\n          (star.frontends.http-api:bulk-request-mode 10)))\\n  (is (eq :async\\n          (star.frontends.http-api:bulk-request-mode 11))))\\n\\n(test terminal-bulk-jobs-release-request-payloads-but-remain-pollable\\n  (dolist (scenario '(:completed :completed-with-errors :failed))\\n    (let* ((documents\\n             (list (make-boundary-document :id \\\"terminal-doc-1\\\")\\n                   (make-boundary-document :id \\\"terminal-doc-2\\\")))\\n           (job\\n             (star.frontends.http-api::make-bulk-ingest-job\\n              :id \\\"terminal-job\\\"\\n              :principal \\\"terminal-principal\\\"\\n              :documents documents\\n              :correlation-id \\\"terminal-correlation\\\"\\n              :service-context '(:request-only))))\\n      (when (eq scenario :failed)\\n        ;; A malformed sequence exercises the outer job failure handler.\\n        (setf (star.frontends.http-api::bulk-ingest-job-documents job)\\n              (cons (first documents) :invalid-tail)))\\n      (star.frontends.http-api:execute-bulk-job\\n       job\\n       :publish-fn\\n       (lambda (document)\\n         (declare (ignore document))\\n         (when (eq scenario :completed-with-errors)\\n           (error \\\"Synthetic per-document publish failure\\\"))))\\n      (let ((info (star.frontends.http-api::bulk-job-info-json job)))\\n        (is (eq scenario\\n                (star.frontends.http-api::bulk-ingest-job-status job)))\\n        (is (= 2 (jsown:val info \\\"total\\\")))\\n        (is (string= \\\"terminal-job\\\" (jsown:val info \\\"job_id\\\")))\\n        (is (string= \\\"terminal-correlation\\\"\\n                     (jsown:val info \\\"correlation_id\\\")))\\n        (is (string= \\\"terminal-principal\\\"\\n                     (star.frontends.http-api::bulk-ingest-job-principal job)))\\n        (is (= (case scenario\\n                 (:completed 2)\\n                 (:failed 1)\\n                 (otherwise 0))\\n               (jsown:val info \\\"succeeded\\\")))\\n        (is (= (if (eq scenario :completed-with-errors) 2 0)\\n               (jsown:val info \\\"failed\\\")))\\n        (is (null (star.frontends.http-api::bulk-ingest-job-documents job)))\\n        (is (null (star.frontends.http-api::bulk-ingest-job-service-context\\n                   job)))))))\\n\\n(test asynchronous-bulk-submission-does-not-wait-for-worker\\n  (let* ((fake-system (list :test-system))\\n         (sent-worker nil)\\n         (sent-job nil)\\n         (star.actors:*sys* fake-system)\\n         (star.frontends.http-api::*bulk-ingest-workers*\\n           (list :fake-worker))\\n         (star.frontends.http-api::*bulk-ingest-worker-system* fake-system)\\n         (star.frontends.http-api::*bulk-ingest-worker-index* 0)\\n         (star.frontends.http-api::*bulk-ingest-jobs*\\n           (make-hash-table :test #'equal))\\n         (star.frontends.http-api::*bulk-pending-jobs* 0)\\n         (star.frontends.http-api::*bulk-pending-by-principal*\\n           (make-hash-table :test #'equal))\\n         (star.frontends.http-api::*bulk-ingest-lock*\\n           (bt:make-lock \\\"http-boundary-test-lock\\\"))\\n         (star.frontends.http-api::*http-correlation-id* \\\"corr-async\\\")\\n         (documents\\n           (loop for index below 11\\n                 collect\\n                 (make-boundary-document\\n                  :id (format nil \\\"async-doc-~d\\\" index))))\\n         (started (get-internal-real-time))\\n         (job\\n           (star.frontends.http-api:submit-bulk-ingest-job\\n            documents\\n            \\\"principal-test\\\"\\n            :ensure-workers-fn\\n            (lambda ()\\n              star.frontends.http-api::*bulk-ingest-workers*)\\n            :tell-fn\\n            (lambda (worker queued-job)\\n              (setf sent-worker worker\\n                    sent-job queued-job))))\\n         (elapsed\\n           (/ (- (get-internal-real-time) started)\\n              internal-time-units-per-second)))\\n    (is-true job)\\n    (is (< elapsed 0.5))\\n    (is (eq :fake-worker sent-worker))\\n    (is (eq job sent-job))\\n    (is (eq :queued\\n            (star.frontends.http-api:bulk-ingest-job-status job)))))\\n\\n(test per-principal-bulk-quota-is-enforced\\n  (let* ((fake-system (list :test-system))\\n         (star.actors:*sys* fake-system)\\n         (star.frontends.http-api::*bulk-ingest-workers*\\n           (list :fake-worker))\\n         (star.frontends.http-api::*bulk-ingest-worker-system* fake-system)\\n         (star.frontends.http-api::*bulk-ingest-worker-index* 0)\\n         (star.frontends.http-api::*bulk-ingest-jobs*\\n           (make-hash-table :test #'equal))\\n         (star.frontends.http-api::*bulk-pending-jobs* 0)\\n         (star.frontends.http-api::*bulk-pending-by-principal*\\n           (make-hash-table :test #'equal))\\n         (star.frontends.http-api::*bulk-ingest-lock*\\n           (bt:make-lock \\\"http-boundary-quota-lock\\\"))\\n         (star.frontends.http-api::*http-correlation-id* \\\"corr-quota\\\")\\n         (documents (list (make-boundary-document)))\\n         (ensure-workers\\n           (lambda ()\\n             star.frontends.http-api::*bulk-ingest-workers*))\\n         (tell-noop\\n           (lambda (worker job)\\n             (declare (ignore worker job)))))\\n    (dotimes (index 4)\\n      (declare (ignore index))\\n      (star.frontends.http-api:submit-bulk-ingest-job\\n       documents\\n       \\\"quota-principal\\\"\\n       :ensure-workers-fn ensure-workers\\n       :tell-fn tell-noop))\\n    (let ((condition\\n            (capture-http-input-error\\n             (lambda ()\\n               (star.frontends.http-api:submit-bulk-ingest-job\\n                documents\\n                \\\"quota-principal\\\"\\n                :ensure-workers-fn ensure-workers\\n                :tell-fn tell-noop)))))\\n      (is (= 429\\n             (star.frontends.http-api:http-input-error-status condition)))\\n      (is (string= \\\"principal_bulk_quota_exceeded\\\"\\n                   (star.frontends.http-api:http-input-error-code\\n                    condition))))))\\n\"},{\"path\":\"t/http-target-v1-test.lisp\",\"expected\":\"6122c0699674e2b76c6336dc5fa5ad12becb2162\",\"content\":\"(in-package :star-server-tests)\\n\\n(def-suite http-target-v1-tests\\n  :description \\\"Versioned target creation, authorization and idempotency contract\\\")\\n\\n(in-suite http-target-v1-tests)\\n\\n(defun make-v1-target-request (&key\\n                                 (actor \\\"subfinder\\\")\\n                                 (target \\\"example.org\\\")\\n                                 (dataset \\\"star-intel\\\")\\n                                 (delay 1)\\n                                 (recurring nil)\\n                                 (options #())\\n                                 (idempotency-key \\\"bixby-draft-123\\\"))\\n  (jsown:new-js\\n    (\\\"actor\\\" actor)\\n    (\\\"target\\\" target)\\n    (\\\"dataset\\\" dataset)\\n    (\\\"delay\\\" delay)\\n    (\\\"recurring\\\" (if recurring :true :false))\\n    (\\\"options\\\" options)\\n    (\\\"idempotency_key\\\" idempotency-key)))\\n\\n(test v1-target-create-is-a-generic-target-dispatch-capability\\n  (is (string= \\\"targets:dispatch\\\"\\n               (star.frontends.http-api::route-action\\n                :post \\\"/api/v1/targets\\\")))\\n  (let ((operation\\n          (star.http.contract:find-http-operation \\\"targets.create\\\")))\\n    (is (eq :post (star.http.contract:http-operation-method operation)))\\n    (is (string= \\\"/api/v1/targets\\\"\\n                 (star.http.contract:http-operation-path operation)))\\n    (is (equal '(\\\"targets:dispatch\\\")\\n               (star.http.contract:http-operation-scopes operation)))))\\n\\n(test v1-target-idempotency-is-principal-bound-and-deterministic\\n  (let* ((request (make-v1-target-request))\\n         (first\\n           (star.frontends.http-api::target-v1-document-from-request\\n            request \\\"human:alice\\\"))\\n         (retry\\n           (star.frontends.http-api::target-v1-document-from-request\\n            request \\\"human:alice\\\"))\\n         (other-user\\n           (star.frontends.http-api::target-v1-document-from-request\\n            request \\\"human:bob\\\"))\\n         (extensions (jsown:val first \\\"extensions\\\")))\\n    (is (string= (jsown:val first \\\"_id\\\")\\n                 (jsown:val retry \\\"_id\\\")))\\n    (is (not (string= (jsown:val first \\\"_id\\\")\\n                      (jsown:val other-user \\\"_id\\\"))))\\n    (is (string= \\\"target\\\" (jsown:val first \\\"dtype\\\")))\\n    (is (string= starintel.legacy:+starintel-doc-version+\\n                 (jsown:val first \\\"schema_version\\\")))\\n    (is (stringp (jsown:val extensions \\\"idempotency_key\\\")))\\n    (is (null (search \\\"bixby-draft-123\\\"\\n                      (jsown:val extensions \\\"idempotency_key\\\")\\n                      :test #'char-equal)))))\\n\\n(test v1-target-document-is-data-shaped-and-schema-valid\\n  (let* ((document\\n           (star.frontends.http-api::target-v1-document-from-request\\n            (make-v1-target-request) \\\"human:alice\\\"))\\n         (data (jsown:val document \\\"data\\\"))\\n         (extensions (jsown:val document \\\"extensions\\\")))\\n    ;; The closed v0.9 top level carries envelope fields only.\\n    (dolist (key '(\\\"actor\\\" \\\"target\\\" \\\"delay\\\" \\\"recurring\\\" \\\"options\\\"\\n                   \\\"schedule_id\\\"))\\n      (is-false (jsown:keyp document key)))\\n    ;; Target semantics live inside data.\\n    (is (string= \\\"subfinder\\\" (jsown:val data \\\"actor\\\")))\\n    (is (string= \\\"example.org\\\" (jsown:val data \\\"target\\\")))\\n    (is (= 1 (jsown:val data \\\"delay\\\")))\\n    (is (eq :false (jsown:val data \\\"recurring\\\")))\\n    (is (vectorp (jsown:val data \\\"options\\\")))\\n    ;; Schedule and idempotency identity live in the extensions envelope.\\n    (is (string= \\\"target-request:\\\"\\n                 (subseq (jsown:val extensions \\\"schedule_id\\\") 0 15)))\\n    ;; The schema-required envelope collections exist.\\n    (is (vectorp (jsown:val document \\\"sources\\\")))\\n    (is (vectorp (jsown:val document \\\"evidence\\\")))\\n    ;; The built document is accepted by the canonical strict validator.\\n    (is (eq document\\n             (star.documents:validate-v09-document document)))))\\n\\n(test v1-schedule-identity-is-read-from-extensions\\n  (let* ((document\\n           (star.frontends.http-api::target-v1-document-from-request\\n            (make-v1-target-request) \\\"human:alice\\\"))\\n         (record (star.actors::parse-target-record document)))\\n    (is (string= (jsown:val (jsown:val document \\\"extensions\\\") \\\"schedule_id\\\")\\n                 (star.actors::target-record-schedule-id record)))\\n    (is (string= (jsown:val document \\\"_id\\\")\\n                 (star.actors::target-record-id record)))))\\n\\n(test legacy-persisted-target-keeps-its-schedule-identity\\n  ;; Recovery of pre-fix persisted documents still reads top-level fields.\\n  (let* ((document\\n           (jsown:new-js\\n             (\\\"_id\\\" \\\"legacy-persisted-target\\\")\\n             (\\\"dataset\\\" \\\"star-intel\\\")\\n             (\\\"dtype\\\" \\\"target\\\")\\n             (\\\"actor\\\" \\\"subfinder\\\")\\n             (\\\"target\\\" \\\"legacy.example.invalid\\\")\\n             (\\\"delay\\\" 60)\\n             (\\\"schedule_id\\\" \\\"legacy-schedule-1\\\")))\\n         (record (star.actors::parse-target-record document)))\\n    (is (string= \\\"subfinder\\\" (star.actors::target-record-actor record)))\\n    (is (string= \\\"legacy.example.invalid\\\" (star.actors::target-record-target record)))\\n    (is (= 60 (star.actors::target-record-delay record)))\\n    (is (string= \\\"legacy-schedule-1\\\"\\n                 (star.actors::target-record-schedule-id record)))))\\n\\n(test v1-target-request-rejects-missing-idempotency-and-invalid-delay\\n  (let ((missing-key (make-v1-target-request))\\n        (zero-delay (make-v1-target-request :delay 0)))\\n    (jsown:remkey missing-key \\\"idempotency_key\\\")\\n    (let ((missing-condition\\n            (capture-http-input-error\\n             (lambda ()\\n               (star.frontends.http-api::target-v1-document-from-request\\n                missing-key \\\"human:alice\\\"))))\\n          (delay-condition\\n            (capture-http-input-error\\n             (lambda ()\\n               (star.frontends.http-api::target-v1-document-from-request\\n                zero-delay \\\"human:alice\\\")))))\\n      (is (= 400\\n             (star.frontends.http-api:http-input-error-status\\n              missing-condition)))\\n      (is (string= \\\"idempotency_key_required\\\"\\n                   (star.frontends.http-api:http-input-error-code\\n                    missing-condition)))\\n      (is (= 422\\n             (star.frontends.http-api:http-input-error-status\\n              delay-condition)))\\n      (is (string= \\\"invalid_target_delay\\\"\\n                   (star.frontends.http-api:http-input-error-code\\n                    delay-condition))))))\\n\\n(test request-ledger-detects-content-change-under-same-idempotency-key\\n  (let* ((left-request (make-v1-target-request :target \\\"example.org\\\"))\\n         (right-request (make-v1-target-request :target \\\"example.net\\\"))\\n         (left-document\\n           (star.frontends.http-api::target-v1-document-from-request\\n            left-request \\\"human:alice\\\"))\\n         (right-document\\n           (star.frontends.http-api::target-v1-document-from-request\\n            right-request \\\"human:alice\\\"))\\n         (left-ledger\\n           (star.frontends.http-api::target-v1-request-ledger\\n            left-request left-document \\\"human:alice\\\"))\\n         (right-ledger\\n           (star.frontends.http-api::target-v1-request-ledger\\n            right-request right-document \\\"human:alice\\\")))\\n    ;; The idempotency identity is stable, but its semantic fingerprint is not.\\n    (is (string= (jsown:val left-ledger \\\"_id\\\")\\n                 (jsown:val right-ledger \\\"_id\\\")))\\n    (is (not (string= (jsown:val left-ledger \\\"fingerprint\\\")\\n                      (jsown:val right-ledger \\\"fingerprint\\\"))))\\n    (is-false\\n     (star.frontends.http-api::target-v1-request-equivalent-p\\n      left-ledger right-ledger))))\\n\\n(test durable-target-fingerprint-detects-content-change-under-same-key\\n  (let* ((left-doc\\n           (star.frontends.http-api::target-v1-document-from-request\\n            (make-v1-target-request :target \\\"example.org\\\")\\n            \\\"human:alice\\\"))\\n         (right-doc\\n           (star.frontends.http-api::target-v1-document-from-request\\n            (make-v1-target-request :target \\\"example.net\\\")\\n            \\\"human:alice\\\"))\\n         (destination\\n           (star.actors::make-target-destination-handle\\n            :rabbit \\\"subfinder\\\"\\n            :routing-key \\\"documents.target.dispatch.subfinder\\\"))\\n         (left-envelope\\n           (star.actors::make-target-dispatch-envelope\\n            (star.actors::parse-target-record left-doc)\\n            :destination destination))\\n         (right-envelope\\n           (star.actors::make-target-dispatch-envelope\\n            (star.actors::parse-target-record right-doc)\\n            :destination destination)))\\n    (is (not (string=\\n              (star.actors::target-dispatch-fingerprint left-envelope)\\n              (star.actors::target-dispatch-fingerprint right-envelope))))))\\n\\n(test v1-target-receipt-is-narrow-and-retry-aware\\n  (let* ((request (make-v1-target-request))\\n         (document\\n           (star.frontends.http-api::target-v1-document-from-request\\n            request \\\"human:alice\\\"))\\n         (ledger\\n           (star.frontends.http-api::target-v1-request-ledger\\n            request document \\\"human:alice\\\"))\\n         (accepted-json\\n           (star.frontends.http-api::target-v1-receipt ledger :created))\\n         (duplicate-json\\n           (star.frontends.http-api::target-v1-receipt ledger :duplicate)))\\n    (is (string= \\\"accepted\\\" (jsown:val accepted-json \\\"status\\\")))\\n    (is (string= \\\"duplicate\\\" (jsown:val duplicate-json \\\"status\\\")))\\n    (is (string= (jsown:val document \\\"_id\\\")\\n                 (jsown:val accepted-json \\\"target_id\\\")))\\n    (is (string= (jsown:val ledger \\\"_id\\\")\\n                 (jsown:val accepted-json \\\"request_id\\\")))\\n    (is-false (jsown:keyp accepted-json \\\"target_document\\\"))\\n    (is-false (jsown:keyp accepted-json \\\"principal_id\\\"))))\"},{\"path\":\"t/http-target-tenant-test.lisp\",\"expected\":\"b3b864378d15ce77f0aa100cf2b2d262e79cbaa7\",\"content\":\"(in-package :star-server-tests)\\n\\n(def-suite http-target-tenant-tests\\n  :description \\\"Tenant-scoped target-list regression and adversarial isolation\\\")\\n\\n(in-suite http-target-tenant-tests)\\n\\n(defun make-target-list-principal (id scopes)\\n  (star.auth::%make-request-principal\\n   :id id\\n   :type \\\"api_client\\\"\\n   :scopes scopes\\n   :credential-id (format nil \\\"credential-~a\\\" id)))\\n\\n(defun make-tenant-target-document (id tenant actor &key (dataset \\\"dataset-a\\\"))\\n  (let ((document\\n          (jsown:new-js\\n            (\\\"_id\\\" id)\\n            (\\\"tenant_id\\\" tenant)\\n            (\\\"dtype\\\" \\\"target\\\")\\n            (\\\"version\\\" starintel.legacy:+starintel-doc-version+)\\n            (\\\"data\\\"\\n             (jsown:new-js\\n               (\\\"actor\\\" actor)\\n               (\\\"target\\\" (format nil \\\"target-value-~a\\\" id)))))))\\n    (when dataset\\n      (setf (jsown:val document \\\"dataset\\\") dataset))\\n    document))\\n\\n(defun target-view-response (&rest documents)\\n  (jsown:new-js\\n    (\\\"rows\\\"\\n     (loop for document in documents\\n           collect (jsown:new-js (\\\"doc\\\" document))))))\\n\\n(test target-list-regression-honors-explicit-tenant-and-composite-view-key\\n  (let* ((principal\\n           (make-target-list-principal\\n            \\\"agent-zero-reader\\\"\\n            '(\\\"targets:read\\\"\\n              \\\"tenant:agent-zero\\\"\\n              \\\"actor:*\\\")))\\n         (document\\n           (make-tenant-target-document\\n            \\\"target-a\\\" \\\"agent-zero\\\" \\\"test-actor\\\"))\\n         (query-calls 0)\\n         (captured-arguments nil)\\n         (result\\n           (star.frontends.http-api::query-authorized-target-documents\\n            nil\\n            \\\"records\\\"\\n            \\\"test-actor\\\"\\n            \\\"agent-zero\\\"\\n            principal\\n            '(:route \\\"/targets/:actor\\\" :method \\\"GET\\\")\\n            :query-fn\\n            (lambda (client database design view &rest arguments)\\n              (declare (ignore client))\\n              (incf query-calls)\\n              (is (string= \\\"records\\\" database))\\n              (is (string= \\\"targets\\\" design))\\n              (is (string= \\\"by_tenant_actor\\\" view))\\n              (setf captured-arguments arguments)\\n              (target-view-response document)))))\\n    ;; This is the exact regression credential from #169: no dataset:* or\\n    ;; target:* grant is needed for the tenant+actor target-list contract.\\n    (is (= 1 query-calls))\\n    (is (equal '(\\\"agent-zero\\\" \\\"test-actor\\\")\\n               (getf captured-arguments :key)))\\n    (is-true (getf captured-arguments :include-docs))\\n    (is (= 1 (length result)))\\n    (is (string= \\\"target-a\\\" (jsown:val (first result) \\\"_id\\\")))))\\n\\n(test target-list-denies-ungranted-tenant-before-backend-io\\n  (let ((principal\\n          (make-target-list-principal\\n           \\\"agent-zero-reader\\\"\\n           '(\\\"targets:read\\\"\\n             \\\"tenant:agent-zero\\\"\\n             \\\"actor:*\\\")))\\n        (query-calls 0))\\n    (signals star.authorization:authorization-error\\n      (star.frontends.http-api::query-authorized-target-documents\\n       nil\\n       \\\"records\\\"\\n       \\\"test-actor\\\"\\n       \\\"other-tenant\\\"\\n       principal\\n       nil\\n       :query-fn\\n       (lambda (&rest arguments)\\n         (declare (ignore arguments))\\n         (incf query-calls)\\n         (error \\\"unauthorized target list reached backend I/O\\\"))))\\n    (is (zerop query-calls))))\\n\\n(test target-list-drops-poisoned-cross-tenant-and-cross-actor-rows\\n  (let* ((principal\\n           (make-target-list-principal\\n            \\\"wildcard-reader\\\"\\n            '(\\\"targets:read\\\"\\n              \\\"tenant:*\\\"\\n              \\\"actor:*\\\")))\\n         (allowed\\n           (make-tenant-target-document\\n            \\\"allowed\\\" \\\"agent-zero\\\" \\\"test-actor\\\"))\\n         (wrong-tenant\\n           (make-tenant-target-document\\n            \\\"wrong-tenant\\\" \\\"other-tenant\\\" \\\"test-actor\\\"))\\n         (wrong-actor\\n           (make-tenant-target-document\\n            \\\"wrong-actor\\\" \\\"agent-zero\\\" \\\"other-actor\\\"))\\n         (result\\n           (star.frontends.http-api::query-authorized-target-documents\\n            nil\\n            \\\"records\\\"\\n            \\\"test-actor\\\"\\n            \\\"agent-zero\\\"\\n            principal\\n            nil\\n            :query-fn\\n            (lambda (&rest arguments)\\n              (declare (ignore arguments))\\n              ;; Simulate stale/misindexed/poisoned backend output. Wildcard\\n              ;; authorization must not turn these rows into response leakage.\\n              (target-view-response allowed wrong-tenant wrong-actor)))))\\n    (is (= 1 (length result)))\\n    (is (string= \\\"allowed\\\" (jsown:val (first result) \\\"_id\\\")))))\\n\\n(test target-list-preserves-present-dataset-restrictions\\n  (let* ((principal\\n           (make-target-list-principal\\n            \\\"dataset-reader\\\"\\n            '(\\\"targets:read\\\"\\n              \\\"tenant:agent-zero\\\"\\n              \\\"actor:test-actor\\\"\\n              \\\"dataset:dataset-a\\\"\\n              \\\"target:*\\\")))\\n         (allowed\\n           (make-tenant-target-document\\n            \\\"target-a\\\" \\\"agent-zero\\\" \\\"test-actor\\\"\\n            :dataset \\\"dataset-a\\\"))\\n         (wrong-dataset\\n           (make-tenant-target-document\\n            \\\"target-b\\\" \\\"agent-zero\\\" \\\"test-actor\\\"\\n            :dataset \\\"dataset-b\\\"))\\n         (missing-dataset\\n           (make-tenant-target-document\\n            \\\"target-c\\\" \\\"agent-zero\\\" \\\"test-actor\\\"\\n            :dataset nil))\\n         (result\\n           (star.frontends.http-api::query-authorized-target-documents\\n            nil\\n            \\\"records\\\"\\n            \\\"test-actor\\\"\\n            \\\"agent-zero\\\"\\n            principal\\n            nil\\n            :query-fn\\n            (lambda (&rest arguments)\\n              (declare (ignore arguments))\\n              (target-view-response\\n               allowed wrong-dataset missing-dataset)))))\\n    (is (= 1 (length result)))\\n    (is (string= \\\"target-a\\\" (jsown:val (first result) \\\"_id\\\")))))\\n\\n(test target-list-preserves-present-target-restrictions\\n  (let* ((principal\\n           (make-target-list-principal\\n            \\\"target-reader\\\"\\n            '(\\\"targets:read\\\"\\n              \\\"tenant:agent-zero\\\"\\n              \\\"actor:test-actor\\\"\\n              \\\"target:target-a\\\")))\\n         (allowed\\n           (make-tenant-target-document\\n            \\\"target-a\\\" \\\"agent-zero\\\" \\\"test-actor\\\"))\\n         (wrong-target\\n           (make-tenant-target-document\\n            \\\"target-b\\\" \\\"agent-zero\\\" \\\"test-actor\\\"))\\n         (result\\n           (star.frontends.http-api::query-authorized-target-documents\\n            nil\\n            \\\"records\\\"\\n            \\\"test-actor\\\"\\n            \\\"agent-zero\\\"\\n            principal\\n            nil\\n            :query-fn\\n            (lambda (&rest arguments)\\n              (declare (ignore arguments))\\n              (target-view-response allowed wrong-target)))))\\n    (is (= 1 (length result)))\\n    (is (string= \\\"target-a\\\" (jsown:val (first result) \\\"_id\\\")))))\\n\\n(test target-list-missing-tenant-default-is-explicit-and-empty-is-rejected\\n  (is (string= \\\"default\\\"\\n               (star.frontends.http-api::target-list-tenant\\n                '((\\\"actor\\\" . \\\"test-actor\\\")))))\\n  (is (string= \\\"agent-zero\\\"\\n               (star.frontends.http-api::target-list-tenant\\n                '((\\\"tenant\\\" . \\\"agent-zero\\\")))))\\n  (signals star.frontends.http-api::http-input-error\\n    (star.frontends.http-api::target-list-tenant\\n     '((\\\"tenant\\\" . \\\"\\\")))))\\n\\n(test tenant-scoped-target-view-is-checked-in\\n  (let* ((design-documents\\n           (star.databases.couchdb::checked-in-design-document-map))\\n         (targets (gethash \\\"targets\\\" design-documents))\\n         (views (and targets (jsown:val-safe targets \\\"views\\\")))\\n         (view (and views (jsown:val-safe views \\\"by_tenant_actor\\\")))\\n         (map-source (and view (jsown:val-safe view \\\"map\\\"))))\\n    (is-true view)\\n    (is (search \\\"tenant_id\\\" map-source))\\n    (is (search \\\"emit([tenant, v('actor')]\\\" map-source))))\\n\"},{\"path\":\"t/authorization-policy-test.lisp\",\"expected\":\"05cd14963b2ca17494af548d1c39b7dc19bfd9b8\",\"content\":\"(in-package :star-server-tests)\\n\\n(def-suite authorization-policy-tests\\n  :description \\\"Default-deny capability and resource authorization\\\")\\n\\n(in-suite authorization-policy-tests)\\n\\n(defun make-policy-principal (id scopes &optional (type \\\"api_client\\\"))\\n  (star.auth::%make-request-principal\\n   :id id\\n   :type type\\n   :scopes scopes\\n   :credential-id (format nil \\\"credential-~a\\\" id)))\\n\\n(defun policy-resource (&key (tenant \\\"default\\\") dataset actor target\\n                          namespace program (id \\\"resource-1\\\")\\n                          (dtype \\\"note\\\"))\\n  (star.authorization:make-authorization-resource\\n   :tenant-id tenant\\n   :dataset-id dataset\\n   :actor-name actor\\n   :target-id target\\n   :target-namespace namespace\\n   :program-id program\\n   :resource-id id\\n   :dtype dtype))\\n\\n(defun policy-document (&key (id \\\"doc-1\\\") (dataset \\\"dataset-a\\\")\\n                          (tenant \\\"default\\\") (dtype \\\"note\\\") actor\\n                          namespace program)\\n  (let ((document\\n          (jsown:new-js\\n            (\\\"_id\\\" id)\\n            (\\\"dataset\\\" dataset)\\n            (\\\"tenant_id\\\" tenant)\\n            (\\\"dtype\\\" dtype)\\n            (\\\"version\\\" starintel.legacy:+starintel-doc-version+))))\\n    (when actor\\n      (setf (jsown:val document \\\"actor\\\") actor))\\n    (when namespace\\n      (setf (jsown:val document \\\"target_namespace\\\") namespace))\\n    (when program\\n      (setf (jsown:val document \\\"program_id\\\") program))\\n    document))\\n\\n(test read-only-principal-cannot-write-delete-dispatch-or-lease\\n  (let* ((principal\\n           (make-policy-principal\\n            \\\"reader\\\"\\n            '(\\\"documents:read\\\"\\n              \\\"tenant:default\\\"\\n              \\\"dataset:dataset-a\\\")))\\n         (resource (policy-resource :dataset \\\"dataset-a\\\")))\\n    (is-true\\n     (star.authorization:authorize!\\n      \\\"documents:read\\\" :principal principal :resource resource))\\n    (dolist (action\\n             '(\\\"documents:write\\\"\\n               \\\"documents:delete\\\"\\n               \\\"targets:dispatch\\\"\\n               \\\"targets:lease\\\"))\\n      (signals star.authorization:authorization-error\\n        (star.authorization:authorize!\\n         action :principal principal :resource resource)))))\\n\\n(test dataset-and-tenant-scopes-deny-cross-boundary-access\\n  (let ((principal\\n          (make-policy-principal\\n           \\\"dataset-a-reader\\\"\\n           '(\\\"documents:read\\\"\\n             \\\"search:read\\\"\\n             \\\"views:read\\\"\\n             \\\"tenant:default\\\"\\n             \\\"dataset:dataset-a\\\"))))\\n    (is-true\\n     (star.authorization:authorize!\\n      \\\"documents:read\\\"\\n      :principal principal\\n      :resource (policy-resource :dataset \\\"dataset-a\\\")))\\n    (signals star.authorization:authorization-error\\n      (star.authorization:authorize!\\n       \\\"documents:read\\\"\\n       :principal principal\\n       :resource (policy-resource :dataset \\\"dataset-b\\\")))\\n    (signals star.authorization:authorization-error\\n      (star.authorization:authorize!\\n       \\\"documents:read\\\"\\n       :principal principal\\n       :resource\\n       (policy-resource :tenant \\\"tenant-b\\\" :dataset \\\"dataset-a\\\")))))\\n\\n(test direct-lookup-service-enforces-dataset-policy\\n  (let ((principal\\n          (make-policy-principal\\n           \\\"direct-reader\\\"\\n           '(\\\"documents:read\\\"\\n             \\\"tenant:default\\\"\\n             \\\"dataset:dataset-a\\\")))\\n        (fetches 0))\\n    (is-true\\n     (star.authorization:authorized-fetch-document\\n      \\\"doc-a\\\"\\n      (lambda (id)\\n        (declare (ignore id))\\n        (incf fetches)\\n        (policy-document :dataset \\\"dataset-a\\\"))\\n      :principal principal))\\n    (signals star.authorization:authorization-error\\n      (star.authorization:authorized-fetch-document\\n       \\\"doc-b\\\"\\n       (lambda (id)\\n         (declare (ignore id))\\n         (incf fetches)\\n         (policy-document :dataset \\\"dataset-b\\\"))\\n       :principal principal))\\n    (is (= 2 fetches))))\\n\\n(test delete-service-authorizes-before-side-effect\\n  (let ((reader\\n          (make-policy-principal\\n           \\\"reader\\\"\\n           '(\\\"documents:read\\\"\\n             \\\"tenant:default\\\"\\n             \\\"dataset:dataset-a\\\")))\\n        (deleter\\n          (make-policy-principal\\n           \\\"deleter\\\"\\n           '(\\\"documents:delete\\\"\\n             \\\"tenant:default\\\"\\n             \\\"dataset:dataset-a\\\")))\\n        (deletes 0))\\n    (signals star.authorization:authorization-error\\n      (star.authorization:authorized-delete-document\\n       \\\"doc-a\\\"\\n       (lambda (id)\\n         (declare (ignore id))\\n         (let ((document (policy-document :dataset \\\"dataset-a\\\")))\\n           (setf (jsown:val document \\\"_rev\\\") \\\"1-test\\\")\\n           document))\\n       (lambda (id revision)\\n         (declare (ignore id revision))\\n         (incf deletes))\\n       :principal reader))\\n    (is (zerop deletes))\\n    (star.authorization:authorized-delete-document\\n     \\\"doc-a\\\"\\n     (lambda (id)\\n       (declare (ignore id))\\n       (let ((document (policy-document :dataset \\\"dataset-a\\\")))\\n         (setf (jsown:val document \\\"_rev\\\") \\\"1-test\\\")\\n         document))\\n     (lambda (id revision)\\n       (declare (ignore id revision))\\n       (incf deletes)\\n       :deleted)\\n     :principal deleter)\\n    (is (= 1 deletes))))\\n\\n(test search-query-is-backend-scoped-and-cross-dataset-search-denies\\n  (let ((principal\\n          (make-policy-principal\\n           \\\"searcher\\\"\\n           '(\\\"search:read\\\"\\n             \\\"tenant:default\\\"\\n             \\\"dataset:dataset-a\\\"))))\\n    (let ((query\\n            (star.authorization:authorized-search-query\\n             \\\"content:fixture\\\"\\n             :principal principal)))\\n      (is (search \\\"dataset:\\\\\\\"dataset-a\\\\\\\"\\\" query))\\n      (is (search \\\"tenant_id:\\\\\\\"default\\\\\\\"\\\" query))\\n      (is (null (search \\\"dataset-b\\\" query))))\\n    (signals star.authorization:authorization-error\\n      (star.authorization:authorized-search-query\\n       \\\"content:fixture\\\"\\n       :principal principal\\n       :requested-dataset \\\"dataset-b\\\"))))\\n\\n(test scoped-view-removes-cross-dataset-rows-and-replaces-counts\\n  (let* ((principal\\n           (make-policy-principal\\n            \\\"view-reader\\\"\\n            '(\\\"views:read\\\"\\n              \\\"tenant:default\\\"\\n              \\\"dataset:dataset-a\\\")))\\n         (row-a\\n           (jsown:new-js\\n             (\\\"id\\\" \\\"doc-a\\\")\\n             (\\\"doc\\\" (policy-document\\n                     :id \\\"doc-a\\\" :dataset \\\"dataset-a\\\"))))\\n         (row-b\\n           (jsown:new-js\\n             (\\\"id\\\" \\\"doc-b\\\")\\n             (\\\"doc\\\" (policy-document\\n                     :id \\\"doc-b\\\" :dataset \\\"dataset-b\\\"))))\\n         (response\\n           (jsown:new-js\\n             (\\\"total_rows\\\" 2)\\n             (\\\"offset\\\" 0)\\n             (\\\"rows\\\" (list row-a row-b))))\\n         (filtered\\n           (star.authorization:authorized-view-response\\n            response\\n            :principal principal\\n            :requested-dataset \\\"dataset-a\\\")))\\n    (is (= 1 (jsown:val filtered \\\"total_rows\\\")))\\n    (is (= 1 (length (jsown:val filtered \\\"rows\\\"))))\\n    (is (string= \\\"doc-a\\\"\\n                 (jsown:val (first (jsown:val filtered \\\"rows\\\")) \\\"id\\\")))))\\n\\n(test bulk-denial-happens-before-any-publish\\n  (let ((principal\\n          (make-policy-principal\\n           \\\"bulk-writer\\\"\\n           '(\\\"documents:bulk\\\"\\n             \\\"documents:write\\\"\\n             \\\"tenant:default\\\"\\n             \\\"dataset:dataset-a\\\")))\\n        (published 0)\\n        (documents\\n          (list (policy-document :id \\\"a\\\" :dataset \\\"dataset-a\\\")\\n                (policy-document :id \\\"b\\\" :dataset \\\"dataset-b\\\"))))\\n    (signals star.authorization:authorization-error\\n      (star.authori