name: Maintained canonical closure candidate

on:
  push:
    branches: ["codex/starintel-0101-ingest"]
    paths: [".github/workflows/canonical-closure.yml"]

permissions:
  contents: read

concurrency:
  group: canonical-closure-candidate
  cancel-in-progress: false

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify untouched historical baseline
        run: |
          python3 scripts/check-starintel-schema-lock.py
          python3 scripts/check-starintel-dependency-lock.py
      - name: Build repository-pinned native Qlot
        id: qlot
        shell: bash
        run: |
          set -euo pipefail
          qlot="$(nix build --impure --no-link --print-out-paths --expr 'let f = builtins.getFlake (toString ./.); p = import f.inputs.nixpkgs { system = "x86_64-linux"; overlays = [ (import ./nix/qlot-cli.nix) ]; }; in p.sbclPackages.qlot-cli')"
          test -x "$qlot/bin/qlot"
          echo "path=$qlot" >> "$GITHUB_OUTPUT"
          echo "Native Qlot derivation: $qlot"
          evidence="$RUNNER_TEMP/canonical-closure-evidence"
          mkdir -p "$evidence"
          python3 - <<'PY'
          from pathlib import Path
          import os
          (Path(os.environ["RUNNER_TEMP"])/"canonical-closure-evidence"/"baseline-qlfile.lock").write_bytes(Path("qlfile.lock").read_bytes())
          p=Path("qlfile"); s=p.read_text()
          old='github lost-rob0t/star-cl :ref "a18a6cddcbcf4d989495a5de8abcedc4d0294d1c"'
          new='github lost-rob0t/star-cl :ref a18a6cddcbcf4d989495a5de8abcedc4d0294d1c'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          set +e
          timeout 600 "$qlot/bin/qlot" install --no-deps > "$evidence/qlot-bootstrap.log" 2>&1
          status=$?
          set -e
          tail -n 100 "$evidence/qlot-bootstrap.log"
          test "$status" = 0
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request,urllib.parse
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-closure-evidence"
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  safe(newurl)
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          def safe(url):
              u=urllib.parse.urlsplit(url)
              assert u.scheme=="https" and u.hostname=="beta.quicklisp.org" and not u.username and not u.password,url
              return url
          opener=urllib.request.build_opener(SafeRedirect)
          def get(url,limit):
              safe(url)
              with opener.open(url,timeout=60) as r:
                  safe(r.url);data=r.read(limit+1)
                  assert len(data)<=limit,"response too large"
                  return data
          def rows(data):
              lines=data.decode().splitlines()
              return [line.split() for line in lines if line and not line.startswith("#")]
          records=[]
          for version in ("2024-10-12","2023-10-21"):
              url="https://beta.quicklisp.org/dist/quicklisp/"+version+"/distinfo.txt"
              raw=get(url,100000)
              (out/("clssl-"+version+"-distinfo.txt")).write_bytes(raw)
              info=dict(line.split(": ",1) for line in raw.decode().splitlines() if ": " in line)
              assert info["name"]=="quicklisp" and info["version"]==version
              def https(url):
                  u=urllib.parse.urlsplit(url)
                  assert u.scheme in ("http","https") and u.hostname=="beta.quicklisp.org"
                  return safe(urllib.parse.urlunsplit(u._replace(scheme="https")))
              release_url=https(info["release-index-url"]);system_url=https(info["system-index-url"])
              release_raw=get(release_url,10000000);system_raw=get(system_url,20000000)
              release_header=release_raw.decode().splitlines()[0]
              system_header=system_raw.decode().splitlines()[0]
              assert release_header.startswith("# project url size file-md5 content-sha1 prefix"),release_header
              assert system_header.startswith("# project system-file system-name"),system_header
              release=[r for r in rows(release_raw) if r[0]=="cl+ssl"]
              systems=[r for r in rows(system_raw) if r[0]=="cl+ssl"]
              assert len(release)==1 and systems,(len(release),len(systems))
              row=release[0];assert len(row)>=7
              archive_url=https(row[1]);data=get(archive_url,20000000)
              assert len(data)==int(row[2]) and hashlib.md5(data).hexdigest()==row[3]
              record=dict(version=version,distinfo_url=url,release_index_url=release_url,system_index_url=system_url,release_header=release_header,system_header=system_header,release=row,systems=systems,archive_url=archive_url,archive_size=len(data),archive_sha256=hashlib.sha256(data).hexdigest())
              records.append(record)
              (out/("clssl-"+version+"-metadata.json")).write_text(json.dumps(record,indent=2)+"\n")
          assert records[0]["release"]==records[1]["release"],"release metadata differs"
          assert records[0]["systems"]==records[1]["systems"],"systems/dependencies differ"
          assert records[0]["archive_sha256"]==records[1]["archive_sha256"]=="554e8cf79771221cf3991085da9b7cb659a78fd7ff71c81ae56d524f2d1eec46","archive bytes differ"
          assert records[0]["archive_size"]==records[1]["archive_size"]==92364
          print("CLSSL_NATIVE_NORMALIZATION_EQUIVALENCE "+json.dumps(records))
          PY
          python3 - <<'PY'
          import os,pathlib
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-closure-evidence"
          original=(out/"baseline-qlfile.lock").read_text()
          old="(\"cl+ssl\" .\n (:class qlot/source/ql:source-ql\n  :initargs (:%version :latest)\n  :version \"ql-2024-10-12\"))"
          new=old.replace("ql-2024-10-12","ql-2023-10-21")
          assert original.count(old)==1
          assert pathlib.Path("qlfile.lock").read_text()==original.replace(old,new),"unexpected bootstrap lock drift"
          print("Native bootstrap changes only proven byte-equivalent cl+ssl version metadata")
          PY
      - name: Establish maintained mismatch RED and author only declarations
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, subprocess, urllib.request
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-closure-evidence"
          out.mkdir(exist_ok=True)
          baseline="08241fb9b28c615c5e84ec54540b96097dc6c645"
          library="33935f1e6739b0015926a2a163ba55cf203fbc9d"
          authority="96d26c338078676ec1dc6928755901636c9f7ef0"
          def git(*args): return subprocess.check_output(["git",*args],text=True).strip()
          assert git("rev-parse","HEAD^")=="72f0425bc0fc8bb7209fbcbc2e1a1c67669889bf"
          assert git("diff","--name-only",baseline,"HEAD")==".github/workflows/canonical-closure.yml"
          with urllib.request.urlopen("https://raw.githubusercontent.com/lost-rob0t/star-cl/"+library+"/schema/starintel-schema.lock.json") as r:
              maintained=json.load(r)
          assert maintained["canonical_commit"]==authority
          assert maintained["release_version"]==maintained["schema_version"]=="0.10.1"
          assert len(maintained["vendored_files"])==18
          spec=importlib.util.spec_from_file_location("sync_starintel","scripts/sync-starintel-schema.py")
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          module.verify_release(authority,None)
          before=json.loads((root/"schema/starintel-schema.lock.json").read_text())
          assert before["canonical_commit"]=="765f1673851192bcaf1cdd2f35c47608f979b079"
          assert len(before["vendored_files"])==11
          try:
              assert before==maintained, "baseline differs from maintained generated closure"
          except AssertionError as e:
              print("EXPECTED_MAINTAINED_CLOSURE_RED",str(e))
          else:
              raise AssertionError("baseline RED not established")
          (out/"maintained-lock.json").write_text(json.dumps(maintained,indent=2)+"\n")
          for name in ("flake.lock",):
              (out/("baseline-"+name)).write_bytes((root/name).read_bytes())
          old="a18a6cddcbcf4d989495a5de8abcedc4d0294d1c"
          for name in ("flake.nix","qlfile"):
              p=root/name;s=p.read_text()
              assert s.count(old)==1,name
              p.write_text(s.replace(old,library))
          (out/"provenance.json").write_text(json.dumps(dict(baseline=baseline,workflow_head=git("rev-parse","HEAD"),library=library,authority=authority),indent=2)+"\n")
          
          PY
      - name: Generate complete maintained closure and native locks
        shell: bash
        env:
          QLOT_PATH: ${{ steps.qlot.outputs.path }}
        run: |
          set -euo pipefail
          python3 scripts/sync-starintel-schema.py --commit 96d26c338078676ec1dc6928755901636c9f7ef0
          nix flake update star-cl
          timeout 600 "$QLOT_PATH/bin/qlot" update star-cl --no-deps
      - name: Apply reviewed explicit legacy compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,re,subprocess,os
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-closure-evidence"
          tracked=subprocess.check_output(["git","ls-files","-z"],text=True).split("\0")
          scan=[]
          spec_paths=[]
          for name in tracked:
              if not name.endswith((".lisp",".asd",".nix")): continue
              p=root/name
              if not p.is_file(): continue
              content=p.read_text()
              hits=[{"line":i+1,"text":line} for i,line in enumerate(content.splitlines()) if re.search(r"(?i)(?<![\w.-])spec:|starintel:|(?:import-from|use|nicknames|find-package|read-from-string).*\b(?:spec|starintel)\b",line)]
              if hits:scan.append(dict(path=name,hits=hits))
              if re.search(r"(?i)(?<![\w.-])spec:",content):spec_paths.append(name)
          assert sorted(spec_paths)==sorted(["source/actor-systems/event-actor.lisp","source/actor-systems/matcher-actor.lisp","source/actor-systems/user-hunt.lisp","source/actor-systems/user-finder.lisp","t/http-api-test.lisp"]),spec_paths
          (out/"historical-api-scan.json").write_text(json.dumps(scan,indent=2)+"\n")
          print("HISTORICAL_API_SCAN "+json.dumps(scan))
          print("CLASSIFICATION: event/matcher are loaded; HTTP fixtures are legacy tests; user-hunt/user-finder are dormant and unchanged; canonical matcher is gated issue44.")
          changes=json.loads("[{\"path\":\"source/starintel-gserver.asd\",\"expected\":\"4da68cbfaecce58d23e64d1ae992cb1a76fabe19\",\"content\":\"(asdf:defsystem :starintel-gserver\\n  :version \\\"0.2.0\\\"\\n  :description \\\"Hackable StarIntel processing, authorization, and access server.\\\"\\n  :author \\\"nsaspy@airmail.cc\\\"\\n  :license \\\"GPL-3.0-or-later\\\"\\n  :serial t\\n  :build-operation program-op\\n  :build-pathname \\\"star-server\\\"\\n  :entry-point \\\"star::main\\\"\\n  :in-order-to ((test-op (test-op \\\"starintel-gserver-tests\\\")))\\n  :components\\n  ((:file \\\"ids\\\")\\n   (:file \\\"document-access-package\\\")\\n   (:file \\\"document-access\\\")\\n   (:file \\\"consumers/package\\\")\\n   (:file \\\"consumers/consumers\\\")\\n   (:file \\\"consumers/owner-fixes\\\")\\n   (:file \\\"consumers/retry-policy\\\")\\n   (:file \\\"consumers/startup-retry\\\")\\n   (:file \\\"producers/package\\\")\\n   (:file \\\"producers/producers\\\")\\n   (:file \\\"http-contract-package\\\" :pathname \\\"../cli/http-contract-package\\\")\\n   (:file \\\"http-contract\\\" :pathname \\\"../cli/http-contract\\\")\\n   (:file \\\"http-contract-final\\\" :pathname \\\"../cli/http-contract-final\\\")\\n   (:file \\\"http-contract-targets\\\" :pathname \\\"../cli/http-contract-targets\\\")\\n   (:file \\\"http-contract-actors\\\" :pathname \\\"../cli/http-contract-actors\\\")\\n   (:file \\\"http-contract-documents\\\" :pathname \\\"../cli/http-contract-documents\\\")\\n   (:file \\\"package\\\")\\n   (:file \\\"leases/package\\\")\\n   (:file \\\"leases/protocol\\\")\\n   (:file \\\"leases/memory-store\\\")\\n   (:file \\\"leases/valkey-scripts\\\")\\n   (:file \\\"leases/valkey-store\\\")\\n   (:file \\\"leases/valkey-list-store\\\")\\n   (:file \\\"gserver-settings\\\")\\n   (:file \\\"databases/couchdb\\\")\\n   (:file \\\"databases/view-request\\\")\\n   (:file \\\"databases/export\\\")\\n   (:file \\\"databases/outbox\\\")\\n   (:file \\\"databases/view-registry-package\\\")\\n   (:file \\\"databases/view-registry\\\")\\n   (:file \\\"databases/document-update-package\\\")\\n   (:file \\\"databases/document-update\\\")\\n   (:file \\\"databases/quarantine\\\")\\n   (:file \\\"databases/target-acceptance\\\")\\n   (:file \\\"auth/core\\\")\\n   (:file \\\"auth/verification-hardening\\\")\\n   (:file \\\"auth/immutability\\\")\\n   (:file \\\"auth/store\\\")\\n   (:file \\\"auth/users\\\")\\n   (:file \\\"auth/oauth-package\\\")\\n   (:file \\\"auth/oauth\\\")\\n   (:file \\\"auth/oauth-bearer\\\")\\n   (:file \\\"authorization/package\\\")\\n   (:file \\\"authorization/policy\\\")\\n   (:file \\\"authorization/quota-policy\\\")\\n   (:file \\\"authorization/services\\\")\\n   (:file \\\"addons\\\")\\n   (:file \\\"observability-gserver\\\")\\n   (:file \\\"observability-consumers\\\")\\n   (:file \\\"lease-store-runtime\\\")\\n   (:file \\\"init-loader\\\")\\n   (:file \\\"actors\\\")\\n   (:file \\\"actor-registry\\\")\\n   (:file \\\"actors/couchdb-service\\\")\\n   (:file \\\"target-repository\\\")\\n   (:file \\\"target-recovery\\\")\\n   (:file \\\"target-dispatch\\\")\\n   (:file \\\"target-dispatch-fixes\\\")\\n   (:file \\\"actor-systems/event-actor\\\")\\n   (:file \\\"actor-systems/matcher-actor\\\")\\n   (:file \\\"rabbit\\\")\\n   (:file \\\"frontends/http-api\\\")\\n   (:file \\\"couchdb-session-hardening\\\")\\n   (:file \\\"frontends/http-boundary-core\\\")\\n   (:file \\\"frontends/http-document-update\\\")\\n   (:file \\\"frontends/http-view-registry\\\")\\n   (:file \\\"frontends/http-status-message\\\")\\n   (:file \\\"frontends/http-capabilities\\\")\\n   (:file \\\"frontends/http-auth\\\")\\n   (:file \\\"frontends/http-oauth-provider\\\")\\n   (:file \\\"frontends/http-authorization\\\")\\n   (:file \\\"frontends/http-bulk-jobs\\\")\\n   (:file \\\"frontends/http-boundary-routes\\\")\\n   (:file \\\"frontends/http-target-v1\\\")\\n   (:file \\\"frontends/http-target-v1-auth\\\")\\n   (:file \\\"frontends/http-target-v1-route\\\")\\n   (:file \\\"frontends/http-auth-routes\\\")\\n   (:file \\\"frontends/http-auth-job-routes\\\")\\n   (:file \\\"frontends/http-authorization-routes\\\")\\n   (:file \\\"frontends/http-authorization-view-routes\\\")\\n   (:file \\\"frontends/http-contract-routes\\\")\\n   (:file \\\"frontends/http-actor-discovery\\\")\\n   (:file \\\"runtime-lifecycle\\\")\\n   (:file \\\"admin\\\")\\n   (:file \\\"admin-final\\\")\\n   (:file \\\"main\\\")\\n   (:file \\\"authorization/services-final\\\"))\\n  :depends-on\\n  (#:starintel-observability #:starintel #:starintel-legacy #:com.inuoe.jzon #:cl-couch #:serapeum #:alexandria\\n   #:cl-rabbit #:sento #:babel #:yason #:ironclad #:dexador #:quri #:uuid\\n   #:anypool #:clack #:lack/middleware/accesslog #:clack-handler-hunchentoot\\n   #:ningle #:clingon #:slynk #:nhooks #:lparallel #:cl-stream #:cl-ppcre\\n   #:cms-ulid #:bordeaux-threads #:usocket #:cl+ssl #:jsown #:closer-mop))\\n\\n;;;; StarIntel Gserver is a processing framework for StarIntel documents.\\n;;;; Runtime documentation lives in ../docs and must track behavior changes.\\n\"},{\"path\":\"cli/star-cli.asd\",\"expected\":\"fb959f7fb268de4bbc56095d337a77e70cfc5527\",\"content\":\"(asdf:defsystem :star-cli\\n  :version      \\\"0.2.0\\\"\\n  :description  \\\"Command-line client for StarIntel Gserver API\\\"\\n  :author       \\\"nsaspy@airmail.cc\\\"\\n  :license      \\\"GPL v3\\\"\\n  :serial       t\\n  :build-operation program-op\\n  :build-pathname \\\"star-cli\\\"\\n  :entry-point \\\"star-cli::main\\\"\\n  :components   ((:file \\\"star-cli\\\")\\n                 (:file \\\"star-cli-management\\\"))\\n  :depends-on   (#:starintel-gserver-client\\n                 #:starintel-legacy\\n                 #:clingon\\n                 #:jsown\\n                 #:quri))\\n\"},{\"path\":\"cli/star-cli.lisp\",\"expected\":\"c916c46e0c674d4b8511835d99e17f7f63d6cd0d\",\"content\":\"(in-package :cl-user)\\n\\n(defpackage :star-cli\\n  (:use :cl :star.api.client)\\n  (:import-from :starintel.legacy\\n                #:encode\\n                #:set-meta\\n                #:new-host\\n                #:new-url\\n                #:new-domain)\\n  (:export #:main))\\n\\n(in-package :star-cli)\\n\\n;;; BBP Import functions\\n(defun parse-bbp-file (filepath)\\n  \\\"Read a file and return a list of non-empty lines (removing comments and whitespace).\\\"\\n  (with-open-file (stream filepath :direction :input :if-does-not-exist nil)\\n    (unless stream\\n      (error \\\"File not found: ~a\\\" filepath))\\n    (loop for line = (read-line stream nil nil)\\n          while line\\n          for trimmed = (string-trim '(#\\\\Space #\\\\Tab #\\\\Return #\\\\Newline) line)\\n          unless (or (string= trimmed \\\"\\\")\\n                     (and (> (length trimmed) 0)\\n                          (char= (char trimmed 0) #\\\\#)))\\n            collect trimmed)))\\n\\n(defun parse-tags (tags-str)\\n  \\\"Parse comma-separated tags string into a list.\\\"\\n  (when tags-str\\n    (mapcar (lambda (s) (string-trim '(#\\\\Space #\\\\Tab #\\\\Return #\\\\Newline) s))\\n            (uiop:split-string tags-str :separator \\\",\\\"))))\\n\\n;;; ============================================================================\\n;;; Utilities\\n;;; ============================================================================\\n\\n(defun parse-json-file (filepath)\\n  \\\"Read and parse JSON from a file.\\\"\\n  (with-open-file (stream filepath :direction :input)\\n    (let ((content (make-string (file-length stream))))\\n      (read-sequence content stream)\\n      content)))\\n\\n(defun print-json-response (response)\\n  \\\"Pretty print JSON response.\\\"\\n  (format t \\\"~a~%\\\" response))\\n\\n(defun print-error (message)\\n  \\\"Print error message to stderr.\\\"\\n  (format *error-output* \\\"Error: ~a~%\\\" message))\\n\\n(defun print-success (message)\\n  \\\"Print success message.\\\"\\n  (format t \\\"✓ ~a~%\\\" message))\\n\\n;;; ============================================================================\\n;;; Global Options\\n;;; ============================================================================\\n\\n(defun global-options ()\\n  \\\"Define global options for all commands.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Base URL of the star-server API\\\"\\n    :short-name #\\\\u\\n    :long-name \\\"url\\\"\\n    :env-vars '(\\\"STAR_SERVER_URL\\\")\\n    :initial-value \\\"http://127.0.0.1:5000\\\"\\n    :key :base-url)\\n   (clingon:make-option\\n    :boolean\\n    :description \\\"Pretty print JSON output\\\"\\n    :long-name \\\"pretty\\\"\\n    :initial-value nil\\n    :key :pretty)))\\n\\n(defun make-client (cmd)\\n  \\\"Create a star-client from command options.\\\"\\n  (make-instance 'star-client\\n                 :base-url (clingon:getopt cmd :base-url)))\\n\\n;;; ============================================================================\\n;;; Document Commands\\n;;; ============================================================================\\n\\n(defun document/create-options ()\\n  \\\"Options for creating a document.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Document type (dtype)\\\"\\n    :short-name #\\\\t\\n    :long-name \\\"type\\\"\\n    :required t\\n    :key :dtype)\\n   (clingon:make-option\\n    :string\\n    :description \\\"Path to JSON file containing document data\\\"\\n    :short-name #\\\\f\\n    :long-name \\\"file\\\"\\n    :key :file)\\n   (clingon:make-option\\n    :string\\n    :description \\\"JSON string of document data (alternative to --file)\\\"\\n    :short-name #\\\\d\\n    :long-name \\\"data\\\"\\n    :key :data)))\\n\\n(defun document/create-handler (cmd)\\n  \\\"Handler for creating a document.\\\"\\n  (let* ((client (make-client cmd))\\n         (dtype (clingon:getopt cmd :dtype))\\n         (file (clingon:getopt cmd :file))\\n         (data (clingon:getopt cmd :data))\\n         (json-data (cond\\n                      (file (parse-json-file file))\\n                      (data data)\\n                      (t (progn\\n                           (print-error \\\"Either --file or --data must be provided\\\")\\n                           (clingon:exit 1))))))\\n    (handler-case\\n        (let ((response (submit-document client json-data dtype)))\\n          (print-json-response response)\\n          (print-success (format nil \\\"Document created with type '~a'\\\" dtype)))\\n      (error (e)\\n        (print-error (format nil \\\"Failed to create document: ~a\\\" e))\\n        (clingon:exit 1)))))\\n\\n(defun document/create-command ()\\n  \\\"Create document command.\\\"\\n  (clingon:make-command\\n   :name \\\"create\\\"\\n   :description \\\"Create a new document\\\"\\n   :options (document/create-options)\\n   :handler #'document/create-handler))\\n\\n(defun document/get-options ()\\n  \\\"Options for getting a document.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Document ID\\\"\\n    :short-name #\\\\i\\n    :long-name \\\"id\\\"\\n    :required t\\n    :key :doc-id)))\\n\\n(defun document/get-handler (cmd)\\n  \\\"Handler for getting a document.\\\"\\n  (let* ((client (make-client cmd))\\n         (doc-id (clingon:getopt cmd :doc-id)))\\n    (handler-case\\n        (let ((response (get-document client doc-id)))\\n          (print-json-response response))\\n      (error (e)\\n        (print-error (format nil \\\"Failed to get document: ~a\\\" e))\\n        (clingon:exit 1)))))\\n\\n(defun document/get-command ()\\n  \\\"Get document command.\\\"\\n  (clingon:make-command\\n   :name \\\"get\\\"\\n   :description \\\"Get a document by ID\\\"\\n   :options (document/get-options)\\n   :handler #'document/get-handler))\\n\\n(defun document/update-options ()\\n  \\\"Options for updating a document.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Document ID\\\"\\n    :short-name #\\\\i\\n    :long-name \\\"id\\\"\\n    :required t\\n    :key :doc-id)\\n   (clingon:make-option\\n    :string\\n    :description \\\"Path to JSON file containing updated document data\\\"\\n    :short-name #\\\\f\\n    :long-name \\\"file\\\"\\n    :key :file)\\n   (clingon:make-option\\n    :string\\n    :description \\\"JSON string of updated document data\\\"\\n    :short-name #\\\\d\\n    :long-name \\\"data\\\"\\n    :key :data)))\\n\\n(defun document/update-handler (cmd)\\n  \\\"Handler for updating a document.\\\"\\n  (let* ((client (make-client cmd))\\n         (doc-id (clingon:getopt cmd :doc-id))\\n         (file (clingon:getopt cmd :file))\\n         (data (clingon:getopt cmd :data))\\n         (json-data (cond\\n                      (file (parse-json-file file))\\n                      (data data)\\n                      (t (progn\\n                           (print-error \\\"Either --file or --data must be provided\\\")\\n                           (clingon:exit 1))))))\\n    (handler-case\\n        (let ((response (api-request client (format nil \\\"/document/~a\\\" doc-id)\\n                                     :method :put\\n                                     :content json-data)))\\n          (print-json-response response)\\n          (print-success (format nil \\\"Document '~a' updated\\\" doc-id)))\\n      (error (e)\\n        (print-error (format nil \\\"Failed to update document: ~a\\\" e))\\n        (clingon:exit 1)))))\\n\\n(defun document/update-command ()\\n  \\\"Update document command.\\\"\\n  (clingon:make-command\\n   :name \\\"update\\\"\\n   :description \\\"Update an existing document\\\"\\n   :options (document/update-options)\\n   :handler #'document/update-handler))\\n\\n(defun document/delete-options ()\\n  \\\"Options for deleting a document.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Document ID\\\"\\n    :short-name #\\\\i\\n    :long-name \\\"id\\\"\\n    :required t\\n    :key :doc-id)\\n   (clingon:make-option\\n    :boolean\\n    :description \\\"Force deletion without confirmation\\\"\\n    :short-name #\\\\f\\n    :long-name \\\"force\\\"\\n    :initial-value nil\\n    :key :force)))\\n\\n(defun document/delete-handler (cmd)\\n  \\\"Handler for deleting a document.\\\"\\n  (let* ((client (make-client cmd))\\n         (doc-id (clingon:getopt cmd :doc-id))\\n         (force (clingon:getopt cmd :force)))\\n    (unless force\\n      (format t \\\"Are you sure you want to delete document '~a'? (yes/no): \\\" doc-id)\\n      (force-output)\\n      (let ((confirmation (string-downcase (read-line))))\\n        (unless (member confirmation '(\\\"yes\\\" \\\"y\\\") :test #'string=)\\n          (format t \\\"Deletion cancelled.~%\\\")\\n          (clingon:exit 0))))\\n    (handler-case\\n        (let ((response (api-request client (format nil \\\"/document/~a\\\" doc-id)\\n                                     :method :delete)))\\n          (print-json-response response)\\n          (print-success (format nil \\\"Document '~a' deleted\\\" doc-id)))\\n      (error (e)\\n        (print-error (format nil \\\"Failed to delete document: ~a\\\" e))\\n        (clingon:exit 1)))))\\n\\n(defun document/delete-command ()\\n  \\\"Delete document command.\\\"\\n  (clingon:make-command\\n   :name \\\"delete\\\"\\n   :description \\\"Delete a document\\\"\\n   :options (document/delete-options)\\n   :handler #'document/delete-handler))\\n\\n(defun document/search-options ()\\n  \\\"Options for searching documents.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Search query string\\\"\\n    :short-name #\\\\q\\n    :long-name \\\"query\\\"\\n    :required t\\n    :key :query)\\n   (clingon:make-option\\n    :integer\\n    :description \\\"Maximum number of results\\\"\\n    :short-name #\\\\l\\n    :long-name \\\"limit\\\"\\n    :initial-value 25\\n    :key :limit)\\n   (clingon:make-option\\n    :string\\n    :description \\\"Bookmark for pagination\\\"\\n    :short-name #\\\\b\\n    :long-name \\\"bookmark\\\"\\n    :key :bookmark)\\n   (clingon:make-option\\n    :string\\n    :description \\\"Sort field\\\"\\n    :short-name #\\\\s\\n    :long-name \\\"sort\\\"\\n    :key :sort)))\\n\\n(defun document/search-handler (cmd)\\n  \\\"Handler for searching documents.\\\"\\n  (let* ((client (make-client cmd))\\n         (query (clingon:getopt cmd :query))\\n         (limit (clingon:getopt cmd :limit))\\n         (bookmark (clingon:getopt cmd :bookmark))\\n         (sort (clingon:getopt cmd :sort)))\\n    (handler-case\\n        (let ((response (fts client :q query :limit limit :bookmark bookmark :sort sort)))\\n          (print-json-response response))\\n      (error (e)\\n        (print-error (format nil \\\"Search failed: ~a\\\" e))\\n        (clingon:exit 1)))))\\n\\n(defun document/search-command ()\\n  \\\"Search documents command.\\\"\\n  (clingon:make-command\\n   :name \\\"search\\\"\\n   :description \\\"Search documents using full-text search\\\"\\n   :options (document/search-options)\\n   :handler #'document/search-handler))\\n\\n(defun document/handler (cmd)\\n  \\\"Handler for document command group.\\\"\\n  (clingon:print-usage-and-exit cmd t))\\n\\n(defun document/command ()\\n  \\\"Document command group.\\\"\\n  (clingon:make-command\\n   :name \\\"document\\\"\\n   :description \\\"Manage documents\\\"\\n   :authors '(\\\"nsaspy <nsaspy@airmail.cc>\\\")\\n   :license \\\"GPL v3\\\"\\n   :handler #'document/handler\\n   :sub-commands (list\\n                  (document/create-command)\\n                  (document/get-command)\\n                  (document/update-command)\\n                  (document/delete-command)\\n                  (document/search-command))))\\n\\n;;; ============================================================================\\n;;; Target Commands\\n;;; ============================================================================\\n\\n(defun target/create-options ()\\n  \\\"Options for creating a target.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Actor name/ID\\\"\\n    :short-name #\\\\a\\n    :long-name \\\"actor\\\"\\n    :required t\\n    :key :actor)\\n   (clingon:make-option\\n    :string\\n    :description \\\"Path to JSON file containing target data\\\"\\n    :short-name #\\\\f\\n    :long-name \\\"file\\\"\\n    :key :file)\\n   (clingon:make-option\\n    :string\\n    :description \\\"JSON string of target data (alternative to --file)\\\"\\n    :short-name #\\\\d\\n    :long-name \\\"data\\\"\\n    :key :data)\\n   (clingon:make-option\\n    :boolean\\n    :description \\\"Mark target as transient (non-persistent)\\\"\\n    :long-name \\\"transient\\\"\\n    :initial-value nil\\n    :key :transient)))\\n\\n(defun target/create-handler (cmd)\\n  \\\"Handler for creating a target.\\\"\\n  (let* ((client (make-client cmd))\\n         (actor (clingon:getopt cmd :actor))\\n         (file (clingon:getopt cmd :file))\\n         (data (clingon:getopt cmd :data))\\n         (transient (clingon:getopt cmd :transient))\\n         (json-data (cond\\n                      (file (parse-json-file file))\\n                      (data data)\\n                      (t (progn\\n                           (print-error \\\"Either --file or --data must be provided\\\")\\n                           (clingon:exit 1))))))\\n    (handler-case\\n        (let ((response (new-target client json-data actor transient)))\\n          (print-json-response response)\\n          (print-success (format nil \\\"Target created for actor '~a'\\\" actor)))\\n      (error (e)\\n        (print-error (format nil \\\"Failed to create target: ~a\\\" e))\\n        (clingon:exit 1)))))\\n\\n(defun target/create-command ()\\n  \\\"Create target command.\\\"\\n  (clingon:make-command\\n   :name \\\"create\\\"\\n   :description \\\"Create a new target for an actor\\\"\\n   :options (target/create-options)\\n   :handler #'target/create-handler))\\n\\n(defun target/list-options ()\\n  \\\"Options for listing targets.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Actor name/ID to list targets for\\\"\\n    :short-name #\\\\a\\n    :long-name \\\"actor\\\"\\n    :required t\\n    :key :actor)))\\n\\n(defun target/list-handler (cmd)\\n  \\\"Handler for listing targets.\\\"\\n  (let* ((client (make-client cmd))\\n         (actor (clingon:getopt cmd :actor)))\\n    (handler-case\\n        (let ((response (get-targets client actor)))\\n          (print-json-response response))\\n      (error (e)\\n        (print-error (format nil \\\"Failed to list targets: ~a\\\" e))\\n        (clingon:exit 1)))))\\n\\n(defun target/list-command ()\\n  \\\"List targets command.\\\"\\n  (clingon:make-command\\n   :name \\\"list\\\"\\n   :description \\\"List all targets for an actor\\\"\\n   :options (target/list-options)\\n   :handler #'target/list-handler))\\n\\n(defun target/get-options ()\\n  \\\"Options for getting a target.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Target ID\\\"\\n    :short-name #\\\\i\\n    :long-name \\\"id\\\"\\n    :required t\\n    :key :target-id)))\\n\\n(defun target/get-handler (cmd)\\n  \\\"Handler for getting a target.\\\"\\n  (let* ((client (make-client cmd))\\n         (target-id (clingon:getopt cmd :target-id)))\\n    (handler-case\\n        (let ((response (get-document client target-id)))\\n          (print-json-response response))\\n      (error (e)\\n        (print-error (format nil \\\"Failed to get target: ~a\\\" e))\\n        (clingon:exit 1)))))\\n\\n(defun target/get-command ()\\n  \\\"Get target command.\\\"\\n  (clingon:make-command\\n   :name \\\"get\\\"\\n   :description \\\"Get a target by ID\\\"\\n   :options (target/get-options)\\n   :handler #'target/get-handler))\\n\\n(defun target/update-options ()\\n  \\\"Options for updating a target.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Target ID\\\"\\n    :short-name #\\\\i\\n    :long-name \\\"id\\\"\\n    :required t\\n    :key :target-id)\\n   (clingon:make-option\\n    :string\\n    :description \\\"Path to JSON file containing updated target data\\\"\\n    :short-name #\\\\f\\n    :long-name \\\"file\\\"\\n    :key :file)\\n   (clingon:make-option\\n    :string\\n    :description \\\"JSON string of updated target data\\\"\\n    :short-name #\\\\d\\n    :long-name \\\"data\\\"\\n    :key :data)))\\n\\n(defun target/update-handler (cmd)\\n  \\\"Handler for updating a target.\\\"\\n  (let* ((client (make-client cmd))\\n         (target-id (clingon:getopt cmd :target-id))\\n         (file (clingon:getopt cmd :file))\\n         (data (clingon:getopt cmd :data))\\n         (json-data (cond\\n                      (file (parse-json-file file))\\n                      (data data)\\n                      (t (progn\\n                           (print-error \\\"Either --file or --data must be provided\\\")\\n                           (clingon:exit 1))))))\\n    (handler-case\\n        (let ((response (api-request client (format nil \\\"/document/~a\\\" target-id)\\n                                     :method :put\\n                                     :content json-data)))\\n          (print-json-response response)\\n          (print-success (format nil \\\"Target '~a' updated\\\" target-id)))\\n      (error (e)\\n        (print-error (format nil \\\"Failed to update target: ~a\\\" e))\\n        (clingon:exit 1)))))\\n\\n(defun target/update-command ()\\n  \\\"Update target command.\\\"\\n  (clingon:make-command\\n   :name \\\"update\\\"\\n   :description \\\"Update an existing target\\\"\\n   :options (target/update-options)\\n   :handler #'target/update-handler))\\n\\n(defun target/delete-options ()\\n  \\\"Options for deleting a target.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Target ID\\\"\\n    :short-name #\\\\i\\n    :long-name \\\"id\\\"\\n    :required t\\n    :key :target-id)\\n   (clingon:make-option\\n    :boolean\\n    :description \\\"Force deletion without confirmation\\\"\\n    :short-name #\\\\f\\n    :long-name \\\"force\\\"\\n    :initial-value nil\\n    :key :force)))\\n\\n(defun target/delete-handler (cmd)\\n  \\\"Handler for deleting a target.\\\"\\n  (let* ((client (make-client cmd))\\n         (target-id (clingon:getopt cmd :target-id))\\n         (force (clingon:getopt cmd :force)))\\n    (unless force\\n      (format t \\\"Are you sure you want to delete target '~a'? (yes/no): \\\" target-id)\\n      (force-output)\\n      (let ((confirmation (string-downcase (read-line))))\\n        (unless (member confirmation '(\\\"yes\\\" \\\"y\\\") :test #'string=)\\n          (format t \\\"Deletion cancelled.~%\\\")\\n          (clingon:exit 0))))\\n    (handler-case\\n        (let ((response (api-request client (format nil \\\"/document/~a\\\" target-id)\\n                                     :method :delete)))\\n          (print-json-response response)\\n          (print-success (format nil \\\"Target '~a' deleted\\\" target-id)))\\n      (error (e)\\n        (print-error (format nil \\\"Failed to delete target: ~a\\\" e))\\n        (clingon:exit 1)))))\\n\\n(defun target/delete-command ()\\n  \\\"Delete target command.\\\"\\n  (clingon:make-command\\n   :name \\\"delete\\\"\\n   :description \\\"Delete a target\\\"\\n   :options (target/delete-options)\\n   :handler #'target/delete-handler))\\n\\n(defun target/handler (cmd)\\n  \\\"Handler for target command group.\\\"\\n  (clingon:print-usage-and-exit cmd t))\\n\\n(defun target/command ()\\n  \\\"Target command group.\\\"\\n  (clingon:make-command\\n   :name \\\"target\\\"\\n   :description \\\"Manage targets\\\"\\n   :authors '(\\\"nsaspy <nsaspy@airmail.cc>\\\")\\n   :license \\\"GPL v3\\\"\\n   :handler #'target/handler\\n   :sub-commands (list\\n                  (target/create-command)\\n                  (target/list-command)\\n                  (target/get-command)\\n                  (target/update-command)\\n                  (target/delete-command))))\\n\\n;;; ============================================================================\\n;;; Query Commands\\n;;; ============================================================================\\n\\n(defun query/messages-by-user-options ()\\n  \\\"Options for querying messages by user.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Username to query\\\"\\n    :short-name #\\\\u\\n    :long-name \\\"user\\\"\\n    :required t\\n    :key :user)\\n   (clingon:make-option\\n    :integer\\n    :description \\\"Maximum number of results\\\"\\n    :short-name #\\\\l\\n    :long-name \\\"limit\\\"\\n    :initial-value 50\\n    :key :limit)\\n   (clingon:make-option\\n    :boolean\\n    :description \\\"Return results in descending order\\\"\\n    :long-name \\\"descending\\\"\\n    :initial-value nil\\n    :key :descending)))\\n\\n(defun query/messages-by-user-handler (cmd)\\n  \\\"Handler for querying messages by user.\\\"\\n  (let* ((client (make-client cmd))\\n         (user (clingon:getopt cmd :user))\\n         (limit (clingon:getopt cmd :limit))\\n         (descending (clingon:getopt cmd :descending)))\\n    (handler-case\\n        (let ((response (messages-by-user client :user user :limit limit :descending descending)))\\n          (print-json-response response))\\n      (error (e)\\n        (print-error (format nil \\\"Query failed: ~a\\\" e))\\n        (clingon:exit 1)))))\\n\\n(defun query/messages-by-user-command ()\\n  \\\"Query messages by user command.\\\"\\n  (clingon:make-command\\n   :name \\\"messages-by-user\\\"\\n   :description \\\"Query messages by username\\\"\\n   :options (query/messages-by-user-options)\\n   :handler #'query/messages-by-user-handler))\\n\\n(defun query/messages-by-platform-options ()\\n  \\\"Options for querying messages by platform.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Platform to query (e.g., discord, telegram)\\\"\\n    :short-name #\\\\p\\n    :long-name \\\"platform\\\"\\n    :required t\\n    :key :platform)\\n   (clingon:make-option\\n    :integer\\n    :description \\\"Maximum number of results\\\"\\n    :short-name #\\\\l\\n    :long-name \\\"limit\\\"\\n    :initial-value 50\\n    :key :limit)\\n   (clingon:make-option\\n    :boolean\\n    :description \\\"Return results in descending order\\\"\\n    :long-name \\\"descending\\\"\\n    :initial-value nil\\n    :key :descending)))\\n\\n(defun query/messages-by-platform-handler (cmd)\\n  \\\"Handler for querying messages by platform.\\\"\\n  (let* ((client (make-client cmd))\\n         (platform (clingon:getopt cmd :platform))\\n         (limit (clingon:getopt cmd :limit))\\n         (descending (clingon:getopt cmd :descending)))\\n    (handler-case\\n        (let ((response (messages-by-platform client :platform platform :limit limit :descending descending)))\\n          (print-json-response response))\\n      (error (e)\\n        (print-error (format nil \\\"Query failed: ~a\\\" e))\\n        (clingon:exit 1)))))\\n\\n(defun query/messages-by-platform-command ()\\n  \\\"Query messages by platform command.\\\"\\n  (clingon:make-command\\n   :name \\\"messages-by-platform\\\"\\n   :description \\\"Query messages by platform\\\"\\n   :options (query/messages-by-platform-options)\\n   :handler #'query/messages-by-platform-handler))\\n\\n(defun query/handler (cmd)\\n  \\\"Handler for query command group.\\\"\\n  (clingon:print-usage-and-exit cmd t))\\n\\n(defun query/command ()\\n  \\\"Query command group.\\\"\\n  (clingon:make-command\\n   :name \\\"query\\\"\\n   :description \\\"Query documents with various filters\\\"\\n   :authors '(\\\"nsaspy <nsaspy@airmail.cc>\\\")\\n   :license \\\"GPL v3\\\"\\n   :handler #'query/handler\\n   :sub-commands (list\\n                  (query/messages-by-user-command)\\n                  (query/messages-by-platform-command))))\\n\\n;;; ============================================================================\\n;;; Bulk Commands\\n;;; ============================================================================\\n\\n(defun bulk/import-options ()\\n  \\\"Options for bulk importing documents.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Path to file containing documents (NDJSON by default, use --format for array)\\\"\\n    :short-name #\\\\f\\n    :long-name \\\"file\\\"\\n    :required t\\n    :key :file)\\n   (clingon:make-option\\n    :integer\\n    :description \\\"Maximum documents per batch (default: 500)\\\"\\n    :short-name #\\\\b\\n    :long-name \\\"batch-size\\\"\\n    :initial-value 500\\n    :key :batch-size)\\n   (clingon:make-option\\n    :string\\n    :description \\\"Input format: 'ndjson' (newline-delimited JSON) or 'array' (JSON array)\\\"\\n    :long-name \\\"format\\\"\\n    :initial-value \\\"ndjson\\\"\\n    :key :format)\\n   (clingon:make-option\\n    :boolean\\n    :description \\\"Suppress verbose output\\\"\\n    :short-name #\\\\q\\n    :long-name \\\"quiet\\\"\\n    :initial-value nil\\n    :key :quiet)))\\n\\n(defun read-ndjson-file (file)\\n  \\\"Read NDJSON file and return a list of parsed JSON objects.\\\"\\n  (with-open-file (stream file :direction :input)\\n    (loop for line = (read-line stream nil nil)\\n          while line\\n          for trimmed = (string-trim '(#\\\\Space #\\\\Tab #\\\\Return #\\\\Newline) line)\\n          unless (string= trimmed \\\"\\\")\\n            collect (jsown:parse trimmed))))\\n\\n(defun read-json-array-file (file)\\n  \\\"Read a JSON array file and return a list of parsed JSON objects.\\\"\\n  (with-open-file (stream file :direction :input)\\n    (let ((content (make-string (file-length stream))))\\n      (read-sequence content stream)\\n      (jsown:parse content))))\\n\\n(defun bulk/import-handler (cmd)\\n  \\\"Handler for bulk importing documents.\\\"\\n  (let* ((client (make-client cmd))\\n         (file (clingon:getopt cmd :file))\\n         (batch-size (clingon:getopt cmd :batch-size))\\n         (format (string-downcase (clingon:getopt cmd :format)))\\n         (verbose (not (clingon:getopt cmd :quiet))))\\n\\n    (unless (probe-file file)\\n      (print-error (format nil \\\"File not found: ~a\\\" file))\\n      (clingon:exit 1))\\n\\n    (unless (member format '(\\\"ndjson\\\" \\\"array\\\") :test #'string=)\\n      (print-error (format nil \\\"Invalid format '~a'. Must be 'ndjson' or 'array'\\\" format))\\n      (clingon:exit 1))\\n\\n    (handler-case\\n        (let* ((documents (if (string= format \\\"ndjson\\\")\\n                              (read-ndjson-file file)\\n                              (read-json-array-file file))))\\n\\n          (unless (listp documents)\\n            (print-error \\\"File must contain a JSON array of documents\\\")\\n            (clingon:exit 1))\\n\\n          (let ((total-count (length documents))\\n                (total-success 0)\\n                (total-failed 0))\\n\\n            (when verbose\\n              (format t \\\"Found ~a documents to import (format: ~a)~%\\\" total-count format))\\n\\n            (loop for batch-start from 0 below total-count by batch-size\\n                  for batch-num from 1\\n                  do (let* ((batch-end (min (+ batch-start batch-size) total-count))\\n                            (batch (subseq documents batch-start batch-end)))\\n                       (when verbose\\n                         (format t \\\"~%Submitting batch ~a (~a documents)...~%\\\"\\n                                 batch-num (length batch)))\\n                       (handler-case\\n                           (let* ((response (bulk-submit client batch))\\n                                  (result (jsown:parse response))\\n                                  (succeeded (jsown:val result \\\"succeeded\\\"))\\n                                  (failed (jsown:val result \\\"failed\\\")))\\n                             (incf total-success succeeded)\\n                             (incf total-failed failed)\\n                             (when verbose\\n                               (format t \\\"Batch ~a: ~a succeeded, ~a failed~%\\\"\\n                                       batch-num succeeded failed))\\n                             (when (and (jsown:keyp result \\\"errors\\\") verbose)\\n                               (loop for error in (jsown:val result \\\"errors\\\")\\n                                     do (format *error-output* \\\"  Error at index ~a: ~a~%\\\"\\n                                                (jsown:val error \\\"index\\\")\\n                                                (jsown:val error \\\"error\\\")))))\\n                         (error (e)\\n                           (incf total-failed (length batch))\\n                           (when verbose\\n                             (format *error-output* \\\"Batch ~a failed: ~a~%\\\" batch-num e))))))\\n\\n            (format t \\\"~%Bulk import complete: ~a succeeded, ~a failed~%\\\"\\n                    total-success total-failed)\\n            (if (> total-failed 0)\\n                (clingon:exit 1)\\n                (clingon:exit 0))))\\n      (error (e)\\n        (print-error (format nil \\\"Failed to process file: ~a\\\" e))\\n        (clingon:exit 1)))))\\n\\n(defun bulk/import-command ()\\n  \\\"Bulk import command.\\\"\\n  (clingon:make-command\\n   :name \\\"import\\\"\\n   :description \\\"Import multiple documents from NDJSON or JSON array file\\\"\\n   :options (bulk/import-options)\\n   :handler #'bulk/import-handler))\\n\\n(defun bulk/handler (cmd)\\n  \\\"Handler for bulk command group.\\\"\\n  (clingon:print-usage-and-exit cmd t))\\n\\n(defun bulk/command ()\\n  \\\"Bulk command group.\\\"\\n  (clingon:make-command\\n   :name \\\"bulk\\\"\\n   :description \\\"Bulk document operations\\\"\\n   :authors '(\\\"nsaspy <nsaspy@airmail.cc>\\\")\\n   :license \\\"GPL v3\\\"\\n   :handler #'bulk/handler\\n   :sub-commands (list\\n                  (bulk/import-command))))\\n\\n;;; ============================================================================\\n;;; BBP Commands\\n;;; ============================================================================\\n\\n(defun bbp/import-options ()\\n  \\\"Options for importing BBP data.\\\"\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Type of data to import (host, url, domain)\\\"\\n    :short-name #\\\\t\\n    :long-name \\\"type\\\"\\n    :required t\\n    :key :type)\\n   (clingon:make-option\\n    :string\\n    :description \\\"The Source of the data. eg nmap, subfinder.\\\"\\n    :required nil\\n    :short-name #\\\\s\\n    :long-name \\\"source\\\"\\n    :key :source)\\n   (clingon:make-option\\n    :string\\n    :description \\\"Path to file containing data (one entry per line)\\\"\\n    :short-name #\\\\f\\n    :long-name \\\"file\\\"\\n    :required t\\n    :key :file)\\n   (clingon:make-option\\n    :string\\n    :description \\\"Dataset name (e.g., bug bounty program name)\\\"\\n    :short-name #\\\\d\\n    :long-name \\\"dataset\\\"\\n    :required t\\n    :key :dataset\\n    :env-vars '(\\\"HACKMODE_OPERATION\\\"))\\n   (clingon:make-option\\n    :boolean\\n    :description \\\"Suppress verbose output\\\"\\n    :short-name #\\\\q\\n    :long-name \\\"quiet\\\"\\n    :initial-value nil\\n    :key :quiet)))\\n\\n(defun make-host-document (hostname dataset)\\n  \\\"Create a host document using the spec package.\\\"\\n  (encode (set-meta  (new-host dataset :hostname hostname) dataset)))\\n\\n(defun make-url-document (url dataset)\\n  \\\"Create a URL document using the spec package.\\\"\\n  (encode (set-meta (new-url dataset :url url) dataset)))\\n\\n(defun make-domain-document (domain dataset)\\n  \\\"Create a domain document using the spec package.\\\"\\n  (encode (set-meta  (new-domain dataset :record domain) dataset)))\\n\\n(defun bbp/import-handler (cmd)\\n  \\\"Handler for importing BBP data.\\\"\\n  (let* ((client (make-client cmd))\\n         (type (string-downcase (clingon:getopt cmd :type)))\\n         (file (clingon:getopt cmd :file))\\n         (dataset (clingon:getopt cmd :dataset))\\n         (verbose (not (clingon:getopt cmd :quiet)))\\n         (entries (parse-bbp-file file))\\n         (success-count 0)\\n         (error-count 0))\\n\\n    (unless (member type '(\\\"host\\\" \\\"url\\\" \\\"domain\\\") :test #'string=)\\n      (print-error (format nil \\\"Invalid type '~a'. Must be host, url, or domain\\\" type))\\n      (clingon:exit 1))\\n\\n    (dolist (entry entries)\\n      (handler-case\\n          (let ((doc (cond\\n                       ((string= type \\\"host\\\")\\n                        (make-host-document entry dataset))\\n                       ((string= type \\\"url\\\")\\n                        (make-url-document entry dataset))\\n                       ((string= type \\\"domain\\\")\\n                        (make-domain-document entry dataset)))))\\n            (submit-document client (jsown:to-json doc) type)\\n            (incf success-count)\\n            (when verbose\\n              (format t \\\"✓ Imported ~a: ~a~%\\\" type entry)))\\n        (error (e)\\n          (incf error-count)\\n          (when verbose\\n            (format *error-output* \\\"✗ Failed to import ~a ~a: ~a~%\\\" type entry e)))))\\n\\n    (format t \\\"~%Import complete: ~a succeeded, ~a failed~%\\\" success-count error-count)\\n    (if (> error-count 0)\\n        (clingon:exit 1)\\n        (clingon:exit 0))))\\n\\n(defun bbp/import-command ()\\n  \\\"Import BBP data command.\\\"\\n  (clingon:make-command\\n   :name \\\"import\\\"\\n   :description \\\"Import BBP data (hosts, URLs, domains) from file\\\"\\n   :options (bbp/import-options)\\n   :handler #'bbp/import-handler))\\n\\n(defun bbp/handler (cmd)\\n  \\\"Handler for BBP command group.\\\"\\n  (clingon:print-usage-and-exit cmd t))\\n\\n(defun bbp/command ()\\n  \\\"BBP command group.\\\"\\n  (clingon:make-command\\n   :name \\\"bbp\\\"\\n   :description \\\"Bug Bounty Program data management\\\"\\n   :authors '(\\\"nsaspy <nsaspy@airmail.cc>\\\")\\n   :license \\\"GPL v3\\\"\\n   :handler #'bbp/handler\\n   :sub-commands (list\\n                  (bbp/import-command))))\\n\\n;;; ============================================================================\\n;;; Document Creation\\n;;; ============================================================================\\n\\n\\n\\n(defun kebab-case (sym-or-str)\\n  \\\"Convert symbol/string into lowercase kebab-case string.\\\"\\n  (let* ((s (etypecase sym-or-str\\n              (symbol (string-downcase (symbol-name sym-or-str)))\\n              (string (string-downcase sym-or-str)))))\\n    (substitute #\\\\- #\\\\_ s)))\\n\\n(defun parse-comma-list (s)\\n  \\\"Parse comma-separated string into a list of trimmed, non-empty strings.\\\"\\n  (when s\\n    (remove-if (lambda (x) (or (null x) (string= x \\\"\\\")))\\n               (mapcar (lambda (x) (string-trim '(#\\\\Space #\\\\Tab #\\\\Return #\\\\Newline) x))\\n                       (uiop:split-string s :separator \\\",\\\")))))\\n\\n(defun ensure-list (x) (if (listp x) x (list x)))\\n\\n(defun plist-put (plist key value)\\n  \\\"Functional plist set.\\\"\\n  (let ((pos (position key plist :test #'eq)))\\n    (if pos\\n        (let ((out (copy-list plist)))\\n          (setf (nth (1+ pos) out) value)\\n          out)\\n        (list* key value plist))))\\n\\n(defun maybe-parse-integer (x)\\n  (cond\\n    ((integerp x) x)\\n    ((stringp x)\\n     (handler-case (parse-integer x)\\n       (error () x)))\\n    (t x)))\\n\\n(defun gen/print-one-json (x)\\n  (cond\\n    ((null x) nil)\\n    ((stringp x) (format t \\\"~a~%\\\" x))\\n    (t (format t \\\"~a~%\\\" (jsown:to-json x)))))\\n\\n(defun gen/jsown-structure-p (value)\\n  (and (consp value)\\n       (member (first value) '(:obj :arr :array) :test #'eq)))\\n\\n(defun gen/print-documents (docs)\\n  (cond\\n    ((gen/jsown-structure-p docs)\\n     (gen/print-one-json docs))\\n    ((listp docs)\\n     (dolist (d docs)\\n       (gen/print-one-json d)))\\n    (t\\n     (gen/print-one-json docs))))\\n\\n(defun gen/ensure-finalized-class (class-or-symbol)\\n  \\\"Return a finalized class object (SBCL requires finalization for CLASS-SLOTS).\\\"\\n  (let ((class (etypecase class-or-symbol\\n                 (symbol (find-class class-or-symbol))\\n                 (class class-or-symbol))))\\n    (unless (sb-mop:class-finalized-p class)\\n      (sb-mop:finalize-inheritance class))\\n    class))\\n\\n;;; ---------------------------------------------------------------------------\\n;;; Registry: dtype -> class\\n;;; ---------------------------------------------------------------------------\\n\\n(defparameter *gen-dtype-registry* (make-hash-table :test 'equal))\\n(defparameter *gen-dtype-order* '()) ; deterministic ordering\\n\\n(defmacro define-gen-dtype (dtype class-symbol)\\n  \\\"Register a dtype string to a CLOS class symbol.\\\"\\n  `(progn\\n     (setf (gethash (string-downcase ,dtype) *gen-dtype-registry*) ',class-symbol)\\n     (pushnew (string-downcase ,dtype) *gen-dtype-order* :test #'string=)\\n     ',class-symbol))\\n\\n(defun gen/class-for-dtype (dtype)\\n  (or (gethash (string-downcase dtype) *gen-dtype-registry*)\\n      (error \\\"Unknown dtype '~a'. Register with (define-gen-dtype ...).\\\" dtype)))\\n\\n;;; ---------------------------------------------------------------------------\\n;;; Slots to hide from CLI (base/meta fields)\\n;;; ---------------------------------------------------------------------------\\n\\n(defparameter *gen-excluded-slot-names*\\n  ;; compare by symbol-name (case-insensitive) to avoid package headaches\\n  '(\\\"_ID\\\" \\\"_REV\\\" \\\"DTYPE\\\" \\\"DATASET\\\" \\\"DATE-ADDED\\\" \\\"DATE-UPDATED\\\" \\\"VERSION\\\" \\\"SOURCES\\\"))\\n\\n(defun gen/slot-allowed-p (slot-name-symbol)\\n  (let ((n (string-upcase (symbol-name slot-name-symbol))))\\n    (not (member n *gen-excluded-slot-names* :test #'string=))))\\n\\n(defun gen/slot-initarg (slotd)\\n  (first (sb-mop:slot-definition-initargs slotd)))\\n\\n(defun gen/slot-default (slotd)\\n  (ignore-errors (sb-mop:slot-definition-initform slotd)))\\n\\n(defun gen/slot-type (slotd)\\n  (ignore-errors (sb-mop:slot-definition-type slotd)))\\n\\n(defun gen/list-of-integers-type-p (stype)\\n  (and (consp stype)\\n       (eq (first stype) 'list)\\n       (member 'integer (rest stype) :test #'eq)))\\n\\n(defun gen/infer-option-type (slotd)\\n  \\\"Infer a clingon option type from slot type/initform (best-effort).\\\"\\n  (let ((stype (gen/slot-type slotd))\\n        (initf (gen/slot-default slotd)))\\n    (cond\\n      ((or (eq stype 'boolean) (typep initf 'boolean)) :boolean)\\n      ((or (eq stype 'integer) (typep initf 'integer)) :integer)\\n      (t :string))))\\n\\n;;; ---------------------------------------------------------------------------\\n;;; Common gen options\\n;;; ---------------------------------------------------------------------------\\n\\n(defun gen/common-options ()\\n  (list\\n   (clingon:make-option\\n    :string\\n    :description \\\"Dataset name\\\"\\n    :short-name #\\\\d\\n    :long-name \\\"dataset\\\"\\n    :env-vars '(\\\"HACKMODE_OPERATION\\\" \\\"STAR_DATASET\\\")\\n    :initial-value \\\"default\\\"\\n    :key :dataset)))\\n\\n\\n;;; ---------------------------------------------------------------------------\\n;;; Build clingon options dynamically from class slots\\n;;; ---------------------------------------------------------------------------\\n\\n(defun gen/make-slot-option (slotd)\\n  (let* ((slot-name (sb-mop:slot-definition-name slotd))\\n         (initarg   (gen/slot-initarg slotd)))\\n    (when (and initarg (gen/slot-allowed-p slot-name))\\n      (let* ((otype (gen/infer-option-type slotd))\\n             (lname (kebab-case slot-name)))\\n        ;; DO NOT set initial values from initforms; let the class defaults apply.\\n        (clingon:make-option\\n         otype\\n         :description (format nil \\\"Set ~a\\\" slot-name)\\n         :long-name lname\\n         :key initarg\\n         :initial-value (if (eq otype :boolean) nil nil))))))\\n\\n(defun gen/options-for-class (class-symbol)\\n  (let* ((class (gen/ensure-finalized-class class-symbol))\\n         (slots (sb-mop:class-slots class)))\\n    (remove nil (mapcar #'gen/make-slot-option slots))))\\n\\n;;; ---------------------------------------------------------------------------\\n;;; Multi-doc emission support (comma list -> N docs)\\n;;;   Map dtype -> slot-name (string) whose value can be \\\"a,b,c\\\" => emit 3 docs.\\n;;; ---------------------------------------------------------------------------\\n\\n(defparameter *gen-multi-slot-by-dtype*\\n  ;; dtype -> slot-name-string (case-insensitive match vs slot-definition-name)\\n  '((\\\"target\\\" . \\\"TARGET\\\")))\\n\\n(defun gen/find-slotd-by-name (class slot-name-upcase)\\n  (find slot-name-upcase\\n        (sb-mop:class-slots class)\\n        :key (lambda (sd) (string-upcase (symbol-name (sb-mop:slot-definition-name sd))))\\n        :test #'string=))\\n\\n(defun gen/multi-slot-name (dtype)\\n  (cdr (assoc (string-downcase dtype) *gen-multi-slot-by-dtype* :test #'string=)))\\n\\n;;; ---------------------------------------------------------------------------\\n;;; Build initargs from CLI + make/encode instances\\n;;; ---------------------------------------------------------------------------\\n\\n(defun gen/build-initargs (cmd class-symbol)\\n  \\\"Collect initargs for CLASS-SYMBOL from CLI values. Only include non-NIL values.\\\"\\n  (let* ((class (gen/ensure-finalized-class class-symbol))\\n         (slots (sb-mop:class-slots class))\\n         (initargs '()))\\n    (dolist (slotd slots initargs)\\n      (let* ((slot-name (sb-mop:slot-definition-name slotd))\\n             (initarg   (gen/slot-initarg slotd)))\\n        (when (and initarg (gen/slot-allowed-p slot-name))\\n          (let ((val (clingon:getopt cmd initarg)))\\n            (when (not (null val))\\n              (let* ((stype (gen/slot-type slotd))\\n                     (parsed\\n                       (cond\\n                         ;; list slot: allow comma parsing\\n                         ((or (eq stype 'list) (and (consp stype) (eq (first stype) 'list)))\\n                          (let ((lst (if (stringp val) (parse-comma-list val) (ensure-list val))))\\n                            (if (gen/list-of-integers-type-p stype)\\n                                (mapcar #'maybe-parse-integer lst)\\n                                lst)))\\n                         ;; integer slot: already integer from clingon, but be safe\\n                         ((eq stype 'integer) (maybe-parse-integer val))\\n                         (t val))))\\n                (setf initargs (plist-put initargs initarg parsed))))))))))\\n\\n(defun gen/encode-instance (instance dataset)\\n  (encode (set-meta instance dataset)))\\n\\n(defun gen/generate (cmd dtype)\\n  \\\"Generate JSON doc strings for a dtype.\\\"\\n  (let* ((dataset      (clingon:getopt cmd :dataset))\\n         (class-symbol (gen/class-for-dtype dtype))\\n         ;; finalize once, early\\n         (class        (gen/ensure-finalized-class class-symbol))\\n         (initargs     (gen/build-initargs cmd class-symbol))\\n         (multi-slot   (gen/multi-slot-name dtype)))\\n    (declare (ignore class))\\n    (if multi-slot\\n        (let* ((class   (gen/ensure-finalized-class class-symbol))\\n               (slotd   (or (gen/find-slotd-by-name class (string-upcase multi-slot))\\n                            (error \\\"Configured multi-slot ~a not found on class ~a\\\" multi-slot class-symbol)))\\n               (initarg  (or (gen/slot-initarg slotd)\\n                             (error \\\"Slot ~a has no initarg on class ~a\\\" multi-slot class-symbol)))\\n               (raw      (clingon:getopt cmd initarg))\\n               (vals     (if (stringp raw) (parse-comma-list raw) (ensure-list raw))))\\n          (unless (and vals (>= (length vals) 1))\\n            (error \\\"Missing multi value for --~a\\\" (kebab-case multi-slot)))\\n          (mapcar (lambda (v)\\n                    (gen/encode-instance\\n                     (apply #'make-instance class-symbol\\n                            (plist-put initargs initarg v))\\n                     dataset))\\n                  vals))\\n        (gen/encode-instance\\n         (apply #'make-instance class-symbol initargs)\\n         dataset))))\\n\\n(defun gen/make-subcommand-for-dtype (dtype)\\n  (let* ((class-symbol (gen/class-for-dtype dtype))\\n         (_class (gen/ensure-finalized-class class-symbol))\\n         (opts (append (gen/common-options)\\n                       (gen/options-for-class class-symbol))))\\n    (declare (ignore _class))\\n    (clingon:make-command\\n     :name dtype\\n     :description (format nil \\\"Generate ~a document(s) locally (MOP-derived options)\\\" dtype)\\n     :options opts\\n     :handler (lambda (cmd)\\n                (handler-case\\n                    (gen/print-documents (gen/generate cmd dtype))\\n                  (error (e)\\n                    (print-error (format nil \\\"Gen failed: ~a\\\" e))\\n                    (clingon:exit 1)))))))\\n\\n(defun gen/handler (cmd)\\n  (clingon:print-usage-and-exit cmd t))\\n\\n(defun gen/command ()\\n  (clingon:make-command\\n   :name \\\"gen\\\"\\n   :description \\\"Generate legacy StarIntel 0.9 documents locally (MOP-derived options)\\\"\\n   :handler #'gen/handler\\n   :sub-commands\\n   (let ((dtypes (sort (copy-list *gen-dtype-order*) #'string<)))\\n     (mapcar #'gen/make-subcommand-for-dtype dtypes))))\\n\\n(define-gen-dtype \\\"target\\\" starintel.legacy:target)\\n(define-gen-dtype \\\"person\\\" starintel.legacy:person)\\n(define-gen-dtype \\\"url\\\"    starintel.legacy:url)\\n(define-gen-dtype \\\"host\\\"   starintel.legacy:host)\\n(define-gen-dtype \\\"domain\\\" starintel.legacy:domain)\\n(define-gen-dtype \\\"org\\\"    starintel.legacy:org)\\n(define-gen-dtype \\\"relation\\\"    starintel.legacy:relation)\\n\\n;;; ============================================================================\\n;;; Main Command\\n;;; ============================================================================\\n\\n(defun main/handler (cmd)\\n  \\\"Handler for main command.\\\"\\n  (clingon:print-usage-and-exit cmd t))\\n\\n(defun main/command ()\\n  \\\"Main command definition.\\\"\\n  (clingon:make-command\\n   :name \\\"star-cli\\\"\\n   :version \\\"0.1.0\\\"\\n   :description \\\"Command-line client for StarIntel Gserver API\\\"\\n   :authors '(\\\"nsaspy <nsaspy@airmail.cc>\\\")\\n   :license \\\"GPL v3\\\"\\n   :options (global-options)\\n   :handler #'main/handler\\n   :sub-commands (list\\n                  (document/command)\\n                  (target/command)\\n                  (query/command)\\n                  (bulk/command)\\n                  (bbp/command)\\n                  (gen/command))))\\n\\n(defun main ()\\n  \\\"Main entry point for the CLI application.\\\"\\n  (let ((app (main/command)))\\n    (clingon:run app)))\\n\"},{\"path\":\"source/actor-systems/event-actor.lisp\",\"expected\":\"3a5674f925e71f80b51ef820bda70f116e074326\",\"content\":\"(in-package :star.actors)\\n\\n(defparameter +event-exchange+ \\\"events\\\")\\n(defparameter +event-queue+ \\\"events\\\")\\n(defparameter +event-routing-key+ \\\"event.#\\\")\\n(defparameter +event-dead-letter-exchange+ \\\"events.dead-letter\\\")\\n(defparameter +event-dead-letter-queue+ \\\"events.quarantine\\\")\\n(defparameter +event-dead-letter-routing-key+ \\\"events.invalid\\\")\\n(defparameter +event-persistence-timeout-seconds+ 10)\\n\\n(define-condition invalid-actor-event (error)\\n  ((reason\\n    :initarg :reason\\n    :reader invalid-actor-event-reason)\\n   (payload\\n    :initarg :payload\\n    :reader invalid-actor-event-payload))\\n  (:report\\n   (lambda (condition stream)\\n     (format stream\\n             \\\"Invalid actor event: ~a\\\"\\n             (invalid-actor-event-reason condition))))\\n  (:documentation \\\"Signalled when an actor event fails validation.\\\"))\\n\\n;; Accessor documentation for invalid-actor-event\\n(setf (documentation 'INVALID-ACTOR-EVENT-REASON 'function)\\n\\\"The =reason= slot of =invalid-actor-event=.\\\")\\n\\n\\n(setf (documentation 'INVALID-ACTOR-EVENT-REASON 'function)\\n\\\"The =invalid-actor-event-reason= slot of =invalid-actor-event=.\\\")\\n\\n(defclass actor-event ()\\n  ((_id\\n    :initarg :id\\n    :accessor event-id\\n    :initform (star.ids:ulid)\\n    :type string)\\n   (timestamp\\n    :initarg :timestamp\\n    :accessor event-timestamp\\n    :initform (- (get-universal-time) 2208988800)\\n    :type integer)\\n   (dtype\\n    :initarg :dtype\\n    :accessor doc-type\\n    :initform \\\"actorevent\\\"\\n    :type string)\\n   (actor-name\\n    :initarg :actor-name\\n    :accessor event-actor-name\\n    :initform \\\"\\\"\\n    :type string)\\n   (component\\n    :initarg :component\\n    :accessor event-component\\n    :initform \\\"\\\"\\n    :type string)\\n   (event-type\\n    :initarg :event-type\\n    :accessor event-type\\n    :initform \\\"\\\"\\n    :type string)\\n   (details\\n    :initarg :details\\n    :accessor event-details\\n    :initform \\\"\\\"\\n    :type string)\\n   (source-id\\n    :initarg :source-id\\n    :accessor event-source-document\\n    :initform \\\"\\\"\\n    :type string)\\n   (trace-id\\n    :initarg :trace-id\\n    :accessor event-trace-id\\n    :initform \\\"\\\"\\n    :type string)\\n   (generation\\n    :initarg :generation\\n    :accessor event-generation\\n    :initform 0\\n    :type integer))\\n  (:documentation \\\"Event record emitted by the actor runtime for observability.\\\"))\\n\\n;; Accessor documentation for actor-event\\n(setf (documentation 'EVENT-ACTOR-NAME 'function)\\n\\\"The =actor-name= slot of =actor-event=.\\\")\\n(setf (documentation 'EVENT-COMPONENT 'function)\\n\\\"The =component= slot of =actor-event=.\\\")\\n(setf (documentation 'EVENT-DETAILS 'function)\\n\\\"The =details= slot of =actor-event=.\\\")\\n(setf (documentation 'EVENT-GENERATION 'function)\\n\\\"The =generation= slot of =actor-event=.\\\")\\n(setf (documentation 'EVENT-ID 'function)\\n\\\"The =event-id= slot of =actor-event=.\\\")\\n(setf (documentation 'EVENT-SOURCE-DOCUMENT 'function)\\n\\\"The =source-id= slot of =actor-event=.\\\")\\n(setf (documentation 'EVENT-TIMESTAMP 'function)\\n\\\"The =timestamp= slot of =actor-event=.\\\")\\n(setf (documentation 'EVENT-TRACE-ID 'function)\\n\\\"The =trace-id= slot of =actor-event=.\\\")\\n(setf (documentation 'EVENT-TYPE 'function)\\n\\\"The =event-type= slot of =actor-event=.\\\")\\n\\n\\n\\n(defun make-actor-event (&key actor-name component event-type details source-id\\n                           trace-id (generation 0) timestamp dtype id)\\n  \\\"Construct a validated actor event record.\\\"\\n  (make-instance\\n   'actor-event\\n   :id (or id (star.ids:ulid))\\n   :timestamp (or timestamp (- (get-universal-time) 2208988800))\\n   :dtype (or dtype \\\"actorevent\\\")\\n   :actor-name (or actor-name component \\\"\\\")\\n   :component (or component actor-name \\\"\\\")\\n   :event-type (or event-type \\\"\\\")\\n   :details (or details \\\"\\\")\\n   :source-id (or source-id \\\"\\\")\\n   :trace-id (or trace-id \\\"\\\")\\n   :generation generation))\\n\\n(defun non-empty-string-p (value)\\n  (and (stringp value) (plusp (length value))))\\n\\n(defun validate-actor-event (event &optional payload)\\n  \\\"Validate an actor event; signal invalid-actor-event on failure.\\\"\\n  (flet ((invalid (reason)\\n           (error 'invalid-actor-event\\n                  :reason reason\\n                  :payload payload)))\\n    (unless (non-empty-string-p (event-id event))\\n      (invalid \\\"_id must be a non-empty string\\\"))\\n    (unless (and (integerp (event-timestamp event))\\n                 (plusp (event-timestamp event)))\\n      (invalid \\\"timestamp must be a positive integer\\\"))\\n    (unless (string= \\\"actorevent\\\" (doc-type event))\\n      (invalid \\\"dtype must be actorevent\\\"))\\n    (unless (or (non-empty-string-p (event-actor-name event))\\n                (non-empty-string-p (event-component event)))\\n      (invalid \\\"actorName or component is required\\\"))\\n    (unless (non-empty-string-p (event-type event))\\n      (invalid \\\"eventType is required\\\"))\\n    (unless (and (integerp (event-generation event))\\n                 (not (minusp (event-generation event))))\\n      (invalid \\\"generation must be a non-negative integer\\\"))\\n    event))\\n\\n(defun actor-event-json-object (payload)\\n  (let ((json\\n          (etypecase payload\\n            (string (jsown:parse payload))\\n            (list payload))))\\n    (unless (jsown:val-safe json \\\"dtype\\\")\\n      (setf (jsown:val json \\\"dtype\\\") \\\"actorevent\\\"))\\n    (unless (jsown:val-safe json \\\"generation\\\")\\n      (setf (jsown:val json \\\"generation\\\") 0))\\n    (let ((actor-name (jsown:val-safe json \\\"actorName\\\"))\\n          (component (jsown:val-safe json \\\"component\\\")))\\n      (when (and actor-name (not component))\\n        (setf (jsown:val json \\\"component\\\") actor-name))\\n      (when (and component (not actor-name))\\n        (setf (jsown:val json \\\"actorName\\\") component)))\\n    json))\\n\\n(defun decode-actor-event (payload)\\n  \\\"Decode and validate an event through the StarIntel object codec.\\\"\\n  (handler-case\\n      (let* ((json (actor-event-json-object payload))\\n             (event\\n               (star.databases.couchdb:from-json json 'actor-event)))\\n        (validate-actor-event event payload))\\n    (invalid-actor-event (condition)\\n      (error condition))\\n    (error (condition)\\n      (error 'invalid-actor-event\\n             :reason (princ-to-string condition)\\n             :payload payload))))\\n\\n(defun encode-actor-event (event)\\n  \\\"Serialize an actor event to its wire JSON representation.\\\"\\n  (jsown:to-json\\n   (star.databases.couchdb:as-json\\n    (validate-actor-event event))))\\n\\n(defun actor-event-insert-request (event)\\n  (make-couchdb-insert-request\\n   :database star:*couchdb-event-log-database*\\n   :document-id (event-id event)\\n   :document (encode-actor-event event)))\\n\\n(defun persist-actor-event (event &optional (insert-actor *couchdb-inserts*))\\n  (sento.actor:ask-s\\n   insert-actor\\n   (actor-event-insert-request event)\\n   :time-out +event-persistence-timeout-seconds+))\\n\\n(defun actor-event-settlement (event persistence-result)\\n  (declare (ignore event))\\n  (cond\\n    ((not (typep persistence-result 'couchdb-result))\\n     (star.consumers:settlement-retry\\n      :persistence-protocol-error\\n      persistence-result))\\n    ((member (couchdb-result-status persistence-result)\\n             '(:success :exists :conflict))\\n     (star.consumers:settlement-ack\\n      (if (eq :success (couchdb-result-status persistence-result))\\n          :persisted\\n          :duplicate)))\\n    (t\\n     (star.consumers:settlement-retry\\n      :persistence-failed\\n      (couchdb-result-error-message persistence-result)))))\\n\\n(defun process-event-delivery (payload &key (persist-fn #'persist-actor-event))\\n  \\\"Decode, validate, persist idempotently, and return an owner-thread settlement.\\\"\\n  (handler-case\\n      (let ((event (decode-actor-event payload)))\\n        (actor-event-settlement event (funcall persist-fn event)))\\n    (invalid-actor-event (condition)\\n      (star.consumers:settlement-dead-letter\\n       :invalid-event\\n       condition))\\n    (error (condition)\\n      (star.consumers:settlement-retry\\n       :event-handler-error\\n       condition))))\\n\\n(define-actor (*actor-event-receiver* *sys*)\\n  (lambda (event)\\n    (tell *couchdb-inserts* (actor-event-insert-request event))))\\n\\n(defun handle-event-message (consumer message)\\n  \\\"Process one RabbitMQ event message inside the event consumer.\\\"\\n  (declare (ignore consumer))\\n  (process-event-delivery (car message)))\\n\\n(defun start-event-consumer (n)\\n  \\\"Start durable owner-thread event consumers with bounded retry and quarantine.\\\"\\n  (let ((consumer\\n          (star.consumers:create-rabbit-consumer\\n           :name \\\"event-consumers\\\"\\n           :n n\\n           :host star:*rabbit-address*\\n           :port star:*rabbit-port*\\n           :username star:*rabbit-user*\\n           :password star:*rabbit-password*\\n           :queue-name +event-queue+\\n           :queue-durable t\\n           :exchange-name +event-exchange+\\n           :exchange-type \\\"topic\\\"\\n           :exchange-durable t\\n           :routing-key +event-routing-key+\\n           :test-fn #'identity\\n           :handler-fn #'handle-event-message\\n           :on-error :retry\\n           :on-filter :filtered-ack\\n           :max-retries star:*rabbit-max-retries*\\n           :retry-base-delay-ms star:*rabbit-retry-base-delay-ms*\\n           :retry-max-delay-ms star:*rabbit-retry-max-delay-ms*\\n           :retry-jitter-ratio star:*rabbit-retry-jitter-ratio*\\n           :quarantine-fn #'star.rabbit:persist-quarantine-record\\n           :quarantine-exchange star:*rabbit-quarantine-exchange*\\n           :quarantine-queue star:*rabbit-quarantine-queue*)))\\n    (star.consumers:start-consumer consumer)))\\n\\n(defun log-actor-event (actor-name &key event-type details source-id trace-id\\n                                     component (generation 0))\\n  \\\"Emit an actor event through the configured receiver and log it.\\\"\\n  (tell\\n   *actor-event-receiver*\\n   (make-actor-event\\n    :actor-name actor-name\\n    :component component\\n    :event-type event-type\\n    :details details\\n    :source-id source-id\\n    :trace-id trace-id\\n    :generation generation)))\\n\\n(nhooks:add-hook\\n star:*actors-start-hook*\\n (lambda ()\\n   (star.actors:register-actor\\n    \\\"actor-event-receiver\\\"\\n    *actor-event-receiver*)))\\n\\n(eval-when (:compile-toplevel :load-toplevel :execute)\\n  (export '(actor-event\\n            invalid-actor-event\\n            invalid-actor-event-reason\\n            make-actor-event\\n            validate-actor-event\\n            decode-actor-event\\n            encode-actor-event\\n            process-event-delivery\\n            event-component\\n            event-trace-id\\n            event-generation)\\n          :star.actors))\\n\\n;; Variable documentation for the actor-event receiver defined above\\n(setf (documentation '*actor-event-receiver* 'variable)\\n  \\\"Actor receiving every emitted actor event and persisting it to CouchDB.\\\")\\n\"},{\"path\":\"source/actor-systems/matcher-actor.lisp\",\"expected\":\"51d5fa3be426080c9cdaaa92940b02c135ed8686\",\"content\":\"(uiop:define-package   :star.actors.matcher\\n  (:use       :sento.actor :sento.agent :sento.actor-system :sento.actor-context :cl :star.actors #:star.databases.couchdb)\\n  (:nicknames :matchers)\\n  (:import-from :serapeum :dict :dict* :@ :maphash-return)\\n  (:documentation \\\"A actor that implements a simple way to run code against documents matching a condition.\\\")\\n  (:export\\n   #:add-pattern\\n   #:pattern\\n   #:transientp\\n   #:match-fn\\n   #:decode-fn\\n   #:subcriptions\\n   #:define-pattern\\n   #:pattern-name\\n   #:notify-subs\\n   #:pattern-actor\\n   #:*pattern-agent*\\n   #:*pattern-actor*\\n   #:*url-extractor*\\n   #:*url-extractor-fields*\\n   #:*url-regex*\\n   #:start-url-extractor))\\n\\n\\n\\n\\n\\n\\n(in-package :star.actors.matcher)\\n\\n\\n(defclass pattern ()\\n  ((name :initarg :name :initform (error \\\"Pattern requires a name\\\") :accessor pattern-name)\\n   (transient :initarg :transient :initform nil :accessor transientp :documentation \\\"Messages created by this pattern will be considered transient, and will not be saved to a database, use this if your pattern creates lots of targets that are not needed again later.\\\")\\n   (match-fn :initarg :match-fn :accessor match-fn :initform #'identity)\\n   (subs :initarg :subscriptions :accessor subcriptions :type list :documentation \\\"List of actor names to tell them about the message, it just runs (tell name <document>)\\\"))\\n\\n  (:documentation \\\"Document pattern matcher, based on a match-fn you supply. When the handler returns non nill, the subs actors are then sent a message with the message being the document\\\"))\\n\\n;; Accessor documentation for pattern\\n(setf (documentation 'MATCH-FN 'function)\\n  \\\"The matching function of =pattern=: document in, targets out.\\\")\\n(setf (documentation 'TRANSIENTP 'function)\\n  \\\"True when =pattern= creates transient targets that are not persisted.\\\")\\n(setf (documentation 'PATTERN-NAME 'function)\\n  \\\"The =name= slot of =pattern=.\\\")\\n(setf (documentation 'SUBCRIPTIONS 'function)\\n  \\\"The =subcriptions= slot of =pattern=: extracted fields this pattern watches.\\\")\\n\\n\\n;; Accessor documentation for pattern\\n(setf (documentation 'MATCH-FN 'function)\\n\\\"The =match-fn= slot of =pattern=.\\\")\\n(setf (documentation 'PATTERN-NAME 'function)\\n\\\"The =name= slot of =pattern=.\\\")\\n(setf (documentation 'SUBCRIPTIONS 'function)\\n\\\"The =subs= slot of =pattern=.\\\")\\n(setf (documentation 'TRANSIENTP 'function)\\n\\\"The =transient= slot of =pattern=.\\\")\\n\\n\\n(setf (documentation 'PATTERN-NAME 'function)\\n\\\"The =pattern-name= slot of =pattern=.\\\")\\n\\n\\n\\n(defgeneric notify-subs (self message)\\n  (:documentation \\\"Notify subscribers about matched documents.\\\"))\\n\\n\\n(defmethod notify-subs ((pattern pattern) message)\\n\\n  (when (funcall (match-fn pattern) message)\\n    (loop for actor in (subcriptions pattern)\\n          do (log:debug actor)\\n          do (act:tell actor message))))\\n\\n(defmacro define-pattern ((name subs) &body body)\\n  \\\"Define a named pattern: NAME with SUBS substitutions; BODY builds the document.\\\"\\n  `(make-instance 'pattern :name ,name  :subscriptions ,subs\\n                           :match-fn ,@body))\\n(defvar *pattern-lock* (bt:make-lock \\\"patterns\\\"))\\n\\n(defun add-pattern (pattern)\\n  \\\"Register PATTERN with the matcher actor so extracted fields are routed.\\\"\\n  (bt:with-lock-held (*pattern-lock*)\\n    (push pattern star:*document-patterns*)))\\n\\n\\n(defparameter *url-regex* (ppcre:create-scanner \\\"https?:\\\\\\\\/\\\\\\\\/(www\\\\\\\\.)?\\\\[-a-zA-Z0-9@:%.\\\\_\\\\\\\\+~#=\\\\]{1,256}\\\\\\\\.\\\\[a-zA-Z0-9()\\\\]{1,6}\\\\\\\\b(\\\\[-a-zA-Z0-9()@:%\\\\_\\\\\\\\+.~#?&//=\\\\]\\\\*)\\\")\\n  \\\"Regular expression used by the URL extractor to find URLs in documents.\\\")\\n\\n(defparameter *url-extractor-fields* '(\\\"content\\\" \\\"bio\\\")\\n  \\\"Document fields scanned by the URL extractor.\\\")\\n\\n(defparameter *url-extractor* nil \\\"\\\")\\n\\n\\n(defun ensure-legacy-url-extractor-input (document)\\n  \\\"Reject canonical input before the historical URL extractor has side effects.\\\"\\n  (when (or (star.documents:canonical-document-p document)\\n            (jsown:keyp document \\\"id\\\"))\\n    (log:warn \\\"URL extractor rejects canonical input; canonical support awaits issue #44.\\\")\\n    (error \\\"Canonical URL extraction is unsupported (issue #44).\\\"))\\n  document)\\n\\n(defun process-legacy-url-extractor-message (msg)\\n  \\\"Run the unchanged historical URL extraction after checking its input boundary.\\\"\\n  (ensure-legacy-url-extractor-input msg)\\n  (let* ((dataset (jsown:val msg \\\"dataset\\\"))\\n         (docs\\n           (alexandria:flatten\\n            (loop for field in *url-extractor-fields*\\n                  for content = (or (jsown:val-safe msg field) \\\"\\\")\\n                  collect (loop for url in (ppcre:all-matches-as-strings *url-regex* content)\\n                                for doc = (starintel.legacy:new-url dataset :url url :content \\\"\\\")\\n                                for rel = (starintel.legacy:new-relation\\n                                           dataset (jsown:val msg \\\"_id\\\")\\n                                           (starintel.legacy:doc-id doc) \\\"extracted\\\")\\n                                collect (list rel doc))))))\\n    (when docs\\n      (loop for doc in docs\\n            for data = (as-json doc)\\n            do (log:error \\\"documents.new.~a\\\" (starintel.legacy:doc-type doc))\\n            do (publish *producer-agent* :body data\\n                        :properties (list (cons :type (starintel.legacy:doc-type doc)))\\n                        :routing-key (format nil \\\"documents.new.~a\\\" (starintel.legacy:doc-type doc)))))))\\n\\n(defun start-url-extractor ()\\n  \\\"Start the URL extractor actor over every registered pattern.\\\"\\n  (setf *url-extractor* (actor-of *sys*\\n                                :name \\\"url-extractor\\\"\\n                                :receive #'process-legacy-url-extractor-message))\\n  (add-pattern (define-pattern (\\\"url-extractor\\\" (list *url-extractor*))\\n                 (lambda (msg)\\n                   (string= (jsown:val msg \\\"dtype\\\") \\\"message\\\")))))\\n\\n(nhooks:add-hook star:*actors-start-hook* #'start-url-extractor)\\n\\n\\n\"},{\"path\":\"t/http-api-test.lisp\",\"expected\":\"ca098e571dd084723cbebc06b98443b032af594a\",\"content\":\"(in-package :star-server-tests)\\n\\n;;;; HTTP API Unit Tests\\n\\n(def-suite http-api-tests\\n  :description \\\"Test suite for HTTP API endpoints\\\")\\n\\n(in-suite http-api-tests)\\n\\n;;; ----------------------------------------------------------------------\\n;;; Debug toggles\\n;;; ----------------------------------------------------------------------\\n\\n(defparameter *http-tests-debug* t\\n  \\\"When true, print verbose debug info during HTTP tests.\\\")\\n\\n(defun dbg (fmt &rest args)\\n  (when *http-tests-debug*\\n    (apply #'format *error-output* (concatenate 'string \\\"~&[http-tests] \\\" fmt \\\"~%\\\") args)))\\n\\n;;; ----------------------------------------------------------------------\\n;;; Test Configuration\\n;;; ----------------------------------------------------------------------\\n\\n(defparameter *test-server* nil\\n  \\\"Test server instance\\\")\\n\\n(defparameter *test-port* 5555\\n  \\\"Port for test HTTP server\\\")\\n\\n(defparameter *test-base-url* (format nil \\\"http://127.0.0.1:~d\\\" *test-port*)\\n  \\\"Base URL for test requests\\\")\\n\\n(defparameter *test-database* \\\"starintel-test\\\"\\n  \\\"Database name for tests (separate from production)\\\")\\n\\n;;; ----------------------------------------------------------------------\\n;;; Header helpers (Dexador headers are annoyingly inconsistent)\\n;;; ----------------------------------------------------------------------\\n\\n(defun header->string (v)\\n  (dbg \\\"header->string input: ~s (type ~a)\\\" v (type-of v))\\n  (cond\\n    ((null v) \\\"\\\")\\n    ((stringp v) v)\\n    ((and (listp v) (every #'stringp v))\\n     (format nil \\\"~{~a~^, ~}\\\" v))\\n    (t\\n     (princ-to-string v))))\\n\\n(defun headers/get (headers name)\\n  \\\"Return header value for NAME (case-insensitive) as a string.\\\"\\n  (dbg \\\"headers/get name=~s headers-type=~a headers=~s\\\"\\n       name (type-of headers) headers)\\n  (labels ((norm (x) (string-downcase (string x)))\\n           (matchp (k) (string= (norm k) (norm name))))\\n    (cond\\n      ((hash-table-p headers)\\n       (let ((found nil))\\n         (maphash (lambda (k v)\\n                    (when (and (null found) (matchp k))\\n                      (setf found v)))\\n                  headers)\\n         (dbg \\\"headers/get(hash) found=~s (type ~a)\\\" found (type-of found))\\n         (header->string found)))\\n\\n      ((and (listp headers) (consp (car headers)))\\n       (let ((v (cdr (assoc name headers :test #'string-equal))))\\n         (dbg \\\"headers/get(alist) raw=~s (type ~a)\\\" v (type-of v))\\n         (header->string v)))\\n\\n      ((listp headers)\\n       (let ((v (or (getf headers name)\\n                    (getf headers (string-downcase name))\\n                    (getf headers (string-upcase name)))))\\n         (dbg \\\"headers/get(plist) raw=~s (type ~a)\\\" v (type-of v))\\n         (header->string v)))\\n\\n      (t\\n       (dbg \\\"headers/get: unknown header container, returning empty string\\\")\\n       \\\"\\\"))))\\n\\n(defun header-contains-p (headers name needle)\\n  (let ((v (headers/get headers name)))\\n    (dbg \\\"header-contains-p name=~s needle=~s value=~s (len ~d)\\\"\\n         name needle v (length v))\\n    (and (plusp (length v))\\n         (search (string-downcase needle) (string-downcase v)))))\\n\\n;;; ----------------------------------------------------------------------\\n;;; Test Fixtures and Helpers\\n;;; ----------------------------------------------------------------------\\n\\n(defun ensure-test-database ()\\n  \\\"Ensure the test database exists, create it if it doesn't.\\\"\\n  (dbg \\\"Ensuring test database exists: ~a\\\" *test-database*)\\n  (handler-case\\n      (progn\\n        ;; Set the default database to the test database\\n        (setf star.databases.couchdb::*couchdb-default-database* *test-database*)\\n        ;; Use init-db to create database and views\\n        (star.databases.couchdb::init-db))\\n    (error (e)\\n      (dbg \\\"Error ensuring database: ~a\\\" e)\\n      (error e))))\\n\\n(defun destroy-test-database ()\\n  \\\"Destroy the test database.\\\"\\n  (dbg \\\"Destroying test database: ~a\\\" *test-database*)\\n  (handler-case\\n      (anypool:with-connection (client star.databases.couchdb::*couchdb-pool*)\\n        (handler-case\\n            (cl-couch:delete-database client *test-database*)\\n          (dexador:http-request-not-found ()\\n            (dbg \\\"Database already doesn't exist: ~a\\\" *test-database*))))\\n    (error (e)\\n      (dbg \\\"Error destroying database: ~a\\\" e))))\\n\\n(defun start-test-server ()\\n  \\\"Start a test HTTP server instance backed by the real production\\nmiddleware stack with request-scoped development authorization bindings.\\\"\\n  (dbg \\\"start-test-server port=~d\\\" *test-port*)\\n  (when (null *test-server*)\\n    (ensure-restricted-credential)\\n    (setf *test-server*\\n          (clack:clackup #'test-http-app\\n                         :port *test-port*\\n                         :silent t)))\\n  (dbg \\\"start-test-server server=~s\\\" *test-server*)\\n  *test-server*)\\n\\n(defun stop-test-server ()\\n  \\\"Stop the test HTTP server.\\\"\\n  (dbg \\\"stop-test-server server=~s\\\" *test-server*)\\n  (when *test-server*\\n    (handler-case\\n        (progn\\n          (clack:stop *test-server*)\\n          (sleep 0.5))  ; Give server time to shutdown\\n      (error (e)\\n        (dbg \\\"Error stopping server: ~a\\\" e)))\\n    (setf *test-server* nil))\\n  (dbg \\\"stop-test-server done\\\"))\\n\\n(defun make-test-url (path)\\n  (let ((url (format nil \\\"~a~a\\\" *test-base-url* path)))\\n    (dbg \\\"make-test-url path=~s -> ~s\\\" path url)\\n    url))\\n\\n;;; ----------------------------------------------------------------------\\n;;; Test-only request security configuration\\n;;; ----------------------------------------------------------------------\\n;;; The HTTP integration tests must exercise the real production\\n;;; middleware stack (star.frontends.http-api::*server*), which applies\\n;;; authentication and route-level resource authorization.  Clack worker\\n;;; threads may handle requests after the dynamic bindings established\\n;;; around clack:clackup have ended, so the development bypass bindings\\n;;; are re-established for every request inside the test app wrapper\\n;;; below rather than around clack:clackup itself.\\n\\n(defparameter *test-auth-pepper* \\\"http-api-test-pepper\\\"\\n  \\\"Test-only auth pepper used to mint the restricted test credential.\\\")\\n\\n(defparameter *restricted-credential-store* nil\\n  \\\"Memory credential store holding the test-only restricted principal.\\\")\\n\\n(defparameter *restricted-credential-key* nil\\n  \\\"Raw API key for the test-only restricted principal.  The principal has\\nthe documents:read capability but no grant for the testing dataset, so\\nroute-level resource authorization denies with 403.\\\")\\n\\n(defun ensure-restricted-credential ()\\n  \\\"Build a test-only memory credential store with one authenticated principal\\nthat lacks the dataset resource scope, so requests carrying its API key pass\\nthe capability check but are rejected by route-level resource authorization.\\\"\\n  (unless *restricted-credential-store*\\n    (let ((star:*auth-pepper* *test-auth-pepper*))\\n      (setf *restricted-credential-store*\\n            (star.auth:make-memory-credential-store))\\n      (multiple-value-bind (record raw-key)\\n          (star.auth:create-api-key\\n           \\\"restricted-client\\\"\\n           \\\"api_client\\\"\\n           '(\\\"documents:read\\\" \\\"dataset:other\\\")\\n           :store *restricted-credential-store*)\\n        (declare (ignore record))\\n        (setf *restricted-credential-key* raw-key)))))\\n\\n(defun test-http-app (env)\\n  \\\"Test-only Clack app that runs each request through the real production\\nmiddleware stack with request-scoped development authorization bindings.\\n\\nA test-only X-Test-Auth-Mode header selects the request security context:\\n  nil or \\\\\\\"dev-bypass\\\\\\\"  -> disabled auth + loopback dev bypass, yielding the\\n                          development administrator principal used by the\\n                          legacy HTTP endpoint tests.\\n  \\\\\\\"unauthenticated\\\\\\\"    -> disabled auth without dev bypass, so the\\n                          authentication middleware rejects with 401.\\n  \\\\\\\"restricted\\\\\\\"         -> api-key auth against a test-only memory credential\\n                          store whose principal lacks the dataset grant, so\\n                          route-level resource authorization rejects with 403.\\\"\\n  (let* ((mode (let ((header\\n                       (star.frontends.http-api::env-header-value\\n                        env \\\"X-Test-Auth-Mode\\\")))\\n                 (and header (string-downcase header))))\\n         (restricted-p (string= mode \\\"restricted\\\"))\\n         (unauthenticated-p (string= mode \\\"unauthenticated\\\"))\\n         (star:*auth-mode* (if restricted-p \\\"api-key\\\" \\\"disabled\\\"))\\n         (star:*auth-dev-bypass* (not unauthenticated-p))\\n         (star:*http-api-address* \\\"127.0.0.1\\\")\\n         (star:*auth-pepper*\\n           (if restricted-p *test-auth-pepper* star:*auth-pepper*))\\n         (star.auth:*credential-store*\\n           (if restricted-p\\n               *restricted-credential-store*\\n               star.auth:*credential-store*)))\\n    (lack.component:call star.frontends.http-api::*server* env)))\\n\\n(defun perform-request (thunk)\\n  \\\"Run THUNK (a zero-argument function performing a dexador request) and\\nreturn (values status body). Dexador HTTP failures contribute their response\\nstatus and body; any other error is re-signaled so the test fails loudly\\ninstead of being mistaken for an expected broker failure.\\\"\\n  (handler-case\\n      (multiple-value-bind (body status headers)\\n          (funcall thunk)\\n        (declare (ignore headers))\\n        (values status body))\\n    (dexador:http-request-failed (condition)\\n      (values (dexador:response-status condition)\\n              (dexador:response-body condition)))))\\n\\n(defun make-test-document (&key (id \\\"test-123\\\") (dtype \\\"message\\\"))\\n  \\\"Create a test document structure.\\\"\\n  (jsown:new-js\\n    (\\\"_id\\\" id)\\n    (\\\"dtype\\\" dtype)\\n    (\\\"content\\\" \\\"test content\\\")\\n    (\\\"timestamp\\\" (get-universal-time))\\n    (\\\"transient\\\" :false)))\\n\\n(defun make-test-target (&key (id \\\"target-123\\\") (actor \\\"nmap\\\"))\\n  \\\"Create a test target structure.\\\"\\n  (let ((doc (starintel.legacy:new-target \\\"testing\\\" id  actor)))\\n    (starintel.legacy:ulid-id doc)\\n    (starintel.legacy:encode doc)))\\n\\n;; The view endpoints still read the legacy flat document shape until the\\n;; versioned CouchDB view migration is implemented. Keep that compatibility\\n;; explicit instead of weakening canonical HTTP fixtures.\\n(defun legacy-view-key (key)\\n  (cond\\n    ((string= key \\\"record_type\\\") \\\"recordType\\\")\\n    ((string= key \\\"resolved_addresses\\\") \\\"resolvedAddresses\\\")\\n    (t key)))\\n\\n(defun make-legacy-view-document (document)\\n  \\\"Flatten a canonical DOCUMENT for a legacy CouchDB view fixture.\\\"\\n  (let* ((object (jsown:parse (jsown:to-json document)))\\n         (data (jsown:val object \\\"data\\\")))\\n    (jsown:remkey object \\\"data\\\")\\n    (when (and (consp data) (eq (first data) :obj))\\n      (jsown:do-json-keys (key value) data\\n        (setf (jsown:val object (legacy-view-key key)) value)))\\n    object))\\n\\n\\n\\n;;; Test document creation helpers for BBP/network/web types\\n\\n(defun make-test-host (&key (id nil) (ip \\\"192.168.1.100\\\"))\\n  \\\"Create a test host document. If id is provided, use it; otherwise generate ULID.\\\"\\n  (let ((doc (starintel.legacy:new-host \\\"testing\\\" :ip ip :os \\\"linux\\\")))\\n    (if id\\n        (setf (starintel.legacy:doc-id doc) id)\\n        (starintel.legacy:ulid-id doc))\\n    ;; Add ports array for by_port and by_service views\\n    (setf (starintel.legacy:host-ports doc) (list (make-instance 'starintel.legacy:service :number 22 :services \\\"ssh\\\" :version \\\"\\\")))\\n    (starintel.legacy:encode doc)))\\n\\n\\n(defun make-test-email (&key (id nil) (user \\\"testuser\\\") (domain \\\"example.com\\\"))\\n  \\\"Create a test email document. If id is provided, use it; otherwise generate ULID.\\\"\\n  (let ((doc (starintel.legacy:new-email \\\"testing\\\" :user user :domain domain)))\\n    (if id\\n        (setf (starintel.legacy:doc-id doc) id)\\n        (starintel.legacy:ulid-id doc))\\n    ;; Password is a legacy flat-view field, not part of the v0.9 email schema.\\n    (let ((encoded (starintel.legacy:encode doc)))\\n      (jsown:remkey (jsown:val encoded \\\"data\\\") \\\"password\\\")\\n      encoded)))\\n\\n\\n(defun make-test-domain (&key (id nil) (record \\\"example.com\\\") (resolved '(\\\"1.2.3.4\\\" \\\"5.6.7.8\\\")))\\n  \\\"Create a test domain document. If id is provided, use it; otherwise generate ULID.\\\"\\n  (let ((doc (starintel.legacy:new-domain \\\"testing\\\" :record record :record-type \\\"A\\\" :resolved resolved)))\\n    (if id\\n        (setf (starintel.legacy:doc-id doc) id)\\n        (starintel.legacy:ulid-id doc))\\n    (starintel.legacy:encode doc)))\\n\\n(defun make-test-user (&key (id nil) (name \\\"testuser\\\") (platform \\\"github\\\"))\\n  \\\"Create a test user document. If id is provided, use it; otherwise generate ULID.\\\"\\n  (let ((doc (starintel.legacy:new-user \\\"testing\\\"\\n                            :name name\\n                            :platform platform\\n                            :url (format nil \\\"https://~a.com/~a\\\" platform name)\\n                            :bio \\\"Test user bio\\\")))\\n    (if id\\n        (setf (starintel.legacy:doc-id doc) id)\\n        (starintel.legacy:ulid-id doc))\\n    (starintel.legacy:encode doc)))\\n\\n(defun make-test-network (&key (id nil) (asn 12345))\\n  \\\"Create a test network document. If id is provided, use it; otherwise generate ULID.\\\"\\n  (let ((doc (starintel.legacy:new-network \\\"testing\\\" :asn asn :org \\\"Test Organization\\\" :subnet \\\"10.0.0.0/8\\\")))\\n    (if id\\n        (setf (starintel.legacy:doc-id doc) id)\\n        (starintel.legacy:ulid-id doc))\\n    (starintel.legacy:encode doc)))\\n\\n(defun make-test-url-doc (&key (id nil) (url \\\"https://example.com/test\\\"))\\n  \\\"Create a test url document. If id is provided, use it; otherwise generate ULID.\\\"\\n  (let ((doc (starintel.legacy:new-url \\\"testing\\\" :url url :path \\\"/test\\\" :content \\\"Test page content\\\")))\\n    (if id\\n        (setf (starintel.legacy:doc-id doc) id)\\n        (starintel.legacy:ulid-id doc))\\n    (starintel.legacy:encode doc)))\\n\\n(defun make-test-breach (&key (id nil) (total 10000))\\n  \\\"Create a test breach document. If id is provided, use it; otherwise generate ULID.\\\"\\n  (let ((doc (make-instance 'starintel.legacy:breach\\n                            :url \\\"https://example.com/breach\\\"\\n                            :description \\\"Test breach description\\\"\\n                            :total total)))\\n    (starintel.legacy:set-meta doc \\\"testing\\\")\\n    (if id\\n        (setf (starintel.legacy:doc-id doc) id)\\n        (starintel.legacy:ulid-id doc))\\n    (starintel.legacy:encode doc)))\\n\\n(defun make-test-legacy-host (&rest args)\\n  (make-legacy-view-document (apply #'make-test-host args)))\\n\\n(defun make-test-legacy-email (&key (id nil) (user \\\"testuser\\\")\\n                                    (domain \\\"example.com\\\") (password nil))\\n  (let ((document\\n          (make-legacy-view-document\\n           (make-test-email :id id :user user :domain domain))))\\n    (when password\\n      (setf (jsown:val document \\\"password\\\") password))\\n    document))\\n\\n(defun make-test-legacy-domain (&rest args)\\n  (make-legacy-view-document (apply #'make-test-domain args)))\\n\\n(defun make-test-legacy-user (&rest args)\\n  (make-legacy-view-document (apply #'make-test-user args)))\\n\\n(defun make-test-legacy-network (&rest args)\\n  (make-legacy-view-document (apply #'make-test-network args)))\\n\\n(defun make-test-legacy-url-doc (&rest args)\\n  (make-legacy-view-document (apply #'make-test-url-doc args)))\\n\\n(defun make-test-legacy-breach (&rest args)\\n  (make-legacy-view-document (apply #'make-test-breach args)))\\n\\n(defun make-test-email-message (&key (id nil) (from \\\"sender@example.com\\\") (to \\\"recipient@example.com\\\"))\\n  \\\"Create a test email-message document. If id is provided, use it; otherwise generate ULID.\\\"\\n  (let ((doc (make-instance 'starintel.legacy:email-message\\n                            :from from\\n                            :to to\\n                            :subject \\\"Test Email Subject\\\"\\n                            :body \\\"This is a test email message body\\\")))\\n    (starintel.legacy:set-meta doc \\\"testing\\\")\\n    (if id\\n        (setf (starintel.legacy:doc-id doc) id)\\n        (starintel.legacy:ulid-id doc))\\n    (starintel.legacy:encode doc)))\\n\\n(defun insert-test-document (doc)\\n  \\\"Insert a test document directly into CouchDB.\\\"\\n  (dbg \\\"Inserting test document: ~a\\\" (jsown:val doc \\\"_id\\\"))\\n  (handler-case\\n      (anypool:with-connection (client star.databases.couchdb::*couchdb-pool*)\\n        (cl-couch:create-document client *test-database*\\n                                  (jsown:to-json doc)))\\n    (error (e)\\n      (dbg \\\"Error inserting document: ~a\\\" e)\\n      (error e))))\\n\\n\\n;;; ----------------------------------------------------------------------\\n;;; Root Endpoint Tests\\n;;; ----------------------------------------------------------------------\\n\\n(test test-root-endpoint\\n      \\\"Test GET / returns server metadata.\\\"\\n      (dbg \\\"TEST: test-root-endpoint\\\")\\n      (let* ((url (make-test-url \\\"/\\\"))\\n             (response (dex:get url)))\\n        (dbg \\\"root response type=~a len=~d\\\" (type-of response) (length response))\\n        (dbg \\\"root response snippet=~s\\\"\\n             (subseq response 0 (min 200 (length response))))\\n        (let ((data (jsown:parse response)))\\n          (dbg \\\"root parsed type=~a keys(doc_spec_version? ~a default-dataset? ~a event_log? ~a)\\\"\\n               (type-of data)\\n               (jsown:keyp data \\\"doc_spec_version\\\")\\n               (jsown:keyp data \\\"default-dataset\\\")\\n               (jsown:keyp data \\\"event_log\\\"))\\n          (is (not (null data)))\\n          (is (jsown:keyp data \\\"doc_spec_version\\\"))\\n          (is (jsown:keyp data \\\"default-dataset\\\"))\\n          (is (jsown:keyp data \\\"event_log\\\")))))\\n\\n(test test-root-endpoint-content-type\\n      \\\"Test root endpoint returns JSON content type.\\\"\\n      (dbg \\\"TEST: test-root-endpoint-content-type\\\")\\n      (multiple-value-bind (body status headers)\\n          (dex:get (make-test-url \\\"/\\\"))\\n        (dbg \\\"root status=~s body-type=~a body-len=~d headers-type=~a\\\"\\n             status (type-of body) (if body (length body) 0) (type-of headers))\\n        (dbg \\\"root headers=~s\\\" headers)\\n        (is (= 200 status))\\n        (is (header-contains-p headers \\\"content-type\\\" \\\"application/json\\\"))))\\n\\n;;; ----------------------------------------------------------------------\\n;;; A super-focused reproducer for the old crash\\n;;; ----------------------------------------------------------------------\\n\\n(test test-debug-print-raw-headers\\n      \\\"Print raw headers and exercise content-type lookup without crashing.\\\"\\n      (dbg \\\"TEST: test-debug-print-raw-headers\\\")\\n      (multiple-value-bind (body status headers)\\n          (dex:get (make-test-url \\\"/\\\"))\\n        (declare (ignore body))\\n        (dbg \\\"status=~s headers=~s\\\" status headers)\\n        (let ((ct (headers/get headers \\\"content-type\\\")))\\n          (dbg \\\"content-type resolved => ~s (type ~a)\\\" ct (type-of ct))\\n          (is (stringp ct))\\n          ;; if it's empty string, that's still useful debug data; don't hard-fail yet\\n          (pass))))\\n\\n;;; ----------------------------------------------------------------------\\n;;; BBP/Network/Web Endpoint Tests\\n;;; ----------------------------------------------------------------------\\n\\n;;; Host endpoint tests\\n\\n(test test-hosts-by-ip\\n      \\\"Test GET /documents/hosts/by-ip endpoint.\\\"\\n      (dbg \\\"TEST: test-hosts-by-ip\\\")\\n      (insert-test-document (make-test-legacy-host :id \\\"host-test-3\\\" :ip \\\"192.168.1.100\\\"))\\n      (insert-test-document (make-test-legacy-host :id \\\"host-test-5\\\" :ip \\\"192.168.1.101\\\"))\\n      (sleep 2)\\n      (let* ((url (make-test-url \\\"/documents/hosts/by-ip?ip=192.168.1.100\\\"))\\n             (response (dex:get url)))\\n        (dbg \\\"hosts-by-ip response len=~d\\\" (length response))\\n        (let ((data (jsown:parse response)))\\n          (is (listp data))\\n          (is (> (length data) 0))\\n          (let ((first-doc (car data)))\\n            (is (string= \\\"192.168.1.100\\\" (jsown:val first-doc \\\"ip\\\")))))))\\n\\n(test test-hosts-by-port\\n      \\\"Test GET /documents/hosts/by-port endpoint.\\\"\\n      (dbg \\\"TEST: test-hosts-by-port\\\")\\n      (insert-test-document (make-test-legacy-host :id \\\"host-test-1\\\" :ip \\\"192.168.1.100\\\"))\\n      (sleep 2)\\n      (let* ((url (make-test-url \\\"/documents/hosts/by-port?port=22\\\"))\\n             (response (dex:get url)))\\n        (dbg \\\"hosts-by-port response len=~d\\\" (length response))\\n        (let ((data (jsown:parse response)))\\n          (is (listp data))\\n          (is (> (length data) 0)))))\\n\\n(test test-hosts-by-service\\n      \\\"Test GET /documents/hosts/by-service endpoint.\\\"\\n      (dbg \\\"TEST: test-hosts-by-service\\\")\\n      (insert-test-document (make-test-legacy-host :id \\\"host-test-4\\\" :ip \\\"192.168.1.100\\\"))\\n      (sleep 2)\\n      (let* ((url (make-test-url \\\"/documents/hosts/by-service?service=ssh\\\"))\\n             (response (dex:get url)))\\n        (dbg \\\"hosts-by-service response len=~d\\\" (length response))\\n        (let ((data (jsown:parse response)))\\n          (is (listp data))\\n          (is (> (length data) 0)))))\\n\\n;;; Email endpoint tests\\n\\n(test test-emails-by-email\\n      \\\"Test GET /documents/emails/by-email endpoint.\\\"\\n      (dbg \\\"TEST: test-emails-by-email\\\")\\n      (insert-test-document (make-test-legacy-email :id \\\"email-test-1\\\" :user \\\"testuser\\\" :domain \\\"example.com\\\"))\\n      (sleep 2)\\n      (let* ((url (make-test-url \\\"/documents/emails/by-email?email=testuser@example.com\\\"))\\n             (response (dex:get url)))\\n        (dbg \\\"emails-by-email response len=~d\\\" (length response))\\n        (let ((data (jsown:parse response)))\\n          (is (listp data))\\n          (is (> (length data) 0))\\n          (let ((first-doc (car data)))\\n            (is (string= \\\"testuser\\\" (jsown:val first-doc \\\"user\\\")))\\n            (is (string= \\\"example.com\\\" (jsown:val first-doc \\\"domain\\\")))))))\\n\\n(test test-emails-by-domain\\n      \\\"Test GET /documents/emails/by-domain endpoint.\\\"\\n      (dbg \\\"TEST: test-emails-by-domain\\\")\\n      (insert-test-document (make-test-legacy-email :id \\\"email-test-2\\\" :user \\\"user1\\\" :domain \\\"example.com\\\"))\\n      (insert-test-document (make-test-legacy-email :id \\\"email-test-3\\\" :user \\\"user2\\\" :domain \\\"example.com\\\"))\\n      (insert-test-document (make-test-legacy-email :id \\\"email-test-4\\\" :user \\\"user3\\\" :domain \\\"other.com\\\"))\\n      (sleep 2)\\n      (let* ((url (make-test-url \\\"/documents/emails/by-domain?domain=example.com\\\"))\\n             (response (dex:get url)))\\n        (dbg \\\"emails-by-domain response len=~d\\\" (length response))\\n        (let ((data (jsown:parse response)))\\n          (is (listp data))\\n          (is (>= (length data) 2)))))\\n\\n(test test-emails-with-password\\n      \\\"Test GET /documents/emails/with-password endpoint.\\\"\\n      (dbg \\\"TEST: test-emails-with-password\\\")\\n      (insert-test-document (make-test-legacy-email :id \\\"email-test-5\\\" :user \\\"testuser\\\" :domain \\\"example.com\\\" :password \\\"secretpass123\\\"))\\n      (sleep 2)\\n      (let* ((url (make-test-url \\\"/documents/emails/with-password\\\"))\\n             (response (dex:get url)))\\n        (dbg \\\"emails-with-password response len=~d\\\" (length response))\\n        (let ((data (jsown:parse response)))\\n          (is (listp data))\\n          (is (> (length data) 0)))))\\n\\n;;; Domain endpoint tests\\n\\n(test test-domains-by-record\\n      \\\"Test GET /documents/domains/by-record endpoint.\\\"\\n      (dbg \\\"TEST: test-domains-by-record\\\")\\n      (insert-test-document (make-test-legacy-domain :id \\\"domain-test-1\\\" :record \\\"example.com\\\"))\\n      (sleep 2)\\n      (let* ((url (make-test-url \\\"/documents/domains/by-record?record=example.com\\\"))\\n             (response (dex:get url)))\\n        (dbg \\\"domains-by-record response len=~d\\\" (length response))\\n        (let ((data (jsown:parse response)))\\n          (is (listp data))\\n          (is (> (length data) 0))\\n          (let ((first-doc (car data)))\\n            (is (string= \\\"example.com\\\" (jsown:val first-doc \\\"record\\\")))))))\\n\\n(test test-domains-by-resolved-address\\n      \\\"Test GET /documents/domains/by-resolved-address endpoint.\\\"\\n      (dbg \\\"TEST: test-domains-by-resolved-address\\\")\\n      (insert-test-document (make-test-legacy-domain :id \\\"domain-test-2\\\" :record \\\"example.com\\\"))\\n      (sleep 2)\\n      (let* ((url (make-test-url \\\"/documents/domains/by-resolved-address?ip=1.2.3.4\\\"))\\n             (response (dex:get url)))\\n        (dbg \\\"domains-by-resolved-address response len