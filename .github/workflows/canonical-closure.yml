kes-precedence-over-fallback\\n  (let ((star:*tenant-fallback* \\\"ci\\\")\\n        (star:*tenant-dataset-map* '((\\\"dataset-a\\\" . \\\"llm\\\"))))\\n    (let* ((resource\\n             (star.authorization:resource-from-document\\n              (tenantless-policy-document :dataset \\\"dataset-a\\\")))\\n           (unmapped\\n             (star.authorization:resource-from-document\\n              (tenantless-policy-document :dataset \\\"dataset-b\\\"))))\\n      (is (string= \\\"llm\\\"\\n                   (star.authorization:authorization-resource-tenant-id\\n                    resource)))\\n      (is (string= \\\"ci\\\"\\n                   (star.authorization:authorization-resource-tenant-id\\n                    unmapped))))))\\n\\n(test tenant-bearing-document-is-never-rewritten-by-adapter\\n  (let ((star:*tenant-fallback* \\\"ci\\\")\\n        (star:*tenant-dataset-map* '((\\\"dataset-a\\\" . \\\"llm\\\"))))\\n    (let ((document (tenantless-policy-document)))\\n      (setf (jsown:val document \\\"tenant_id\\\") \\\"default\\\")\\n      (is (string= \\\"default\\\"\\n                   (star.authorization:authorization-resource-tenant-id\\n                    (star.authorization:resource-from-document document)))))))\\n\"},{\"path\":\"t/http-tenant-injection-test.lisp\",\"expected\":\"4f7adda3239640eb62380a528f15619df006a378\",\"content\":\"(in-package :star-server-tests)\\n\\n(def-suite http-tenant-injection-tests\\n  :description \\\"Server-side tenant injection before persistence and egress redaction\\\")\\n\\n(in-suite http-tenant-injection-tests)\\n\\n(defun injection-document (&key (dataset \\\"dataset-a\\\") tenant)\\n  (let ((document\\n          (jsown:new-js\\n            (\\\"_id\\\" \\\"doc-injection-1\\\")\\n            (\\\"dataset\\\" dataset)\\n            (\\\"dtype\\\" \\\"observation\\\")\\n            (\\\"schema_version\\\" \\\"0.9.0\\\")\\n            (\\\"version\\\" 1)\\n            (\\\"date_added\\\" \\\"2026-09-14T00:00:00Z\\\")\\n            (\\\"date_updated\\\" \\\"2026-09-14T00:00:00Z\\\")\\n            (\\\"sources\\\")\\n            (\\\"evidence\\\")\\n            (\\\"data\\\" (jsown:new-js)))))\\n    (when tenant\\n      (setf (jsown:val document \\\"tenant_id\\\") tenant))\\n    document))\\n\\n(test stamp-injects-resolved-tenant-when-unconfigured\\n  (let ((star:*tenant-fallback* nil)\\n        (star:*tenant-dataset-map* nil))\\n    (let ((document (injection-document)))\\n      (star.frontends.http-api:stamp-server-tenant! document)\\n      (is (string= \\\"default\\\" (jsown:val document \\\"tenant_id\\\"))))))\\n\\n(test stamp-injects-fallback-and-dataset-map-tenants\\n  (let ((star:*tenant-fallback* \\\"ci\\\")\\n        (star:*tenant-dataset-map* '((\\\"dataset-a\\\" . \\\"llm\\\"))))\\n    (let ((mapped (injection-document :dataset \\\"dataset-a\\\"))\\n          (unmapped (injection-document :dataset \\\"dataset-b\\\")))\\n      (star.frontends.http-api:stamp-server-tenant! mapped)\\n      (star.frontends.http-api:stamp-server-tenant! unmapped)\\n      (is (string= \\\"llm\\\" (jsown:val mapped \\\"tenant_id\\\")))\\n      (is (string= \\\"ci\\\" (jsown:val unmapped \\\"tenant_id\\\"))))))\\n\\n(test stamp-never-rewrites-a-declared-tenant\\n  (let ((star:*tenant-fallback* \\\"ci\\\")\\n        (star:*tenant-dataset-map* '((\\\"dataset-a\\\" . \\\"llm\\\"))))\\n    (let ((document (injection-document :tenant \\\"default\\\")))\\n      (star.frontends.http-api:stamp-server-tenant! document)\\n      (is (string= \\\"default\\\" (jsown:val document \\\"tenant_id\\\"))))))\\n\\n(test strip-removes-injected-tenant-and-nothing-else\\n  (let ((star:*tenant-fallback* \\\"ci\\\"))\\n    (let ((document (injection-document)))\\n      (star.frontends.http-api:stamp-server-tenant! document)\\n      (is (string= \\\"ci\\\" (jsown:val document \\\"tenant_id\\\")))\\n      (star.frontends.http-api:strip-server-tenant-fields document)\\n      (is (null (jsown:keyp document \\\"tenant_id\\\")))\\n      (is (string= \\\"doc-injection-1\\\" (jsown:val document \\\"_id\\\")))\\n      (is (string= \\\"dataset-a\\\" (jsown:val document \\\"dataset\\\")))\\n      (is (string= \\\"observation\\\" (jsown:val document \\\"dtype\\\"))))))\\n\\n(test strip-leaves-tenantless-documents-untouched\\n  (let ((document (injection-document)))\\n    (star.frontends.http-api:strip-server-tenant-fields document)\\n    (is (string= \\\"doc-injection-1\\\" (jsown:val document \\\"_id\\\")))\\n    (is (null (jsown:keyp document \\\"tenant_id\\\")))))\\n\\n(test strip-from-rows-handles-list-and-vector-rows\\n  (let* ((doc-a (star.frontends.http-api:stamp-server-tenant!\\n                 (injection-document)))\\n         (doc-b (star.frontends.http-api:stamp-server-tenant!\\n                 (injection-document)))\\n         (list-response\\n          (jsown:new-js\\n            (\\\"rows\\\" (list (jsown:new-js (\\\"id\\\" \\\"a\\\") (\\\"doc\\\" doc-a))\\n                         (jsown:new-js (\\\"id\\\" \\\"b\\\"))))))\\n         (vector-response\\n          (jsown:new-js\\n            (\\\"rows\\\" (vector (jsown:new-js (\\\"id\\\" \\\"c\\\") (\\\"doc\\\" doc-b)))))))\\n    (star.frontends.http-api:strip-server-tenant-from-rows list-response)\\n    (star.frontends.http-api:strip-server-tenant-from-rows vector-response)\\n    (dolist (row (jsown:val list-response \\\"rows\\\"))\\n      (when (jsown:keyp row \\\"doc\\\")\\n        (is (null (jsown:keyp (jsown:val row \\\"doc\\\") \\\"tenant_id\\\")))))\\n    (loop for row across (jsown:val vector-response \\\"rows\\\")\\n          do (is (null (jsown:keyp (jsown:val row \\\"doc\\\") \\\"tenant_id\\\"))))))\\n\\n(test strip-from-search-body-roundtrips-json-and-redacts\\n  (let* ((stored (star.frontends.http-api:stamp-server-tenant!\\n                  (injection-document)))\\n         (body (jsown:to-json\\n                (jsown:new-js\\n                  (\\\"total\\\" 1)\\n                  (\\\"rows\\\" (list (jsown:new-js\\n                                 (\\\"id\\\" \\\"doc-injection-1\\\")\\n                                 (\\\"doc\\\" stored)))))))\\n         (stripped (star.frontends.http-api:strip-server-tenant-from-search-body\\n                    body))\\n         (parsed (jsown:parse stripped)))\\n    (is (= 1 (jsown:val parsed \\\"total\\\")))\\n    (let ((doc (jsown:val (first (jsown:val parsed \\\"rows\\\")) \\\"doc\\\")))\\n      (is (null (jsown:keyp doc \\\"tenant_id\\\")))\\n      (is (string= \\\"doc-injection-1\\\" (jsown:val doc \\\"_id\\\"))))))\\n\\n(test stamp-then-strip-roundtrips-the-client-contract\\n  (let ((star:*tenant-fallback* \\\"ci\\\")\\n        (star:*tenant-dataset-map* nil))\\n    (let* ((stored (star.frontends.http-api:stamp-server-tenant!\\n                    (injection-document))))\\n      (is (string= \\\"ci\\\" (jsown:val stored \\\"tenant_id\\\")))\\n      (let ((returned (star.frontends.http-api:strip-server-tenant-fields\\n                       stored)))\\n        (is (null (jsown:keyp returned \\\"tenant_id\\\")))\\n        (dolist (key '(\\\"_id\\\" \\\"dataset\\\" \\\"dtype\\\" \\\"version\\\"))\\n          (is (equal (jsown:val (injection-document) key)\\n                     (jsown:val returned key))))))))\\n\\n(test consumer-decode-exempts-injected-tenant-and-restores-it\\n  (let* ((star:*tenant-fallback* \\\"ci\\\")\\n         (stamped\\n           (star.frontends.http-api:stamp-server-tenant!\\n            (starintel.legacy:encode\\n             (starintel.legacy:new-host \\\"testing-debug\\\" :ip \\\"192.0.2.30\\\" :os \\\"linux\\\"))))\\n         (message (cons (jsown:to-json stamped) 1))\\n         (decoded (star.rabbit:decode-rabbit-document message)))\\n    (is (string= \\\"ci\\\" (jsown:val decoded \\\"tenant_id\\\")))\\n    (is (string= \\\"host\\\" (jsown:val decoded \\\"dtype\\\")))))\\n\\n(test consumer-decode-still-rejects-schema-invalid-documents\\n  (let ((message\\n          (cons\\n           (jsown:to-json\\n            (jsown:new-js\\n              (\\\"_id\\\" \\\"bad-doc\\\")\\n              (\\\"dataset\\\" \\\"testing-debug\\\")\\n              (\\\"dtype\\\" \\\"note\\\")\\n              (\\\"schema_version\\\" \\\"0.9.0\\\")\\n              (\\\"version\\\" 1)\\n              (\\\"undeclared_top_level_field\\\" \\\"schema violation\\\")\\n              (\\\"date_added\\\" \\\"2026-09-14T00:00:00Z\\\")\\n              (\\\"date_updated\\\" \\\"2026-09-14T00:00:00Z\\\")\\n              (\\\"sources\\\")\\n              (\\\"evidence\\\")\\n              (\\\"data\\\")))\\n           1)))\\n    (signals star.consumers:schema-invalid-delivery-error\\n      (star.rabbit:decode-rabbit-document message))))\\n\\n(test strip-accepts-raw-json-strings\\n  (let ((json\\n          (jsown:to-json\\n           (star.frontends.http-api:stamp-server-tenant!\\n            (injection-document :dataset \\\"testing-debug\\\" :tenant \\\"ci\\\")))))\\n    (let ((stripped\\n            (star.frontends.http-api:strip-server-tenant-fields json)))\\n      (is (stringp stripped))\\n      (is (null (jsown:keyp (jsown:parse stripped) \\\"tenant_id\\\")))\\n      (is (string= \\\"doc-injection-1\\\"\\n                   (jsown:val (jsown:parse stripped) \\\"_id\\\"))))))\\n\\n(test search-rows-strip-fields-and-outbox-payload-tenants\\n  (let* ((doc (injection-document :dataset \\\"testing-debug\\\" :tenant \\\"ci\\\"))\\n         (payload (jsown:new-js\\n                    (\\\"_id\\\" \\\"doc-injection-1\\\")\\n                    (\\\"tenant_id\\\" \\\"ci\\\")))\\n         (outbox-entry (jsown:new-js\\n                         (\\\"mutation_id\\\" \\\"m-1\\\")\\n                         (\\\"payload\\\" payload)))\\n         (extensions (jsown:new-js\\n                      (\\\"_server_outbox\\\" (vector outbox-entry))))\\n         (row (jsown:new-js\\n                (\\\"id\\\" \\\"doc-injection-1\\\")\\n                (\\\"fields\\\" (jsown:new-js (\\\"tenant_id\\\" \\\"ci\\\")))\\n                (\\\"doc\\\" (jsown:extend-js doc\\n                         (\\\"extensions\\\" extensions)))))\\n         (response (jsown:new-js (\\\"rows\\\" (vector row)))))\\n    (star.frontends.http-api:strip-server-tenant-from-rows response)\\n    (let ((out-row (elt (jsown:val response \\\"rows\\\") 0)))\\n      (is (null (jsown:keyp (jsown:val out-row \\\"fields\\\") \\\"tenant_id\\\")))\\n      (is (null (jsown:keyp (jsown:val out-row \\\"doc\\\") \\\"tenant_id\\\")))\\n      (is (null\\n           (jsown:keyp\\n            (jsown:val\\n             (elt\\n              (jsown:val\\n               (jsown:val (jsown:val out-row \\\"doc\\\") \\\"extensions\\\")\\n               \\\"_server_outbox\\\") 0)\\n             \\\"payload\\\")\\n            \\\"tenant_id\\\"))))))\\n\\n(test search-strip-normalizes-jsown-bodies\\n  (let* ((doc (injection-document :dataset \\\"testing-debug\\\" :tenant \\\"ci\\\"))\\n         (row (jsown:new-js\\n                (\\\"id\\\" \\\"doc-injection-1\\\")\\n                (\\\"fields\\\" (jsown:new-js (\\\"tenant_id\\\" \\\"ci\\\")))\\n                (\\\"doc\\\" doc)))\\n         (body (jsown:new-js (\\\"rows\\\" (vector row))))\\n         (stripped\\n           (star.frontends.http-api:strip-server-tenant-from-search-body body)))\\n    (is (jsown:keyp stripped \\\"rows\\\"))\\n    (let ((out-row (elt (jsown:val stripped \\\"rows\\\") 0)))\\n      (is (null (jsown:keyp (jsown:val out-row \\\"fields\\\") \\\"tenant_id\\\")))\\n      (is (null (jsown:keyp (jsown:val out-row \\\"doc\\\") \\\"tenant_id\\\"))))))\\n\"},{\"path\":\"t/v09-runtime-test.lisp\",\"expected\":\"4657dbeb4ace8ddc331f6eb205864349419e38e6\",\"content\":\"(in-package :star-server-tests)\\n\\n(def-suite v09-runtime-tests\\n  :description \\\"Legacy StarIntel v0.9 validator and Rabbit mutation boundary\\\")\\n\\n(in-suite v09-runtime-tests)\\n\\n(defun v09-test-host-document ()\\n  (starintel.legacy:encode\\n   (starintel.legacy:new-host\\n    \\\"v09-runtime-tests\\\"\\n    :ip \\\"192.0.2.20\\\"\\n    :os \\\"linux\\\")))\\n\\n(defun v09-test-operation-document ()\\n  (let* ((data (jsown:empty-object))\\n         (targets (jsown:empty-object))\\n         (discovery (jsown:empty-object))\\n         (analysis (jsown:empty-object)))\\n    (setf (jsown:val targets \\\"primary\\\")\\n          (list \\\"starintel:target:operation-runtime-primary\\\")\\n          (jsown:val targets \\\"supporting\\\")\\n          (list \\\"starintel:investigation-target:operation-runtime-question\\\")\\n          (jsown:val discovery \\\"phase_id\\\") \\\"discovery\\\"\\n          (jsown:val discovery \\\"objective\\\") \\\"Discover approved public sources\\\"\\n          (jsown:val discovery \\\"state\\\") \\\"completed\\\"\\n          (jsown:val discovery \\\"completion_evidence\\\")\\n          (list \\\"starintel:evidence-record:operation-runtime-discovery\\\")\\n          (jsown:val analysis \\\"phase_id\\\") \\\"analysis\\\"\\n          (jsown:val analysis \\\"objective\\\") \\\"Analyze collected operation data\\\"\\n          (jsown:val analysis \\\"state\\\") \\\"ready\\\"\\n          (jsown:val analysis \\\"depends_on\\\") (list \\\"discovery\\\")\\n          (jsown:val data \\\"mission\\\") \\\"Exercise the operation runtime boundary\\\"\\n          (jsown:val data \\\"status\\\") \\\"active\\\"\\n          (jsown:val data \\\"in_scope\\\") (list \\\"public-source research\\\")\\n          (jsown:val data \\\"out_of_scope\\\") (list \\\"private contact information\\\")\\n          (jsown:val data \\\"targets\\\") targets\\n          (jsown:val data \\\"phases\\\") (list discovery analysis))\\n    (starintel.legacy:encode\\n     (make-instance 'starintel.legacy:operation\\n                    :dataset \\\"v09-runtime-tests\\\"\\n                    :title \\\"Operation runtime boundary\\\"\\n                    :data data))))\\n\\n(defun capture-schema-invalid (thunk)\\n  (handler-case\\n      (progn\\n        (funcall thunk)\\n        nil)\\n    (star.consumers:schema-invalid-delivery-error (condition)\\n      condition)\\n    (star.documents:document-schema-validation-error (condition)\\n      condition)))\\n\\n(defun invalid-rabbit-delivery ()\\n  (cons\\n   (jsown:to-json\\n    (jsown:new-js\\n      (\\\"_id\\\" \\\"invalid-rabbit-document\\\")\\n      (\\\"dataset\\\" \\\"v09-runtime-tests\\\")\\n      (\\\"dtype\\\" \\\"host\\\")\\n      (\\\"version\\\" 7)))\\n   1))\\n\\n(test canonical-starintel-encoding-passes-server-validator\\n  (let ((document (v09-test-host-document)))\\n    (is (eq document (star.documents:validate-v09-document document)))\\n    (is (string= \\\"0.9.0\\\" (jsown:val document \\\"schema_version\\\")))\\n    (is (= 1 (jsown:val document \\\"version\\\")))))\\n\\n(test operation-encoding-passes-server-validator\\n  (let* ((document (v09-test-operation-document))\\n         (data (jsown:val document \\\"data\\\"))\\n         (targets (jsown:val data \\\"targets\\\")))\\n    (is (eq document (star.documents:validate-v09-document document)))\\n    (is (string= \\\"operation\\\" (jsown:val document \\\"dtype\\\")))\\n    (is (string= \\\"Action\\\"\\n                 (jsown:val (jsown:val document \\\"schema_org\\\") \\\"@type\\\")))\\n    (is (string= \\\"starintel:target:operation-runtime-primary\\\"\\n                 (first (jsown:val targets \\\"primary\\\"))))\\n    (is (string= \\\"starintel:investigation-target:operation-runtime-question\\\"\\n                 (first (jsown:val targets \\\"supporting\\\"))))))\\n\\n(test operation-missing-required-field-fails-strict-validation\\n  (let* ((document (v09-test-operation-document)))\\n    (jsown:remkey (jsown:val document \\\"data\\\") \\\"mission\\\")\\n    (let ((condition\\n            (capture-schema-invalid\\n             (lambda ()\\n               (star.documents:validate-v09-document document)))))\\n      (is-true condition)\\n      (is (typep condition 'star.documents:document-schema-validation-error)))))\\n\\n(test rabbit-ingest-invalid-schema-cannot-reach-persistence\\n  (let ((persisted nil))\\n    (let ((condition\\n            (capture-schema-invalid\\n             (lambda ()\\n               (star.rabbit::process-rabbit-document-mutation\\n                (invalid-rabbit-delivery)\\n                :new\\n                :persist-fn\\n                (lambda (document operation)\\n                  (declare (ignore document operation))\\n                  (setf persisted t)))))))\\n      (is-true condition)\\n      (is (typep condition 'star.consumers:schema-invalid-delivery-error))\\n      (is-false persisted))))\\n\\n(test rabbit-update-invalid-schema-cannot-reach-persistence\\n  (let ((persisted nil))\\n    (let ((condition\\n            (capture-schema-invalid\\n             (lambda ()\\n               (star.rabbit::process-rabbit-document-mutation\\n                (invalid-rabbit-delivery)\\n                :updated\\n                :persist-fn\\n                (lambda (document operation)\\n                  (declare (ignore document operation))\\n                  (setf persisted t)))))))\\n      (is-true condition)\\n      (is (typep condition 'star.consumers:schema-invalid-delivery-error))\\n      (is-false persisted))))\\n\\n(test decode-escape-hatch-permits-transport-metadata-inspection\\n  ;; transient-p inspects transport metadata without strict schema\\n  ;; validation; it is the only remaining non-strict decode.\\n  (let* ((message\\n           (cons\\n            (jsown:to-json\\n             (jsown:new-js\\n               (\\\"_id\\\" \\\"legacy-target\\\")\\n               (\\\"dtype\\\" \\\"target\\\")\\n               (\\\"actor\\\" \\\"nmap\\\")\\n               (\\\"legacy_flat_field\\\" \\\"compatibility\\\")))\\n            1))\\n         (document\\n           (star.rabbit:decode-rabbit-document\\n            message\\n            :route-dtype \\\"target\\\"\\n            :strict-schema-p nil)))\\n    (is (string= \\\"legacy-target\\\" (jsown:val document \\\"_id\\\")))\\n    (is (string= \\\"target\\\" (jsown:val document \\\"dtype\\\")))))\\n\\n(test target-deliveries-are-strictly-validated\\n  ;; The target compatibility consumer validates like every other dtype:\\n  ;; the historical top-level actor envelope is now a schema violation.\\n  (let* ((message\\n           (cons\\n            (jsown:to-json\\n             (jsown:new-js\\n               (\\\"_id\\\" \\\"legacy-target\\\")\\n               (\\\"dtype\\\" \\\"target\\\")\\n               (\\\"actor\\\" \\\"nmap\\\")\\n               (\\\"legacy_flat_field\\\" \\\"compatibility\\\")))\\n            1))\\n         (condition\\n           (capture-schema-invalid\\n            (lambda ()\\n              (star.rabbit:decode-rabbit-document\\n               message :route-dtype \\\"target\\\")))))\\n    (is-true condition)))\\n\\n(test rabbit-strict-validation-is-default\\n  (is-true\\n   (capture-schema-invalid\\n    (lambda ()\\n      (star.rabbit:decode-rabbit-document (invalid-rabbit-delivery))))))\\n\\n(test target-compatibility-routing-key-is-isolated\\n  (is (string= \\\"documents.new.target.nmap\\\"\\n               (star.actors:compatibility-target-ingress-routing-key \\\"Nmap\\\")))\\n  (signals star.actors:invalid-target-dispatch\\n    (star.actors:compatibility-target-ingress-routing-key \\\"nmap.#\\\")))\\n\\n(test http-update-schema-validation-precedes-save\\n  (let* ((existing (v09-test-host-document))\\n         (patch (jsown:new-js\\n                  (\\\"legacy_flat_field\\\" \\\"must-not-persist\\\")))\\n         (saved nil)\\n         (outcome\\n           (star.databases.couchdb:upsert-document-update\\n            (lambda (document-id)\\n              (declare (ignore document-id))\\n              existing)\\n            (lambda (candidate)\\n              (setf saved candidate))\\n            (jsown:val existing \\\"_id\\\")\\n            patch)))\\n    (is (eq :validation-failed\\n            (star.databases.couchdb:document-update-outcome-status outcome)))\\n    (is (string= \\\"invalid_document_schema\\\"\\n                 (star.databases.couchdb:document-update-outcome-code outcome)))\\n    (is-false saved)))\\n\\n(defun run-v09-runtime-tests ()\\n  (run! 'v09-runtime-tests))\\n\\n(test historical-url-extractor-accepts-only-legacy-envelope\\n  (let ((document (jsown:new-js (\\\"_id\\\" \\\"legacy:message\\\")\\n                                (\\\"dataset\\\" \\\"legacy-tests\\\")\\n                                (\\\"dtype\\\" \\\"message\\\")\\n                                (\\\"content\\\" \\\"https://example.org/\\\"))))\\n    (is (eq document (star.actors.matcher::ensure-legacy-url-extractor-input document))))\\n  (let* ((url (starintel.legacy:new-url \\\"legacy-tests\\\" :url \\\"https://example.org/\\\" :content \\\"\\\"))\\n         (relation (starintel.legacy:new-relation\\n                    \\\"legacy-tests\\\" \\\"legacy:message\\\" (starintel.legacy:doc-id url) \\\"extracted\\\")))\\n    (dolist (document (list url relation))\\n      (let ((wire (starintel.legacy:encode document)))\\n        (is (string= \\\"0.9.0\\\" (jsown:val wire \\\"schema_version\\\")))\\n        (is-false (jsown:keyp wire \\\"schemaVersion\\\"))\\n        (is (eq wire (star.documents:validate-document wire)))))))\\n\"},{\"path\":\"source/frontends/http-boundary-core.lisp\",\"expected\":\"a53870ce40ba75f66b35771f3c794f9e86953425\",\"content\":\"(in-package :star.frontends.http-api)\\n\\n(defparameter +http-max-body-bytes+ (* 1024 1024))\\n(defparameter +http-max-query-limit+ 100)\\n\\n(defvar *http-correlation-id* nil)\\n\\n(define-condition http-input-error (error)\\n  ((status\\n    :initarg :status\\n    :reader http-input-error-status)\\n   (code\\n    :initarg :code\\n    :reader http-input-error-code)\\n   (message\\n    :initarg :message\\n    :reader http-input-error-message)\\n   (info\\n    :initarg :info\\n    :initform nil\\n    :reader http-input-error-info))\\n  (:report\\n   (lambda (condition stream)\\n     (format stream \\\"~a\\\" (http-input-error-message condition))))\\n  (:documentation \\\"Signalled for malformed HTTP input payloads.\\\"))\\n\\n;; Accessor documentation for http-input-error\\n(setf (documentation 'HTTP-INPUT-ERROR-CODE 'function)\\n\\\"The =code= slot of =http-input-error=.\\\")\\n(setf (documentation 'HTTP-INPUT-ERROR-STATUS 'function)\\n\\\"The =status= slot of =http-input-error=.\\\")\\n\\n\\n\\n(defun new-correlation-id ()\\n  (star.ids:ulid))\\n\\n(defun current-correlation-id ()\\n  (or *http-correlation-id*\\n      (new-correlation-id)))\\n\\n(defun set-correlation-id-header ()\\n  (setf (lack.response:response-headers *response*)\\n        (append (lack.response:response-headers *response*)\\n                (list :x-correlation-id (current-correlation-id)))))\\n\\n(defun status-msg (msg status &key info traceback code)\\n  \\\"Return a client-safe status envelope. TRACEBACK is intentionally ignored.\\\"\\n  (declare (ignore traceback))\\n  (let ((json (jsown:new-js\\n                (\\\"msg\\\" msg)\\n                (\\\"status\\\" (string-downcase (symbol-name status)))\\n                (\\\"correlation_id\\\" (current-correlation-id)))))\\n    (when code\\n      (setf (jsown:val json \\\"code\\\") code))\\n    (when info\\n      (setf (jsown:val json \\\"info\\\") info))\\n    (jsown:to-json json)))\\n\\n(defun signal-http-input-error (status code message &optional info)\\n  (error 'http-input-error\\n         :status status\\n         :code code\\n         :message message\\n         :info info))\\n\\n(defun respond-http-input-error (condition)\\n  (setf (lack.response:response-status *response*)\\n        (http-input-error-status condition))\\n  (status-msg (http-input-error-message condition)\\n              'error\\n              :code (http-input-error-code condition)\\n              :info (http-input-error-info condition)))\\n\\n(defmacro with-http-boundary (() &body body)\\n  `(let ((*http-correlation-id* (new-correlation-id)))\\n     (set-default-headers)\\n     (set-correlation-id-header)\\n     (handler-case\\n         (progn ,@body)\\n       (http-input-error (condition)\\n         (log:warn \\\"HTTP input rejected correlation=~a code=~a: ~a\\\"\\n                   (current-correlation-id)\\n                   (http-input-error-code condition)\\n                   condition)\\n         (respond-http-input-error condition))\\n       (bt:timeout (condition)\\n         (log:error \\\"HTTP operation timed out correlation=~a: ~a\\\"\\n                    (current-correlation-id)\\n                    condition)\\n         (setf (lack.response:response-status *response*) 504)\\n         (status-msg \\\"Request deadline exceeded\\\"\\n                     'error\\n                     :code \\\"request_timeout\\\"))\\n       (error (condition)\\n         (log:error \\\"HTTP internal error correlation=~a: ~a\\\"\\n                    (current-correlation-id)\\n                    condition)\\n         (setf (lack.response:response-status *response*) 500)\\n         (status-msg \\\"Internal Server Error\\\"\\n                     'error\\n                     :code \\\"internal_error\\\")))))\\n\\n(defun json-object-p (value)\\n  \\\"True when the parsed payload is a JSON object.\\\"\\n  (and (consp value)\\n       (eq (car value) :obj)))\\n\\n(defun json-array-p (value)\\n  \\\"True when the parsed payload is a JSON array.\\\"\\n  (or (null value)\\n      (and (listp value)\\n           (not (json-object-p value)))))\\n\\n(defun request-content-type (&optional (request (ningle:context :request)))\\n  (or (ignore-errors (lack.request:request-content-type request))\\n      (getf (lack.request:request-env request) :content-type)))\\n\\n(defun json-content-type-p (content-type)\\n  (when (stringp content-type)\\n    (let ((normalized (string-downcase content-type)))\\n      (or (search \\\"application/json\\\" normalized)\\n          (search \\\"+json\\\" normalized)))))\\n\\n(defun request-body-octets (&optional (request (ningle:context :request)))\\n  (let ((content (lack.request:request-content request)))\\n    (etypecase content\\n      ((simple-array (unsigned-byte 8) (*)) content)\\n      (string (babel:string-to-octets content :encoding :utf-8))\\n      (vector content)\\n      (null #()))))\\n\\n(defun parse-json-octets (octets content-type\\n                          &key (max-bytes +http-max-body-bytes+))\\n  \\\"Parse a request body (octets) into a JSON value.\\\"\\n  (unless (json-content-type-p content-type)\\n    (signal-http-input-error\\n     415\\n     \\\"unsupported_media_type\\\"\\n     \\\"Content-Type must be application/json\\\"))\\n  (when (> (length octets) max-bytes)\\n    (signal-http-input-error\\n     413\\n     \\\"request_body_too_large\\\"\\n     \\\"Request body exceeds the configured limit\\\"\\n     (jsown:new-js (\\\"maximum_bytes\\\" max-bytes))))\\n  (handler-case\\n      (let ((text (babel:octets-to-string octets :encoding :utf-8)))\\n        ;; Validate with the packaged standards-oriented parser, then retain\\n        ;; JSOWN as the service's existing internal document representation.\\n        ;; The injective reader binds jsown's parsed-value slots so JSON\\n        ;; false/null survive the internal representation and every later\\n        ;; jsown:to-json re-serialization (wire, validation, CouchDB) emits\\n        ;; the original literals instead of conflating them with [] / null.\\n        (yason:parse text)\\n        (jsown:with-injective-reader\\n          (jsown:parse text)))\\n    (error ()\\n      (signal-http-input-error\\n       400\\n       \\\"malformed_json\\\"\\n       \\\"Request body contains malformed JSON\\\"))))\\n\\n(defun parse-json-request (&key (max-bytes +http-max-body-bytes+))\\n  (let* ((request (ningle:context :request))\\n         (content-type (request-content-type request))\\n         (octets (request-body-octets request)))\\n    (parse-json-octets octets content-type :max-bytes max-bytes)))\\n\\n(defun require-json-object (value)\\n  (unless (json-object-p value)\\n    (signal-http-input-error\\n     400\\n     \\\"json_object_required\\\"\\n     \\\"Request body must be a JSON object\\\"))\\n  value)\\n\\n(defun require-json-array (value)\\n  (unless (json-array-p value)\\n    (signal-http-input-error\\n     400\\n     \\\"json_array_required\\\"\\n     \\\"Request body must be a JSON array\\\"))\\n  value)\\n\\n(defun non-empty-string-p (value)\\n  (and (stringp value)\\n       (plusp (length value))))\\n\\n(defun require-document-string (document field &key index)\\n  (let ((value (jsown:val-safe document field)))\\n    (unless (non-empty-string-p value)\\n      (signal-http-input-error\\n       422\\n       \\\"invalid_document\\\"\\n       (if index\\n           (format nil \\\"Document at index ~d requires a non-empty ~a field\\\"\\n                   index field)\\n           (format nil \\\"Document requires a non-empty ~a field\\\" field))\\n       (jsown:new-js (\\\"field\\\" field)\\n                     (\\\"index\\\" (or index :null)))))\\n    value))\\n\\n;;;; Server-side tenant injection and egress redaction\\n;;\\n;; Tenancy is a server concern. Clients neither send nor receive tenant\\n;; fields; the client-visible contract stays exactly v0.9.0. On ingest\\n;; the resolved tenant is injected as tenant_id before any MQ publish or\\n;; database write, and every document returned to a client has the\\n;; server-injected tenant_id removed again.\\n\\n(defun resolved-server-tenant (document)\\n  \\\"Tenant adopted by a document that carries no tenancy of its own.\\\"\\n  (or (star:tenant-adaptation-for\\n       (star.documents:document-value document \\\"dataset\\\" nil))\\n      \\\"default\\\"))\\n\\n(defun stamp-server-tenant! (document)\\n  \\\"Inject the resolved tenant_id ahead of MQ publish or persistence.\\n\\nA document that already declares tenant_id or tenant keeps it untouched.\\\"\\n  (unless (or (jsown:keyp document \\\"tenant_id\\\")\\n              (jsown:keyp document \\\"tenant\\\"))\\n    (setf (jsown:val document \\\"tenant_id\\\")\\n          (resolved-server-tenant document)))\\n  document)\\n\\n(defun strip-server-tenant-fields (document)\\n  \\\"Remove the server-injected tenant_id from an outgoing document.\\n\\nAccepts either a parsed jsown object or a raw JSON string; strings are\\nparsed, stripped, and re-serialized so the surrounding handler keeps\\noperating on the type it started with.\\\"\\n  (etypecase document\\n    (string\\n     (jsown:to-json\\n      (strip-server-tenant-fields (jsown:parse document))))\\n    (list\\n     (when (jsown:keyp document \\\"tenant_id\\\")\\n       (jsown:remkey document \\\"tenant_id\\\"))\\n     (if (star.documents:canonical-document-p document)\\n         (star.documents:canonical-wire-document document)\\n         document))))\\n\\n(defun strip-outbox-payload-tenants (extensions)\\n  \\\"Strip tenant_id from outbox payloads embedded in server extensions.\\n\\nThe outbox records the originally published (tenant-stamped) payload for\\ninternal bookkeeping; it must not leak tenancy on egress.\\\"\\n  (when (and extensions\\n             (jsown:keyp extensions \\\"_server_outbox\\\"))\\n    (let ((outbox (jsown:val extensions \\\"_server_outbox\\\")))\\n      (loop for entry in (if (listp outbox)\\n                             outbox\\n                             (coerce outbox 'list))\\n            when (jsown:keyp entry \\\"payload\\\")\\n              do (setf (jsown:val entry \\\"payload\\\")\\n                       (strip-server-tenant-fields (jsown:val entry \\\"payload\\\"))))))\\n  extensions)\\n\\n(defun strip-server-tenant-from-rows (response)\\n  \\\"Strip tenant_id from every embedded document of a row response.\\n\\nCovers the FTS stored-fields projection (=fields=), the embedded document\\n(=doc=), and outbox payloads recorded inside =doc.extensions=.\\\"\\n  (whe