name: Export reconciliation sources

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/reconcile-v09-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Export branch trees
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev agent/schema-org-v0.9 agent/reconcile-v09-dev
          mkdir -p artifacts
          git archive --format=tar.gz --prefix=dev/ origin/dev > artifacts/dev.tar.gz
          git archive --format=tar.gz --prefix=v09/ origin/agent/schema-org-v0.9 > artifacts/v09.tar.gz
          git archive --format=tar.gz --prefix=reconciled/ origin/agent/reconcile-v09-dev > artifacts/reconciled.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: reconciliation-sources
          path: artifacts/*.tar.gz
