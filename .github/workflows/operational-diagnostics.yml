name: Operational diagnostics

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  unit-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run unit suite with full log
        shell: bash
        run: |
          set +e
          set -o pipefail
          nix run .#star-unit-tests 2>&1 | tee /tmp/operational-unit.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-unit-log
          path: /tmp/operational-unit.log
          if-no-files-found: error
