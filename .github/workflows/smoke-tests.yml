name: Smoke Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate flake
        run: nix flake check --show-trace

      - name: Build server
        shell: bash
        run: |
          set +e
          log_file="$RUNNER_TEMP/server-build.log"
          nix build .#default --no-link --print-build-logs >"$log_file" 2>&1
          status=$?
          tail -n 250 "$log_file"
          exit "$status"

      - name: Upload server-build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-build-${{ github.sha }}
          path: ${{ runner.temp }}/server-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Run hermetic unit tests
        shell: bash
        run: |
          set +e
          log_file="$RUNNER_TEMP/hermetic-unit-tests.log"
          nix run .#star-unit-tests >"$log_file" 2>&1
          status=$?
          tail -n 250 "$log_file"
          exit "$status"

      - name: Upload hermetic unit-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermetic-unit-tests-${{ github.sha }}
          path: ${{ runner.temp }}/hermetic-unit-tests.log
          if-no-files-found: warn
          retention-days: 1

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      rabbitmq:
        image: rabbitmq:4.3.4-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      couchdb:
        image: couchdb:3.5.2
        ports:
          - 5984:5984
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        options: >-
          --health-cmd "curl -f http://localhost:5984/_up || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Wait for services and initialize
        run: |
          echo "Waiting for RabbitMQ..."
          timeout 60 bash -c 'until curl -f http://localhost:15672 > /dev/null 2>&1; do sleep 2; done'

          echo "Waiting for CouchDB..."
          timeout 60 bash -c 'until curl -f http://localhost:5984/_up > /dev/null 2>&1; do sleep 2; done'

          echo "Creating CouchDB database..."
          curl --fail --silent --show-error \
            --request PUT \
            http://admin:password@localhost:5984/starintel \
            >/dev/null

          echo "Services ready!"

      - name: Run service-backed integration tests
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
        run: nix run .#star-integration-tests
