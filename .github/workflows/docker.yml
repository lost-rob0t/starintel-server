name: Container Stack

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, codex/starintel-0101-ingest]

concurrency:
  group: container-candidate-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'TESTED_HEAD=%s\nBASE_SHA=%s\n' "$EXPECTED_SHA" "$BASE_SHA"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run image, health, authentication, FTS, and persistence tests
        run: ./scripts/stack-test.sh

      - name: Upload sanitized stack diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-test-diagnostics
          path: stack-test-artifacts/
          if-no-files-found: error
          retention-days: 7

      # Candidate publication is not a versioned release. Release gates live in
      # doc/production-release.md; never overwrite a semantic version here.
      - name: Publish commit candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          candidate="ghcr.io/${owner}/starintel-server:sha-${GITHUB_SHA}"
          echo "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Repeated CI must not overwrite even a commit candidate.
          # Inspect failures other than explicit absence fail closed.
          if docker manifest inspect "$candidate" >/dev/null 2>manifest-error.txt; then
            echo 'Candidate already exists; refusing to replace it.'
            exit 0
          fi
          if ! grep -q 'manifest unknown' manifest-error.txt; then
            echo 'Cannot establish candidate absence; refusing publication.' >&2
            exit 1
          fi
          docker tag starintel/server:0.1.0 "$candidate"
          docker push "$candidate"
