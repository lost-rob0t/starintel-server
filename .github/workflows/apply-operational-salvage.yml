name: Apply operational salvage

on:
  push:
    branches:
      - agent/salvage-pr54-operational
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/salvage-pr54-operational' || github.ref_name == 'agent/salvage-pr54-operational'
    runs-on: ubuntu-latest
    steps:
      - name: Check out salvage branch
        uses: actions/checkout@v4
        with:
          ref: agent/salvage-pr54-operational
          fetch-depth: 0

      - name: Apply and squash salvage patch
        id: apply
        shell: bash
        run: |
          set +e
          set -o pipefail
          exec > >(tee /tmp/salvage-bootstrap.log) 2>&1

          if [[ ! -d .github/salvage-patch ]]; then
            echo "salvage patch already applied"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          wc -c .github/salvage-patch/*
          sha256sum .github/salvage-patch/*
          cat .github/salvage-patch/* > /tmp/salvage.patch.b64
          wc -c /tmp/salvage.patch.b64
          sha256sum /tmp/salvage.patch.b64

          base64 --decode /tmp/salvage.patch.b64 > /tmp/salvage.patch.gz || exit $?
          gzip -t /tmp/salvage.patch.gz || exit $?
          gzip -dc /tmp/salvage.patch.gz > /tmp/salvage.patch
          wc -c /tmp/salvage.patch
          sha256sum /tmp/salvage.patch

          git apply --check --verbose --whitespace=error-all /tmp/salvage.patch || exit $?
          git apply --index --whitespace=error-all /tmp/salvage.patch || exit $?

          python -m unittest discover -s tests -p 'test_operational_salvage_contract.py' -v || exit $?
          git diff --cached --check || exit $?

          rm -rf .github/salvage-patch
          rm -f .github/salvage.trigger
          rm -f .github/workflows/operational-salvage.yml
          rm -rf tests/__pycache__
          git add -A

          git fetch origin dev
          git reset --soft origin/dev
          git diff --cached --check || exit $?
          git commit -m "Salvage durable operational runtime" || exit $?
          git push --force-with-lease origin HEAD:agent/salvage-pr54-operational
          exit $?

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-salvage-bootstrap
          path: |
            /tmp/salvage-bootstrap.log
            /tmp/salvage.patch.b64
            /tmp/salvage.patch.gz
            /tmp/salvage.patch
          if-no-files-found: warn
