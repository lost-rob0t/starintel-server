name: Sync operation runtime once

on:
  workflow_dispatch:
  push:
    branches: [feat/operation-object-151]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operation-object-151

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Pin exact corrected star-cl merge and remove stale references
        shell: bash
        run: |
          set -euo pipefail
          expected="9ce8f88f57fb7ac143851f7fd2c75dccd6a40cc3"
          old="138e3ff3334954491db862ab583058058e35e64d"
          remote="$(git ls-remote https://github.com/lost-rob0t/star-cl.git refs/heads/master | cut -f1)"
          test "$remote" = "$expected"

          nix flake lock --update-input star-cl
          test "$(jq -r '.nodes["star-cl"].locked.rev' flake.lock)" = "$expected"

          while IFS= read -r -d '' path; do
            sed -i "s/$old/$expected/g" "$path"
          done < <(git grep -IlZ "$old" -- . ':!.github/workflows/sync-operation-runtime-once.yml' || true)

          grep -q "github-$expected" qlfile.lock
          if git grep -n "$old" -- . ':!.github/workflows/sync-operation-runtime-once.yml'; then
            echo "::error::stale star-cl merge pin remains"
            exit 1
          fi

      - name: Regenerate checked-in API reference
        run: nix run .#gen-api-docs

      - name: Verify docstring coverage
        run: nix run .#doc-coverage-test

      - name: Commit synchronized runtime and docs
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if git diff --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: consume corrected operation runtime and refresh API docs"
          git push origin HEAD:feat/operation-object-151
