name: Operational salvage

on:
  push:
    branches:
      - agent/salvage-pr54-operational
  pull_request:
    paths-ignore:
      - '.github/workflows/local-persistence.yml'
      - 'scripts/ci-local-persistence.py'
      - 'tests/test_local_persistence_ci.py'
      - 'doc/local-persistence-ci.md'
      - 'doc/testing.md'
      - '.github/workflows/smoke-tests.yml'
      - '.github/workflows/docker.yml'
      - '.github/workflows/doc-coverage.yml'
      - '.github/workflows/starintel-schema-lock.yml'
      - '.github/workflows/operational-salvage.yml'
    branches:
      - master
      - codex/starintel-0101-ingest

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'TESTED_HEAD=%s\nBASE_SHA=%s\n' "$EXPECTED_SHA" "$BASE_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install deployment contract test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Run operational source contract
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check patch hygiene
        run: git diff --check

