name: Reconcile dev into PR 89

on:
  push:
    branches:
      - agent/reconcile-master-into-dev-2026-07-31
    paths:
      - .github/workflows/reconcile-dev-into-pr89.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-pr89
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/reconcile-master-into-dev-2026-07-31
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Merge dev, resolve overlaps, validate, and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "starintel-reconciliation-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin dev

          set +e
          git merge --no-ff --no-commit origin/dev
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ] && ! git diff --name-only --diff-filter=U | grep -q .; then
            echo "Merge failed without ordinary file conflicts."
            exit "$merge_status"
          fi

          python3 <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from pathlib import Path

          EXPECTED_CONFLICTS = {
              "source/actor-systems/event-actor.lisp",
              "source/gserver-settings.lisp",
              "source/package.lisp",
              "source/starintel-gserver.asd",
              "source/views/data.json",
          }

          def run(*args: str) -> str:
              return subprocess.check_output(args, text=True)

          conflicts = {
              line.strip()
              for line in run("git", "diff", "--name-only", "--diff-filter=U").splitlines()
              if line.strip()
          }
          unexpected = conflicts - EXPECTED_CONFLICTS
          if unexpected:
              raise SystemExit(f"Unexpected merge conflicts: {sorted(unexpected)}")

          def stage_text(stage: int, path: str) -> str:
              return run("git", "show", f":{stage}:{path}")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          def matching_paren(source: str, start: int) -> int:
              depth = 0
              in_string = False
              escaped = False
              line_comment = False
              block_comment = 0
              index = start
              while index < len(source):
                  char = source[index]
                  nxt = source[index + 1] if index + 1 < len(source) else ""
                  if line_comment:
                      if char == "\n":
                          line_comment = False
                      index += 1
                      continue
                  if block_comment:
                      if char == "#" and nxt == "|":
                          block_comment += 1
                          index += 2
                          continue
                      if char == "|" and nxt == "#":
                          block_comment -= 1
                          index += 2
                          continue
                      index += 1
                      continue
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          in_string = False
                      index += 1
                      continue
                  if char == ";":
                      line_comment = True
                  elif char == "#" and nxt == "|":
                      block_comment = 1
                      index += 2
                      continue
                  elif char == '"':
                      in_string = True
                  elif char == "(":
                      depth += 1
                  elif char == ")":
                      depth -= 1
                      if depth == 0:
                          return index
                  index += 1
              raise ValueError("Unbalanced Lisp form")

          def top_level_forms(source: str) -> list[tuple[int, int, str]]:
              forms: list[tuple[int, int, str]] = []
              depth = 0
              in_string = False
              escaped = False
              line_comment = False
              block_comment = 0
              start = None
              index = 0
              while index < len(source):
                  char = source[index]
                  nxt = source[index + 1] if index + 1 < len(source) else ""
                  if line_comment:
                      if char == "\n":
                          line_comment = False
                      index += 1
                      continue
                  if block_comment:
                      if char == "#" and nxt == "|":
                          block_comment += 1
                          index += 2
                          continue
                      if char == "|" and nxt == "#":
                          block_comment -= 1
                          index += 2
                          continue
                      index += 1
                      continue
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          in_string = False
                      index += 1
                      continue
                  if char == ";":
                      line_comment = True
                  elif char == "#" and nxt == "|":
                      block_comment = 1
                      index += 2
                      continue
                  elif char == '"':
                      in_string = True
                  elif char == "(":
                      if depth == 0:
                          start = index
                      depth += 1
                  elif char == ")":
                      depth -= 1
                      if depth == 0 and start is not None:
                          forms.append((start, index + 1, source[start:index + 1]))
                          start = None
                  index += 1
              if depth != 0:
                  raise ValueError("Unbalanced top-level Lisp source")
              return forms

          def replace_named_form(source: str, operator: str, name: str, replacement: str) -> str:
              pattern = re.compile(
                  rf"(?m)^\s*\({re.escape(operator)}\s+{re.escape(name)}(?=\s|\()"
              )
              match = pattern.search(source)
              if not match:
                  raise ValueError(f"Could not find ({operator} {name} ...)")
              start = source.find("(", match.start())
              end = matching_paren(source, start)
              return source[:start] + replacement.rstrip() + source[end + 1:]

          def package_name(form: str) -> str | None:
              match = re.match(r"\s*\(uiop:define-package\s+([^\s()]+)", form)
              return match.group(1).lower() if match else None

          def export_tokens(form: str) -> list[str]:
              marker = form.find("(:export")
              if marker < 0:
                  return []
              end = matching_paren(form, marker)
              return re.findall(r"#:[^\s()]+", form[marker:end + 1])

          def append_exports(form: str, additions: list[str]) -> str:
              marker = form.find("(:export")
              if marker < 0 or not additions:
                  return form
              end = matching_paren(form, marker)
              existing = set(export_tokens(form))
              missing = [token for token in additions if token not in existing]
              if not missing:
                  return form
              insertion = "".join(f"\n   {token}" for token in missing)
              return form[:end] + insertion + form[end:]

          # source/gserver-settings.lisp: keep hardened env/auth handling and add
          # dev's bounded retry/quarantine controls verbatim.
          if "source/gserver-settings.lisp" in conflicts:
              ours = stage_text(2, "source/gserver-settings.lisp").rstrip() + "\n"
              theirs = stage_text(3, "source/gserver-settings.lisp")
              marker = ";;;; *** Rabbit retry and quarantine"
              if marker not in theirs:
                  raise SystemExit("Retry settings block missing from dev")
              retry_block = theirs[theirs.index(marker):].strip()
              if "*rabbit-max-retries*" not in ours:
                  ours = ours.rstrip() + "\n\n" + retry_block + "\n"
              write("source/gserver-settings.lisp", ours)

          # source/package.lisp: use dev's operational namespace surface and
          # union in master-only auth/HTTP/Rabbit exports and packages.
          if "source/package.lisp" in conflicts:
              ours = stage_text(2, "source/package.lisp")
              theirs = stage_text(3, "source/package.lisp")
              ours_forms = {
                  package_name(form): form
                  for _, _, form in top_level_forms(ours)
                  if package_name(form)
              }
              result = theirs
              replacements: list[tuple[int, int, str]] = []
              result_forms = top_level_forms(result)
              present_names = set()
              for start, end, form in result_forms:
                  name = package_name(form)
                  if not name:
                      continue
                  present_names.add(name)
                  ours_form = ours_forms.get(name)
                  if ours_form:
                      merged_form = append_exports(form, export_tokens(ours_form))
                      replacements.append((start, end, merged_form))
              for start, end, merged_form in reversed(replacements):
                  result = result[:start] + merged_form + result[end:]
              missing_forms = [
                  form for name, form in ours_forms.items() if name not in present_names
              ]
              if missing_forms:
                  result = result.rstrip() + "\n\n" + "\n\n".join(missing_forms) + "\n"
              write("source/package.lisp", result)

          # source/starintel-gserver.asd: explicit union with dependency-safe order.
          if "source/starintel-gserver.asd" in conflicts:
              asd = r'''(asdf:defsystem :starintel-gserver
  :version "0.2.0"
  :description "Hackable StarIntel processing, authorization, and access server."
  :author "nsaspy@airmail.cc"
  :license "GPL-3.0-or-later"
  :serial t
  :build-operation program-op
  :build-pathname "star-server"
  :entry-point "star::main"
  :in-order-to ((test-op (test-op "starintel-gserver-tests")))
  :components
  ((:file "document-access-package")
   (:file "document-access")
   (:file "consumers/package")
   (:file "consumers/consumers")
   (:file "consumers/owner-fixes")
   (:file "consumers/retry-policy")
   (:file "producers/package")
   (:file "producers/producers")
   (:file "package")
   (:file "gserver-settings")
   (:file "databases/couchdb")
   (:file "databases/export")
   (:file "databases/outbox")
   (:file "databases/view-registry-package")
   (:file "databases/view-registry")
   (:file "databases/document-update-package")
   (:file "databases/document-update")
   (:file "databases/quarantine")
   (:file "databases/target-acceptance")
   (:file "auth/core")
   (:file "auth/verification-hardening")
   (:file "auth/immutability")
   (:file "auth/store")
   (:file "init-loader")
   (:file "actors")
   (:file "actors/couchdb-service")
   (:file "target-repository")
   (:file "target-recovery")
   (:file "target-dispatch")
   (:file "target-dispatch-fixes")
   (:file "actor-systems/event-actor")
   (:file "actor-systems/matcher-actor")
   (:file "rabbit")
   (:file "frontends/http-api")
   (:file "frontends/http-document-update")
   (:file "frontends/http-view-registry")
   (:file "frontends/http-boundary-core")
   (:file "frontends/http-auth")
   (:file "frontends/http-bulk-jobs")
   (:file "frontends/http-boundary-routes")
   (:file "frontends/http-auth-routes")
   (:file "frontends/http-auth-job-routes")
   (:file "main"))
  :depends-on
  (#:starintel
   #:cl-couch
   #:serapeum
   #:alexandria
   #:cl-rabbit
   #:sento
   #:babel
   #:yason
   #:ironclad
   #:dexador
   #:uuid
   #:anypool
   #:clack
   #:lack/middleware/accesslog
   #:clack-handler-hunchentoot
   #:ningle
   #:clingon
   #:slynk
   #:nhooks
   #:lparallel
   #:cl-stream
   #:cl-ppcre
   #:cms-ulid
   #:bordeaux-threads
   #:jsown
   #:closer-mop))

;;;; StarIntel Gserver is a processing framework for StarIntel documents.
;;;; Runtime documentation lives in ../docs and must track behavior changes.
'''
              write("source/starintel-gserver.asd", asd)

          # source/views/data.json: dev wins for common operational views; retain
          # master-only scoped lookup views.
          if "source/views/data.json" in conflicts:
              ours = json.loads(stage_text(2, "source/views/data.json"))
              theirs = json.loads(stage_text(3, "source/views/data.json"))
              merged = theirs
              merged.setdefault("views", {})
              for name, definition in ours.get("views", {}).items():
                  merged["views"].setdefault(name, definition)
              write("source/views/data.json", json.dumps(merged, separators=(",", ":")) + "\n")

          # source/actor-systems/event-actor.lisp: preserve strict codec and
          # idempotent persistence, but return dev's owner-thread settlements.
          if "source/actor-systems/event-actor.lisp" in conflicts:
              event_source = stage_text(2, "source/actor-systems/event-actor.lisp")
              event_source = replace_named_form(
                  event_source,
                  "defun",
                  "actor-event-settlement",
                  r'''(defun actor-event-settlement (event persistence-result)
  (declare (ignore event))
  (cond
    ((not (typep persistence-result 'couchdb-result))
     (star.consumers:settlement-retry
      :persistence-protocol-error
      persistence-result))
    ((member (couchdb-result-status persistence-result)
             '(:success :exists :conflict))
     (star.consumers:settlement-ack
      (if (eq :success (couchdb-result-status persistence-result))
          :persisted
          :duplicate)))
    (t
     (star.consumers:settlement-retry
      :persistence-failed
      (couchdb-result-error-message persistence-result)))))''',
              )
              event_source = replace_named_form(
                  event_source,
                  "defun",
                  "process-event-delivery",
                  r'''(defun process-event-delivery (payload &key (persist-fn #'persist-actor-event))
  "Decode, validate, persist idempotently, and return an owner-thread settlement."
  (handler-case
      (let ((event (decode-actor-event payload)))
        (actor-event-settlement event (funcall persist-fn event)))
    (invalid-actor-event (condition)
      (star.consumers:settlement-dead-letter
       :invalid-event
       condition))
    (error (condition)
      (star.consumers:settlement-retry
       :event-handler-error
       condition))))''',
              )
              event_source = replace_named_form(
                  event_source,
                  "defun",
                  "start-event-consumer",
                  r'''(defun start-event-consumer (n)
  "Start durable owner-thread event consumers with bounded retry and quarantine."
  (let ((consumer
          (star.consumers:create-rabbit-consumer
           :name "event-consumers"
           :n n
           :host star:*rabbit-address*
           :port star:*rabbit-port*
           :username star:*rabbit-user*
           :password star:*rabbit-password*
           :queue-name +event-queue+
           :queue-durable t
           :exchange-name +event-exchange+
           :exchange-type "topic"
           :exchange-durable t
           :routing-key +event-routing-key+
           :test-fn #'identity
           :handler-fn #'handle-event-message
           :on-error :retry
           :on-filter :filtered-ack
           :max-retries star:*rabbit-max-retries*
           :retry-base-delay-ms star:*rabbit-retry-base-delay-ms*
           :retry-max-delay-ms star:*rabbit-retry-max-delay-ms*
           :retry-jitter-ratio star:*rabbit-retry-jitter-ratio*
           :quarantine-fn #'star.rabbit:persist-quarantine-record
           :quarantine-exchange star:*rabbit-quarantine-exchange*
           :quarantine-queue star:*rabbit-quarantine-queue*)))
    (star.consumers:start-consumer consumer)))''',
              )
              write("source/actor-systems/event-actor.lisp", event_source)

          # Update master-side event tests to the reconciled settlement protocol.
          test_path = Path("t/event-actor-test.lisp")
          if test_path.exists():
              tests = test_path.read_text(encoding="utf-8")
              tests = tests.replace(
                  "star.consumers:rabbit-settlement-action",
                  "star.consumers:consumer-settlement-action",
              ).replace(
                  "star.consumers:rabbit-settlement-reason",
                  "star.consumers:consumer-settlement-reason",
              )

              def transform_test(source: str, name: str, transform) -> str:
                  pattern = re.compile(rf"(?m)^\s*\(test\s+{re.escape(name)}(?=\s|\()")
                  match = pattern.search(source)
                  if not match:
                      raise ValueError(f"Missing test {name}")
                  start = source.find("(", match.start())
                  end = matching_paren(source, start)
                  form = source[start:end + 1]
                  return source[:start] + transform(form) + source[end + 1:]

              tests = transform_test(
                  tests,
                  "invalid-event-is-quarantined-and-settled",
                  lambda form: re.sub(
                      r"\s*\(is-false\s*\(star\.consumers:rabbit-settlement-requeue settlement\)\)",
                      "",
                      form.replace(":nack", ":dead-letter"),
                      flags=re.S,
                  ),
              )
              tests = transform_test(
                  tests,
                  "persistence-failure-is-requeued",
                  lambda form: re.sub(
                      r"\s*\(is-true\s*\(star\.consumers:rabbit-settlement-requeue settlement\)\)",
                      "",
                      form.replace(":nack", ":retry"),
                      flags=re.S,
                  ),
              )
              for obsolete in (
                  "rabbit-settlement-uses-owning-connection-and-delivery-tag",
                  "event-consumer-declares-durable-dead-letter-policy",
              ):
                  tests = transform_test(tests, obsolete, lambda form: "")
              tests = tests.rstrip() + r'''

(test event-consumer-builds-bounded-retry-runtime
  (let* ((consumer
           (star.consumers:create-rabbit-consumer
            :name "events-test"
            :queue-name "events"
            :exchange-name "events"
            :routing-key "event.#"
            :queue-durable t
            :exchange-durable t
            :max-retries 4
            :quarantine-exchange "events.quarantine"
            :quarantine-queue "events.quarantine.queue"
            :handler-fn #'identity))
         (stream (star.consumers:consumer-stream consumer)))
    (is (typep stream 'star.consumers:retrying-rabbit-queue-stream))
    (is-true (star.consumers:rabbit-stream-queue-durable-p stream))
    (is-true (star.consumers:rabbit-exchange-durable-p stream))
    (is (= 4
           (star.consumers:retry-policy-max-retries
            (star.consumers:retry-stream-policy stream))))))
'''
              test_path.write_text(tests, encoding="utf-8")
          PY

          git add \
            source/actor-systems/event-actor.lisp \
            source/gserver-settings.lisp \
            source/package.lisp \
            source/starintel-gserver.asd \
            source/views/data.json \
            t/event-actor-test.lisp

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved conflicts remain:"
            echo "$unresolved"
            exit 1
          fi

          git rm .github/workflows/reconcile-dev-into-pr89.yml

          python3 scripts/check-starintel-schema-lock.py
          python3 -m unittest scripts.test_dedupe_relations
          python3 -m unittest tests.test_operational_salvage_contract
          nix build
          nix run .#star-unit-tests
          ./scripts/stack-test.sh

          git status --short
          git commit -m "Merge dev operational salvage into reconciliation branch"
          git push origin HEAD:agent/reconcile-master-into-dev-2026-07-31
