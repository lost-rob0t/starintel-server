name: Reconcile stable release

on:
  push:
    branches:
      - release/dev-to-master-2026-07-26
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'release/dev-to-master-2026-07-26' || github.ref_name == 'release/dev-to-master-2026-07-26'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/dev-to-master-2026-07-26

      - name: Merge stable history into dev release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master

          if git merge-base --is-ancestor origin/master HEAD; then
            echo "master history already integrated"
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit -X ours origin/master
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              if git cat-file -e "HEAD:$path" 2>/dev/null; then
                git checkout --ours -- "$path"
                git add -- "$path"
              else
                git rm -f --ignore-unmatch -- "$path"
              fi
            done < <(git diff --name-only --diff-filter=U)
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unresolved" ]]; then
            printf '%s\n' "$unresolved"
            exit 1
          fi

          git commit -m "Reconcile dev with stable master history"
          git push origin HEAD:release/dev-to-master-2026-07-26
