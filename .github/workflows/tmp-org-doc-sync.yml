name: Temporary PR 181 hardening

on:
  push:
    branches:
      - feat/ingest-tenant-adapter

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/ingest-tenant-adapter
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Authorize persisted tenant before egress redaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('source/frontends/http-authorization-routes.lisp')
          text = path.read_text()
          old = '''        (star.authorization:authorized-fetch-document
         document-id
         (lambda (id)
           (strip-server-tenant-fields
            (cl-couch:get-document
             client star:*couchdb-default-database* id)))
         :principal (current-policy-principal)
         :metadata
         (route-policy-metadata route "GET"))))))'''
          new = '''        (strip-server-tenant-fields
         (star.authorization:authorized-fetch-document
          document-id
          (lambda (id)
            (cl-couch:get-document
             client star:*couchdb-default-database* id))
          :principal (current-policy-principal)
          :metadata
          (route-policy-metadata route "GET")))))))'''
          if old not in text:
              raise SystemExit('expected GET authorization snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run unit tests
        run: nix run .#star-unit-tests

      - name: Regenerate org-doc API reference
        run: nix run .#gen-api-docs

      - name: Commit hardening and generated docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/frontends/http-authorization-routes.lisp doc/api/
          if git diff --cached --quiet; then
            echo 'no changes to commit'
            exit 0
          fi
          git commit -m 'fix: authorize persisted tenant before egress redaction'
          git push origin HEAD:feat/ingest-tenant-adapter
