name: Release diagnostics

on:
  push:
    branches:
      - release/dev-to-master-2026-07-26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run unit suite
        shell: bash
        run: |
          set +e
          set -o pipefail
          nix run .#star-unit-tests 2>&1 | tee /tmp/unit.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-unit-log
          path: /tmp/unit.log

  integration:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.3.4-management
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      couchdb:
        image: couchdb:3.5.2
        ports: ["5984:5984"]
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        options: >-
          --health-cmd "curl -f http://localhost:5984/_up || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Initialize services
        run: |
          curl --fail --request PUT http://admin:password@localhost:5984/starintel || true
      - name: Run integration suite
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
        shell: bash
        run: |
          set +e
          set -o pipefail
          nix run .#star-integration-tests 2>&1 | tee /tmp/integration.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-integration-log
          path: /tmp/integration.log

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run stack suite
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./scripts/stack-test.sh 2>&1 | tee /tmp/stack.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-stack-log
          path: /tmp/stack.log
