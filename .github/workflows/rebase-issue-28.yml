name: Rebase issue 28 authorization onto dev

on:
  push:
    branches:
      - agent/issue-28-authorization-policy
    paths:
      - .github/workflows/rebase-issue-28.yml
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/rebase-issue-28.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebase-issue-28-authorization
  cancel-in-progress: false

jobs:
  merge-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out authorization branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-28-authorization-policy
          fetch-depth: 0

      - name: Merge dev with guarded conflict resolution
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "starintel-authorization-rebase"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin dev

          set +e
          git merge --no-ff --no-commit origin/dev
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "$merge_status" -ne 0 ] && [ -z "$conflicts" ]; then
            echo "Merge failed without ordinary file conflicts."
            exit "$merge_status"
          fi

          expected_conflicts=$'source/starintel-gserver.asd\nsource/views/search.json'
          unexpected="$(comm -23 \
            <(printf '%s\n' "$conflicts" | sed '/^$/d' | sort) \
            <(printf '%s\n' "$expected_conflicts" | sort))"
          if [ -n "$unexpected" ]; then
            echo "Unexpected conflicts:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          for path in source/starintel-gserver.asd source/views/search.json; do
            if grep -Fxq "$path" <<<"$conflicts"; then
              git checkout --ours -- "$path"
              git add "$path"
            fi
          done

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved conflicts remain:"
            printf '%s\n' "$unresolved"
            exit 1
          fi

          git rm .github/workflows/rebase-issue-28.yml
          python3 scripts/check-starintel-schema-lock.py
          python3 -m unittest scripts.test_dedupe_relations
          python3 -m unittest tests.test_operational_salvage_contract
          git commit -m "Merge reconciled dev into authorization policy branch"
          git push origin HEAD:agent/issue-28-authorization-policy
