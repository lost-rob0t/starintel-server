name: Request Audit
on:
  push:
    branches: ["codex/200-request-audit-refusal-20260916"]
  pull_request:
    paths:
      - 'addons/request-audit/**'
      - 'tools/request-audit/**'
      - 'tests/request-audit/**'
      - 'starintel-request-audit.asd'
      - '.github/workflows/request-audit.yml'
permissions:
  contents: read
concurrency:
  group: request-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pure-lisp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y sbcl
      - run: sbcl --script tests/request-audit/core.lisp
