name: Audit source focused tests
on:
  pull_request:
    paths:
      - 'tools/audit/**'
      - 'addons/audit/**'
      - 'starintel-audit.asd'
      - '.github/workflows/audit-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: PYTHONPATH=tools/audit python -m unittest discover -s tools/audit/tests -v
      - run: python -m compileall -q tools/audit
