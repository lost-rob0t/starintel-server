name: Canonical StarIntel schema lock

on:
  pull_request:
    branches:
      - master
      - codex/starintel-0101-ingest
  push:
    branches:
      - master
      - "agent/**"
    paths:
      - "schema/starintel-schema.lock.json"
      - "scripts/check-starintel-schema-lock.py"
      - "scripts/sync-starintel-schema.py"
      - "scripts/check-starintel-dependency-lock.py"
      - "flake.lock"
      - "qlfile"
      - "qlfile.lock"
      - "schemas/starintel-0.10.1/**"
      - ".github/workflows/starintel-schema-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required-dtypes-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'TESTED_HEAD=%s\nBASE_SHA=%s\n' "$EXPECTED_SHA" "$BASE_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify immutable StarLang-generated release
        run: python scripts/check-starintel-schema-lock.py
      - name: Verify star-cl consumes the identical release
        run: python scripts/check-starintel-dependency-lock.py
