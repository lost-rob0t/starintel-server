name: Refresh pinned Nix mirror lock

on:
  push:
    branches:
      - "agent/263-couchdb-geo-bbox"
    paths:
      - "flake.nix"
      - ".github/workflows/refresh-nix-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/263-couchdb-geo-bbox"
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Refresh exact pinned inputs
        shell: bash
        run: |
          set -euo pipefail
          nix flake lock --update-input star-cl --update-input org-doc
          git diff -- flake.lock

      - name: Commit refreshed lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          git config user.name "starintel-nix-lock-bot"
          git config user.email "starintel-nix-lock-bot@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(nix): refresh public mirror lock"
          git push origin HEAD:agent/263-couchdb-geo-bbox
